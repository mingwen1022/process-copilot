[project]
name = "process-management-agent"
version = "0.1.0"
description = "V1 process design agent for extracting workflow definitions from raw source notes."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.3",
    "langchain>=1.1.0",
    "langchain-aws>=1.0.0",
    "langchain-chroma>=1.1.0",
    "langgraph>=1.2.0",
    "openpyxl>=3.1.5",
    "pydantic>=2.13.0",
    "pytest>=9.0.0",
    "python-dotenv>=1.0.0",
    "sqlglot>=30.12.0",
    "uvicorn[standard]>=0.49.0",
]

[dependency-groups]
dev = [
    "pillow>=12.2.0",
    "python-docx>=1.2.0",
    "reportlab>=5.0.0",
]
