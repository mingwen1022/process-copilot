<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>流程 AI 设计台 Demo</title>
  <style>
    :root {
      --bg: #eef1f5;
      --surface: #ffffff;
      --surface-2: #f8fafc;
      --ink: #162033;
      --muted: #667085;
      --line: #d9e0ea;
      --blue: #1f5fbf;
      --blue-soft: #e8f0ff;
      --green: #177245;
      --green-soft: #e7f6ee;
      --amber: #9b6500;
      --amber-soft: #fff4d7;
      --red: #b42318;
      --red-soft: #fdeceb;
      --violet: #6842c2;
      --violet-soft: #f0ebff;
      --shadow: 0 12px 28px rgba(16, 24, 40, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", Arial, sans-serif;
      letter-spacing: 0;
    }

    button, input {
      font: inherit;
    }

    button {
      cursor: pointer;
      border: 0;
    }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 220px minmax(0, 1fr);
    }

    .sidebar {
      background: #111827;
      color: white;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 8px 18px;
      border-bottom: 1px solid rgba(255,255,255,0.12);
    }

    .brand-mark {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      background: linear-gradient(135deg, #6ee7b7, #3b82f6);
      display: grid;
      place-items: center;
      color: #0f172a;
      font-weight: 800;
    }

    .brand h1 {
      margin: 0;
      font-size: 16px;
      line-height: 1.2;
    }

    .brand p {
      margin: 2px 0 0;
      color: #aab4c5;
      font-size: 12px;
    }

    .side-title {
      color: #aab4c5;
      font-size: 12px;
      margin: 18px 8px 8px;
    }

    .case-list {
      display: grid;
      gap: 8px;
    }

    .case-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 64px;
      gap: 7px;
      align-items: stretch;
    }

    .mode-list {
      display: grid;
      gap: 8px;
      margin-top: 10px;
    }

    .mode-item {
      width: 100%;
      min-height: 48px;
      text-align: left;
      color: #dfe7f3;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px;
      padding: 10px;
      font-weight: 760;
    }

    .mode-item span {
      display: block;
      margin-top: 3px;
      color: #aab4c5;
      font-size: 12px;
      font-weight: 500;
      line-height: 1.3;
    }

    .mode-item.active {
      background: #f8fafc;
      color: var(--ink);
      border-color: #f8fafc;
    }

    .mode-item.active span {
      color: var(--muted);
    }

    .case-item {
      width: 100%;
      min-height: 68px;
      text-align: left;
      color: #344054;
      background: #fbfcfe;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px;
    }

    .case-run-link {
      min-height: 68px;
      border-radius: 8px;
      border: 1px solid #bfd1f5;
      background: var(--blue-soft);
      color: var(--blue);
      display: grid;
      place-items: center;
      font-size: 13px;
      font-weight: 760;
    }

    .case-item.active {
      background: var(--blue-soft);
      color: var(--ink);
      border-color: #bfd1f5;
    }

    .case-name {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      font-weight: 700;
      font-size: 14px;
    }

    .case-meta {
      margin-top: 6px;
      color: inherit;
      opacity: 0.72;
      font-size: 12px;
      line-height: 1.35;
    }

    .file-list {
      margin-top: 10px;
      display: grid;
      gap: 6px;
    }

    .file-chip {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: #344054;
      background: #f8fafc;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 6px 8px;
      font-size: 12px;
    }

    .sidebar-footer {
      margin-top: auto;
      color: #aab4c5;
      font-size: 12px;
      padding: 14px 8px 4px;
      border-top: 1px solid rgba(255,255,255,0.12);
    }

    .main {
      min-width: 0;
      padding: 18px;
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr);
      gap: 14px;
    }

    .topbar {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      box-shadow: var(--shadow);
    }

    .title h2 {
      margin: 0;
      font-size: 20px;
      line-height: 1.25;
    }

    .title p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 13px;
      max-width: 760px;
    }

    .actions {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-shrink: 0;
    }

    .btn {
      height: 38px;
      padding: 0 14px;
      border-radius: 7px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      white-space: nowrap;
    }

    .btn-primary {
      background: var(--blue);
      color: white;
    }

    .btn-secondary {
      background: #eef2f7;
      color: var(--ink);
      border: 1px solid var(--line);
    }

    .btn-icon {
      width: 38px;
      padding: 0;
    }

    .metric-row {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }

    .metric {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
    }

    .metric-label {
      color: var(--muted);
      font-size: 12px;
    }

    .metric-value {
      margin-top: 4px;
      font-size: 22px;
      line-height: 1.2;
      font-weight: 760;
    }

    .metric.blue { background: var(--blue-soft); border-color: #bfd1f5; }
    .metric.green { background: var(--green-soft); border-color: #b6dfca; }
    .metric.amber { background: var(--amber-soft); border-color: #efd691; }
    .metric.violet { background: var(--violet-soft); border-color: #d6c8ff; }

    .workspace {
      min-height: 0;
      display: grid;
      grid-template-columns: 320px minmax(0, 1fr) 340px;
      gap: 14px;
    }

    .workspace.design-mode .library-panel {
      display: none;
    }

    .workspace.library-mode .conversation-panel {
      display: none;
    }

    .panel {
      min-width: 0;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    .conversation-panel,
    .library-panel {
      min-width: 0;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    .panel-head {
      min-height: 54px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: #fbfcfe;
    }

    .panel-title {
      font-weight: 760;
      font-size: 15px;
    }

    .tabs {
      display: flex;
      align-items: center;
      gap: 4px;
      background: #eef2f7;
      padding: 4px;
      border-radius: 7px;
      overflow-x: auto;
    }

    .tab {
      min-height: 30px;
      padding: 0 10px;
      border-radius: 5px;
      background: transparent;
      color: #344054;
      white-space: nowrap;
      font-size: 13px;
      font-weight: 650;
    }

    .tab.active {
      background: white;
      color: var(--blue);
      box-shadow: 0 1px 2px rgba(16, 24, 40, 0.08);
    }

    .doc-body {
      min-height: 600px;
      max-height: calc(100vh - 236px);
      overflow: auto;
      padding: 14px;
    }

    .conversation-body {
      height: calc(100vh - 236px);
      min-height: 600px;
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto auto;
      gap: 12px;
      padding: 14px;
    }

    .chat-list {
      min-height: 0;
      overflow: auto;
      display: grid;
      align-content: start;
      gap: 10px;
      padding-right: 2px;
    }

    .chat-message {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px;
      background: #fbfcfe;
      font-size: 13px;
      line-height: 1.45;
    }

    .chat-message.user {
      background: var(--blue-soft);
      border-color: #bfd1f5;
    }

    .chat-message strong {
      display: block;
      margin-bottom: 4px;
      font-size: 12px;
      color: var(--muted);
    }

    .source-upload {
      border: 1px dashed var(--line);
      border-radius: 8px;
      padding: 10px;
      background: #fbfcfe;
    }

    .source-upload label {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 38px;
      border-radius: 7px;
      background: #eef2f7;
      color: var(--ink);
      font-size: 13px;
      font-weight: 760;
    }

    .source-upload input {
      display: none;
    }

    .composer {
      display: grid;
      gap: 8px;
    }

    .composer textarea {
      width: 100%;
      min-height: 84px;
      resize: vertical;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px;
      color: var(--ink);
      background: white;
      line-height: 1.45;
    }

    .composer-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .library-body {
      height: calc(100vh - 236px);
      min-height: 600px;
      overflow: auto;
      padding: 14px;
      display: grid;
      align-content: start;
      gap: 12px;
    }

    .search-input {
      width: 100%;
      height: 38px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0 10px;
      color: var(--ink);
      background: white;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      table-layout: auto;
    }

    th, td {
      border: 1px solid var(--line);
      padding: 8px 9px;
      text-align: left;
      vertical-align: top;
    }

    th {
      position: sticky;
      top: 0;
      z-index: 1;
      background: #f1f5f9;
      color: #344054;
      font-weight: 760;
    }

    td {
      background: white;
    }

    td.row-group {
      background: #f8fbff;
      vertical-align: middle;
      font-weight: 650;
    }

    td.row-group.subtle {
      color: #475467;
      font-weight: 500;
    }

    .table-wrap {
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    .meta-grid {
      display: grid;
      grid-template-columns: 140px minmax(0, 1fr);
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
    }

    .meta-k, .meta-v {
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
    }

    .meta-k {
      background: #f1f5f9;
      color: #475467;
      font-weight: 700;
    }

    .meta-v {
      background: white;
    }

    .meta-k:nth-last-child(2), .meta-v:last-child {
      border-bottom: 0;
    }

    .flow-canvas {
      min-height: 520px;
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: auto;
      background:
        linear-gradient(#eef2f7 1px, transparent 1px),
        linear-gradient(90deg, #eef2f7 1px, transparent 1px);
      background-size: 22px 22px;
      background-color: #fbfcfe;
    }

    .drawio-frame-wrap {
      min-height: 620px;
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      background: #fbfcfe;
      display: grid;
      grid-template-rows: 44px minmax(0, 1fr);
    }

    .drawio-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 0 12px;
      border-bottom: 1px solid var(--line);
      background: white;
      color: var(--muted);
      font-size: 12px;
    }

    .drawio-frame {
      width: 100%;
      min-height: 575px;
      border: 0;
      background: white;
    }

    .drawio-status {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .flow-canvas svg {
      display: block;
      min-width: 920px;
    }

    .flow-node rect {
      fill: white;
      stroke: #98a2b3;
      stroke-width: 1.4;
      rx: 8;
    }

    .flow-node.start rect,
    .flow-node.end rect {
      fill: var(--green-soft);
      stroke: var(--green);
    }

    .flow-node.gate rect {
      fill: var(--amber-soft);
      stroke: var(--amber);
    }

    .flow-node.action rect {
      fill: var(--blue-soft);
      stroke: #5683d8;
    }

    .flow-edge {
      stroke: #667085;
      stroke-width: 1.6;
      fill: none;
      marker-end: url(#arrow);
    }

    .flow-edge.reject {
      stroke: var(--red);
      stroke-dasharray: 5 4;
    }

    .flow-label {
      font-size: 12px;
      fill: #344054;
    }

    .flow-text {
      fill: #111827;
      font-size: 13px;
      font-weight: 700;
    }

    .flow-sub {
      fill: #475467;
      font-size: 11px;
      font-weight: 500;
    }

    .right-panel {
      min-width: 0;
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr);
      gap: 14px;
    }

    .agent-panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    .agent-body {
      padding: 14px;
    }

    .step-list {
      display: grid;
      gap: 9px;
    }

    .step {
      display: grid;
      grid-template-columns: 26px minmax(0, 1fr);
      gap: 9px;
      align-items: start;
      min-height: 34px;
    }

    .step-dot {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: #e4e7ec;
      color: #475467;
      font-size: 12px;
      font-weight: 800;
      margin-top: 1px;
    }

    .step.done .step-dot {
      background: var(--green);
      color: white;
    }

    .step.active .step-dot {
      background: var(--blue);
      color: white;
    }

    .step strong {
      display: block;
      font-size: 13px;
      line-height: 1.25;
    }

    .step span {
      display: block;
      margin-top: 2px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.3;
    }

    .source-list {
      display: grid;
      gap: 8px;
      max-height: 250px;
      overflow: auto;
      padding-right: 2px;
    }

    .source-item {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 9px;
      background: #fbfcfe;
      min-height: 52px;
    }

    .source-item strong {
      display: block;
      font-size: 13px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .source-item span {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
    }

    .badge-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 0 8px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: white;
      color: #344054;
      font-size: 12px;
      white-space: nowrap;
    }

    .badge.blue { background: var(--blue-soft); color: var(--blue); border-color: #bfd1f5; }
    .badge.green { background: var(--green-soft); color: var(--green); border-color: #b6dfca; }
    .badge.amber { background: var(--amber-soft); color: var(--amber); border-color: #efd691; }
    .badge.violet { background: var(--violet-soft); color: var(--violet); border-color: #d6c8ff; }

    .split-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin: 0 0 10px;
    }

    .split-title h3 {
      margin: 0;
      font-size: 14px;
    }

    .empty {
      min-height: 90px;
      display: grid;
      place-items: center;
      color: var(--muted);
      border: 1px dashed var(--line);
      border-radius: 8px;
      background: #fbfcfe;
      font-size: 13px;
      text-align: center;
      padding: 12px;
    }

    @media (max-width: 1120px) {
      .app {
        grid-template-columns: 1fr;
      }
      .sidebar {
        min-height: auto;
      }
      .mode-list {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .workspace {
        grid-template-columns: 1fr;
      }
      .right-panel {
        grid-template-columns: 1fr 1fr;
        grid-template-rows: auto auto;
      }
      .right-panel .agent-panel:last-child {
        grid-column: 1 / -1;
      }
    }

    @media (max-width: 760px) {
      .main {
        padding: 12px;
      }
      .topbar {
        align-items: stretch;
        flex-direction: column;
      }
      .actions {
        justify-content: flex-start;
        flex-wrap: wrap;
      }
      .metric-row {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .right-panel {
        grid-template-columns: 1fr;
      }
      .doc-body {
        max-height: none;
      }
      .conversation-body,
      .library-body {
        height: auto;
        min-height: 0;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">AI</div>
        <div>
          <h1>流程 AI 设计台</h1>
          <p>Process Design Workspace</p>
        </div>
      </div>

      <div class="side-title">工作区</div>
      <div class="mode-list" id="modeNav">
        <button class="mode-item active" data-mode="design">
          设计工作台
          <span>对话、上传 source、生成流程</span>
        </button>
        <button class="mode-item" data-mode="library">
          流程库
          <span>查看流程详情、版本和产物</span>
        </button>
      </div>

      <div class="sidebar-footer">
        设计工作台负责生成与修改；流程库负责沉淀、查看和导出。
      </div>
    </aside>

    <main class="main">
      <div class="topbar">
        <div class="title">
          <h2 id="pageTitle">流程文档</h2>
          <p id="pageDesc"></p>
        </div>
        <div class="actions">
          <button class="btn btn-secondary btn-icon" id="resetBtn" title="重置运行状态">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M4 12a8 8 0 1 0 2.34-5.66L4 8.68" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M4 4v4.68h4.68" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <button class="btn btn-secondary" id="previewSourcesBtn">查看 sources</button>
          <a class="btn btn-secondary" id="runtimeBtn" href="http://127.0.0.1:8001/?section=demo&page=library&process=01_leave_request">
            发起实际流程
          </a>
          <button class="btn btn-primary" id="startBtn">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M8 5v14l11-7-11-7Z" fill="currentColor"/>
            </svg>
            开始设计
          </button>
        </div>
      </div>

      <div class="metric-row">
        <div class="metric blue">
          <div class="metric-label">表单字段</div>
          <div class="metric-value" id="fieldCount">0</div>
        </div>
        <div class="metric green">
          <div class="metric-label">流程环节</div>
          <div class="metric-value" id="nodeCount">0</div>
        </div>
        <div class="metric amber">
          <div class="metric-label">提交路径</div>
          <div class="metric-value" id="pathCount">0</div>
        </div>
        <div class="metric violet">
          <div class="metric-label">角色 / 附件</div>
          <div class="metric-value" id="roleAttachmentCount">0</div>
        </div>
      </div>

      <div class="workspace design-mode" id="workspace">
        <section class="conversation-panel">
          <div class="panel-head">
            <div class="panel-title">设计会话</div>
            <span class="badge blue">V1</span>
          </div>
          <div class="conversation-body">
            <div class="chat-list" id="chatList"></div>

            <div class="source-upload">

      const workspace = document.getElementById("workspace");
      workspace.className = `workspace ${state.mode}-mode`;
      document.getElementById("detailPanelTitle").textContent = state.mode === "design" ? "当前生成结果" : "流程详情";
    }

    function renderCases() {
      const wrap = document.getElementById("caseList");
      const query = state.libraryQuery.trim().toLowerCase();
      const visible = processes.filter(item => {
        const haystack = `${item.name} ${item.code} ${item.owner}`.toLowerCase();
        return !query || haystack.includes(query);
      });
      document.getElementById("libraryCount").textContent = `${visible.length}`;
      wrap.innerHTML = visible.map(item => `
        <div class="case-row">
          <button class="case-item ${item.id === state.activeCase ? "active" : ""}" data-case="${item.id}">
            <div class="case-name">
              <span>${escapeHtml(item.name)}</span>
              <span>${escapeHtml(item.code)}</span>
            </div>
            <div class="case-meta">${escapeHtml(item.owner)} · ${item.fields.length}字段 · ${item.nodes.length}环节</div>
          </button>
          <a class="case-run-link" href="${runtimeUrl(item)}">发起</a>
        </div>
      `).join("");
      wrap.querySelectorAll("button").forEach(btn => {
        btn.addEventListener("click", () => {
          state.activeCase = btn.dataset.case;
          state.activeTab = "fields";
          state.runStep = 0;
          state.running = false;
          render();
        });
      });
      if (!visible.length) {
        wrap.innerHTML = `<div class="empty">没有匹配的流程</div>`;
      }
    }

    function renderHeader() {
      const item = activeProcess();
      const title = state.mode === "design" ? "设计工作台" : "流程库";
      document.getElementById("pageTitle").textContent = `${title} · ${item.name}`;
      document.getElementById("pageDesc").textContent = state.mode === "design"
        ? "通过持续对话和 source 文件迭代流程定义，实时预览标准 JSON、Excel 和 draw.io 产物。"
        : item.description;
      document.getElementById("runtimeBtn").href = runtimeUrl(item);
    }

    function renderMetrics() {
      const item = activeProcess();
      const pathCount = item.nodes.reduce((sum, node) => sum + node.paths.length, 0);
      document.getElementById("fieldCount").textContent = item.fields.length;
      document.getElementById("nodeCount").textContent = item.nodes.length;
      document.getElementById("pathCount").textContent = pathCount;
      document.getElementById("roleAttachmentCount").textContent = `${item.roles.length}/${item.attachments.length}`;
    }

    function renderTabs() {
      const wrap = document.getElementById("docTabs");
      wrap.innerHTML = tabs.map(tab => `
        <button class="tab ${tab.id === state.activeTab ? "active" : ""}" data-tab="${tab.id}">${tab.label}</button>
      `).join("");
      wrap.querySelectorAll("button").forEach(btn => {
        btn.addEventListener("click", () => {
          state.activeTab = btn.dataset.tab;
          renderDocBody();
          renderTabs();
        });
      });
    }

    function renderDocBody() {
      const item = activeProcess();
      const body = document.getElementById("docBody");
      if (state.activeTab === "meta") body.innerHTML = renderMeta(item);
      if (state.activeTab === "fields") body.innerHTML = renderFields(item);
      if (state.activeTab === "nodes") body.innerHTML = renderNodes(item);
      if (state.activeTab === "roles") body.innerHTML = renderRoles(item);
      if (state.activeTab === "diagram") {
        body.innerHTML = renderDiagram(item);
        requestAnimationFrame(() => mountDrawioFrame(item));
      }
    }

    function renderMeta(item) {
      const rows = [
        ["流程编号", item.code],
        ["流程名称", item.name],
        ["责任部门", item.owner],
        ["适用范围", item.scope],
        ["发起入口", item.entry],
        ["流程描述", item.description]
      ];
      return `<div class="meta-grid">${rows.map(([k, v]) => `
        <div class="meta-k">${k}</div><div class="meta-v">${escapeHtml(v)}</div>
      `).join("")}</div>`;
    }

    function renderFields(item) {
      return `<div class="table-wrap"><table>
        <thead><tr>
          <th>序号</th><th>字段名称</th><th>组件类型</th><th>必填环节</th><th>支持查看环节</th><th>支持编辑环节</th><th>字段逻辑说明</th>
        </tr></thead>
        <tbody>${item.fields.map(field => `
          <tr>
            <td>${field.seq}</td>
            <td>${escapeHtml(field.name)}</td>
            <td>${escapeHtml(field.type)}</td>
            <td>${escapeHtml(field.required)}</td>
            <td>${escapeHtml(field.visible)}</td>
            <td>${escapeHtml(field.editable)}</td>
            <td>${escapeHtml(field.logic)}</td>
          </tr>
        `).join("")}</tbody>
      </table></div>`;
    }

    function renderNodes(item) {
      const rows = [];
      item.nodes.forEach((node, index) => {
        const paths = node.paths.length ? node.paths : [["-", "", ""]];
        const span = paths.length;
        paths.forEach((path, pathIndex) => {
          const groupCells = pathIndex === 0 ? `
              <td class="row-group" rowspan="${span}">${index + 1}</td>
              <td class="row-group" rowspan="${span}">${escapeHtml(node.name)}</td>
              <td class="row-group subtle" rowspan="${span}">${escapeHtml(node.role)}</td>
              <td class="row-group subtle" rowspan="${span}">${escapeHtml(node.opinion)}</td>
          ` : "";
          rows.push(`
            <tr>
              ${groupCells}
              <td>${escapeHtml(path[0])}</td>
              <td>${escapeHtml(path[1] || "无条件")}</td>
              <td>${escapeHtml(targetLabel(item, path[2]))}</td>
            </tr>
          `);
        });
      });
      return `<div class="table-wrap"><table>
        <thead><tr>
          <th>序号</th><th>环节名称</th><th>处理角色</th><th>意见域名称</th><th>提交路径</th><th>路径控制条件</th><th>目标环节</th>
        </tr></thead>
        <tbody>${rows.join("")}</tbody>
      </table></div>`;
    }

    function renderRoles(item) {
      const roles = item.roles.length ? item.roles : ["无自定义流程角色"];
      const attachments = item.attachments.length ? item.attachments : ["无特殊附件要求"];
      return `
        <div class="two-col">
          <div>
            <div class="split-title"><h3>角色配置</h3><span class="badge blue">${roles.length}</span></div>
            <div class="table-wrap"><table>
              <thead><tr><th>角色名称</th><th>角色类型</th></tr></thead>
              <tbody>${roles.map(role => `<tr><td>${escapeHtml(role)}</td><td>${role === "无自定义流程角色" ? "-" : "流程角色"}</td></tr>`).join("")}</tbody>
            </table></div>
          </div>
          <div>
            <div class="split-title"><h3>附件说明</h3><span class="badge amber">${attachments.length}</span></div>
            <div class="table-wrap"><table>
              <thead><tr><th>附件类型</th><th>上传环节</th><th>必传环节</th></tr></thead>
              <tbody>${attachments.map(attachment => `<tr><td>${escapeHtml(attachment)}</td><td>${attachment === "无特殊附件要求" ? "-" : "起草"}</td><td>${attachment === "无特殊附件要求" ? "-" : "起草"}</td></tr>`).join("")}</tbody>
            </table></div>
          </div>
        </div>`;
    }

    function renderDiagram(item) {
      return `<div class="drawio-frame-wrap">
        <div class="drawio-toolbar">
          <span class="drawio-status" id="drawioStatus">正在加载 draw.io iframe：${escapeHtml(item.name)}</span>
          <span class="badge blue">draw.io embed</span>
        </div>
        <iframe
          class="drawio-frame"
          id="drawioFrame"
          title="${escapeHtml(item.name)}流程图"
          src="https://embed.diagrams.net/?embed=1&proto=json&spin=1&ui=min&noSaveBtn=1&noExitBtn=1">
        </iframe>
      </div>`;
    }

    function mountDrawioFrame(item) {
      const iframe = document.getElementById("drawioFrame");
      const status = document.getElementById("drawioStatus");
      if (!iframe || !status) return;
      const mountId = ++state.drawioMountId;
      const xml = buildDrawioXml(item);
      const sendLoad = () => {
        if (mountId !== state.drawioMountId) return;
        if (!iframe.contentWindow) return;
        iframe.contentWindow.postMessage(JSON.stringify({
          action: "load",
          xml,
          title: `${item.name}.drawio`,
          autosave: 0,
          modified: 0
        }), "*");
        status.textContent = `已加载 draw.io 流程图：${item.name}`;
      };
      const listener = event => {
        let message;
        try {
          message = typeof event.data === "string" ? JSON.parse(event.data) : event.data;
        } catch (_err) {
          return;
        }
        if (message && message.event === "ready") {
          sendLoad();
          window.removeEventListener("message", listener);
        }
      };
      window.addEventListener("message", listener);
      iframe.addEventListener("load", () => setTimeout(sendLoad, 700), { once: true });
    }

    function buildDrawioXml(item) {
      const cells = [
        `<mxCell id="0"/>`,
        `<mxCell id="1" parent="0"/>`
      ];
      item.diagram.nodes.forEach(([id, label, x, y, type]) => {
        cells.push(`<mxCell id="${xmlAttr(id)}" value="${xmlAttr(label)}" style="${drawioStyle(type)}" vertex="1" parent="1"><mxGeometry x="${x}" y="${y}" width="128" height="50" as="geometry"/></mxCell>`);
      });
      item.diagram.edges.forEach(([from, to, label], index) => {
        const style = /退回|不同意/.test(label)
          ? "edgeStyle=orthogonalEdgeStyle;rounded=0;orthogonalLoop=1;jettySize=auto;html=1;strokeColor=#b42318;fontColor=#111827;dashed=1;endArrow=block;endFill=1;"
          : "edgeStyle=orthogonalEdgeStyle;rounded=0;orthogonalLoop=1;jettySize=auto;html=1;strokeColor=#667085;fontColor=#111827;endArrow=block;endFill=1;";
        cells.push(`<mxCell id="edge_${index}" value="${xmlAttr(label || "")}" style="${style}" edge="1" parent="1" source="${xmlAttr(from)}" target="${xmlAttr(to)}"><mxGeometry relative="1" as="geometry"/></mxCell>`);
      });
      const width = Math.max(...item.diagram.nodes.map(node => node[2])) + 260;
      const height = Math.max(...item.diagram.nodes.map(node => node[3])) + 160;
      return `<mxfile host="app.diagrams.net" agent="process-ai-demo" version="24.0.0" type="device">
  <diagram id="${xmlAttr(item.code)}" name="${xmlAttr(item.name)}">
    <mxGraphModel dx="1200" dy="760" grid="1" gridSize="10" guides="1" tooltips="1" connect="1" arrows="1" fold="1" page="1" pageScale="1" pageWidth="${width}" pageHeight="${height}" math="0" shadow="0">
      <root>
        ${cells.join("\n        ")}
      </root>
    </mxGraphModel>
  </diagram>
</mxfile>`;
    }

    function drawioStyle(type) {
      const base = "rounded=1;whiteSpace=wrap;html=1;fontColor=#111827;fontSize=12;fontStyle=1;arcSize=8;";
      if (type === "start" || type === "end") return `${base}ellipse;fillColor=#e7f6ee;strokeColor=#177245;`;
      if (type === "gate") return `${base}rhombus;fillColor=#fff4d7;strokeColor=#9b6500;`;
      return `${base}fillColor=#e8f0ff;strokeColor=#5683d8;`;
    }

    function xmlAttr(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function edgePath(from, to, label) {
      if (!from || !to) return "";
      const x1 = from[2] + 128;
      const y1 = from[3] + 25;
      const x2 = to[2];
      const y2 = to[3] + 25;
      const midX = (x1 + x2) / 2;
      const reject = /退回|不同意/.test(label) ? " reject" : "";
      const path = Math.abs(y2 - y1) < 12
        ? `M${x1} ${y1} L${x2} ${y2}`
        : `M${x1} ${y1} C${midX} ${y1}, ${midX} ${y2}, ${x2} ${y2}`;
      const lx = (x1 + x2) / 2;
      const ly = (y1 + y2) / 2 - 7;
      return `<path class="flow-edge${reject}" d="${path}"></path>${label ? `<text class="flow-label" x="${lx}" y="${ly}" text-anchor="middle">${escapeHtml(label)}</text>` : ""}`;
    }

    function wrapSvgText(label, x, y) {
      const text = escapeHtml(label);
      if (text.length <= 8) return `<text class="flow-text" x="${x}" y="${y}" text-anchor="middle">${text}</text>`;
      const first = text.slice(0, 8);
      const second = text.slice(8);
      return `<text class="flow-text" x="${x}" y="${y - 2}" text-anchor="middle">${first}</text><text class="flow-text" x="${x}" y="${y + 15}" text-anchor="middle">${second}</text>`;
    }

    function targetLabel(item, targetId) {
      if (targetId === "END") return "流程结束(END)";
      if (targetId === "DRAFT") return "退回起草(DRAFT)";
      const node = item.nodes.find(node => node.id === targetId);
      return node ? `${node.name}(${node.id})` : targetId;
    }

    function renderAgent() {
      const stateText = state.running ? "运行中" : state.runStep >= stepDefs.length ? "已生成" : "待开始";
      const stateClass = state.running ? "amber" : state.runStep >= stepDefs.length ? "green" : "blue";
      const runState = document.getElementById("runState");
      runState.textContent = stateText;
      runState.className = `badge ${stateClass}`;
      document.getElementById("stepList").innerHTML = stepDefs.map(([name, desc], index) => {
        const cls = index < state.runStep ? "done" : index === state.runStep && state.running ? "active" : "";
        const sign = index < state.runStep ? "✓" : index + 1;
        return `<div class="step ${cls}">
          <div class="step-dot">${sign}</div>
          <div><strong>${name}</strong><span>${desc}</span></div>
        </div>`;
      }).join("");
      renderQuality();
    }

    function renderQuality() {
      const item = activeProcess();
      const qualityState = document.getElementById("qualityState");
      qualityState.textContent = state.runStep >= stepDefs.length ? "Pass" : "Ready";
      qualityState.className = `badge ${state.runStep >= stepDefs.length ? "green" : "blue"}`;
      document.getElementById("qualityBadges").innerHTML = `
        <span class="badge green">Schema OK</span>
        <span class="badge blue">${item.fields.length} 字段</span>
        <span class="badge amber">${item.nodes.reduce((sum, node) => sum + node.paths.length, 0)} 路径</span>
        <span class="badge violet">${item.sources.length} sources</span>
      `;
    }

    function renderChat() {
      const item = activeProcess();
      document.getElementById("sourceCount").textContent = `${item.sources.length + state.uploaded.length} sources`;
      document.getElementById("chatList").innerHTML = state.messages.map(message => `
        <div class="chat-message ${message.role === "user" ? "user" : ""}">
          <strong>${message.role === "user" ? "你" : "流程设计 Agent"}</strong>
          ${escapeHtml(message.text)}
        </div>
      `).join("");
    }

    function renderVersions() {
      const item = activeProcess();
      const versions = [
        ["v1.2", "当前版本", "已生成 Excel / draw.io"],
        ["v1.1", "补充 source 后", `${item.fields.length} 字段 · ${item.nodes.length} 环节`],
        ["v1.0", "初次抽取", `${item.sources.length} source 输入`]
      ];
      document.getElementById("versionList").innerHTML = versions.map(([version, title, desc]) => `
        <div class="source-item">
          <strong>${escapeHtml(version)} · ${escapeHtml(title)}</strong>
          <span>${escapeHtml(desc)}</span>
        </div>
      `).join("");
    }

    function sourceType(source, index) {
      if (source.includes("需求")) return "需求说明";
      if (source.includes("邮件")) return "邮件往来";
      if (source.includes("消息")) return "即时消息";
      if (source.includes("会议")) return "会议纪要";
      return `Source ${index + 1}`;
    }

    function renderUploadedFiles() {
      const wrap = document.getElementById("uploadedFiles");
      if (!state.uploaded.length) {
        wrap.innerHTML = activeProcess().sources.slice(0, 3).map(file => `<div class="file-chip">${escapeHtml(file)}</div>`).join("");
        return;
      }
      wrap.innerHTML = state.uploaded.map(file => `<div class="file-chip">${escapeHtml(file)}</div>`).join("");
    }

    function startDesign() {
      if (state.running) return;
      state.mode = "design";
      state.running = true;
      state.runStep = 0;
      state.activeTab = "fields";
      render();
      const timer = setInterval(() => {
        state.runStep += 1;
        if (state.runStep >= stepDefs.length) {
          state.running = false;
          state.activeTab = "diagram";
          clearInterval(timer);
        }
        render();
      }, 520);
    }

    function runtimeUrl(item) {
      return `http://127.0.0.1:8001/?section=demo&page=library&process=${encodeURIComponent(item.id)}`;
    }

    function resetRun() {
      state.runStep = 0;
      state.running = false;
      render();
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    document.getElementById("startBtn").addEventListener("click", startDesign);
    document.getElementById("resetBtn").addEventListener("click", resetRun);
    document.getElementById("previewSourcesBtn").addEventListener("click", () => {
      state.mode = "design";
      render();
      document.querySelector(".conversation-panel").scrollIntoView({ behavior: "smooth", block: "nearest" });
    });
    document.querySelectorAll("#modeNav .mode-item").forEach(btn => {
      btn.addEventListener("click", () => {
        state.mode = btn.dataset.mode;
        render();
      });
    });
    document.getElementById("librarySearch").addEventListener("input", event => {
      state.libraryQuery = event.target.value;
      renderCases();
    });
    document.getElementById("sendMessageBtn").addEventListener("click", () => {
      const input = document.getElementById("chatInput");
      const text = input.value.trim();
      if (!text) return;
      state.messages.push({ role: "user", text });
      state.messages.push({ role: "agent", text: "已收到修改要求。Demo 中会模拟重新运行抽取、校验和产物生成。" });
      input.value = "";
      startDesign();
    });
    document.getElementById("fileInput").addEventListener("change", event => {
      state.uploaded = Array.from(event.target.files || []).map(file => file.name);
      renderUploadedFiles();
    });

    render();
  </script>
</body>
</html>
