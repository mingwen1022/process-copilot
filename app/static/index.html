<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>流程中心 · 请假审批</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --surface: #ffffff;
      --surface-soft: #fafafa;
      --ink: rgba(0, 0, 0, 0.88);
      --muted: rgba(0, 0, 0, 0.65);
      --subtle: rgba(0, 0, 0, 0.45);
      --line: #eceef1;
      --line-strong: #d9dde3;
      --nav: #001529;
      --accent: #6d5efc;
      --accent-dark: #5646e0;
      --ai: #6d5efc;
      --ai-2: #9b8bff;
      --ai-soft: #eeecfe;
      --ai-grad: linear-gradient(135deg, #6d5efc, #9b6bff 55%, #c86bff);
      --green: #389e0d;
      --amber: #d48806;
      --red: #cf1322;
      --blue-soft: #e6f4ff;
      --green-soft: #f6ffed;
      --amber-soft: #fff7e6;
      --red-soft: #fff1f0;
      --shadow: 0 6px 16px rgba(0, 0, 0, 0.06);
      --radius: 12px;
      --sidebar: 236px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", Arial, sans-serif;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background: var(--bg);
      letter-spacing: 0;
    }
    button, input, select, textarea { font: inherit; letter-spacing: 0; }
    button { cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: .55; }
    h1, h2, h3, p { margin: 0; }

    .login-page {
      min-height: 100vh;
      display: grid;
      grid-template-columns: minmax(320px, 430px) minmax(0, 1fr);
      background: var(--bg);
    }
    .login-brand {
      padding: 34px;
      color: #ffffff;
      background: var(--nav);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 36px;
    }
    .brand-row {
      display: grid;
      grid-template-columns: 36px minmax(0, 1fr);
      gap: 12px;
      align-items: center;
    }
    .brand-mark {
      width: 36px;
      height: 36px;
      border-radius: var(--radius);
      background: var(--accent);
      color: #ffffff;
      display: grid;
      place-items: center;
      font-size: 13px;
      font-weight: 850;
    }
    .brand-row strong { display: block; font-size: 16px; line-height: 1.2; }
    .brand-row span { display: block; margin-top: 3px; color: rgba(255,255,255,.65); font-size: 12px; }
    .login-brand-copy h1 { font-size: 28px; line-height: 1.22; font-weight: 650; }
    .login-brand-copy p { margin-top: 14px; color: rgba(255,255,255,.72); font-size: 14px; line-height: 1.65; }
    .login-footnote { color: rgba(255,255,255,.5); font-size: 12px; line-height: 1.55; }
    .login-main {
      min-width: 0;
      display: grid;
      place-items: center;
      padding: 40px 24px;
    }
    .login-panel {
      width: min(430px, 100%);
      padding: 30px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }
    .login-panel h2 { font-size: 22px; font-weight: 650; }
    .login-panel > p { margin-top: 8px; color: var(--muted); font-size: 13px; line-height: 1.55; }
    .login-form { margin-top: 24px; display: grid; gap: 16px; }
    .form-row { display: grid; gap: 7px; }
    .form-row label { color: var(--ink); font-size: 13px; font-weight: 650; }
    .input, .select, .textarea {
      width: 100%;
      min-height: 34px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 6px 11px;
      color: var(--ink);
      background: #ffffff;
      outline: none;
      font-size: 13px;
    }
    .textarea { min-height: 94px; resize: vertical; line-height: 1.5; }
    .input:focus, .select:focus, .textarea:focus {
      border-color: #91b1de;
      box-shadow: 0 0 0 2px rgba(5,145,255,.12);
    }
    .demo-account {
      margin-top: 18px;
      padding: 12px;
      border: 1px dashed var(--line-strong);
      border-radius: var(--radius);
      background: var(--surface-soft);
      color: var(--muted);
      font-size: 12px;
      line-height: 1.7;
    }
    .error-box {
      margin-top: 14px;
      padding: 10px 12px;
      color: var(--red);
      background: var(--red-soft);
      border: 1px solid #ffccc7;
      border-radius: var(--radius);
      font-size: 13px;
      line-height: 1.45;
    }

    .app-shell {
      min-height: 100vh;
      display: grid;
      grid-template-columns: var(--sidebar) minmax(0, 1fr);
      transition: grid-template-columns 180ms ease;
    }
    .app-shell.sidebar-collapsed {
      --sidebar: 72px;
    }
    .sidebar {
      min-height: 100vh;
      padding: 16px 12px;
      color: var(--ink);
      background: var(--surface);
      border-right: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .app-shell.sidebar-collapsed .sidebar { align-items: center; }
    .brand {
      display: grid;
      grid-template-columns: 32px minmax(0, 1fr);
      gap: 10px;
      align-items: center;
      padding: 4px 4px 16px;
      border-bottom: 1px solid var(--line);
    }
    .app-shell.sidebar-collapsed .brand {
      width: 100%;
      grid-template-columns: 32px;
      justify-content: center;
      padding-bottom: 10px;
    }
    .app-shell.sidebar-collapsed .brand > div:not(.brand-mark) { display: none; }
    .brand .brand-mark { width: 32px; height: 32px; }
    .brand strong { display: block; font-size: 15px; line-height: 1.2; }
    .brand span { display: block; margin-top: 3px; color: var(--subtle); font-size: 12px; }
    .sidebar-toggle {
      width: 100%;
      min-height: 34px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 7px 10px;
      color: var(--muted);
      background: transparent;
      display: grid;
      grid-template-columns: 18px minmax(0, 1fr);
      gap: 8px;
      align-items: center;
      text-align: left;
      font-size: 12px;
      font-weight: 700;
    }
    .sidebar-toggle:hover { background: var(--bg); }
    .sidebar-toggle svg {
      width: 18px;
      height: 18px;
      stroke-width: 2;
      transition: transform 160ms ease;
    }
    .app-shell.sidebar-collapsed .sidebar-toggle {
      width: 38px;
      grid-template-columns: 18px;
      justify-content: center;
      padding: 7px;
    }
    .app-shell.sidebar-collapsed .sidebar-toggle span { display: none; }
    .app-shell.sidebar-collapsed .sidebar-toggle svg { transform: rotate(180deg); }
    .nav-group { display: grid; gap: 8px; }
    .app-shell.sidebar-collapsed .nav-group { width: 100%; }
    .nav-title { padding: 0 6px; color: var(--subtle); font-size: 12px; font-weight: 700; }
    .app-shell.sidebar-collapsed .nav-title { display: none; }
    .nav-item {
      width: 100%;
      min-height: 42px;
      border: 0;
      border-radius: var(--radius);
      padding: 9px 10px;
      color: var(--muted);
      background: transparent;
      display: grid;
      grid-template-columns: 18px minmax(0, 1fr) auto;
      gap: 8px;
      align-items: center;
      text-align: left;
      font-size: 13px;
      font-weight: 700;
      position: relative;
    }
    .app-shell.sidebar-collapsed .nav-item {
      grid-template-columns: 18px;
      justify-content: center;
      padding: 10px;
    }
    .app-shell.sidebar-collapsed .nav-label { display: none; }
    .nav-icon {
      width: 18px;
      height: 18px;
      border-radius: 5px;
      border: 1px solid var(--line);
      display: grid;
      place-items: center;
      font-size: 11px;
      font-weight: 800;
    }
    .nav-item:hover { background: var(--bg); color: var(--ink); }
    .nav-item.active { color: var(--ai); background: var(--ai-soft); }
    .nav-item.active .nav-icon { border-color: var(--ai-2); }
    .nav-count {
      min-width: 24px;
      height: 22px;
      border-radius: 999px;
      display: grid;
      place-items: center;
      color: #ffffff;
      background: var(--red);
      font-size: 12px;
      font-weight: 800;
      padding: 0 7px;
    }
    .app-shell.sidebar-collapsed .nav-count {
      position: absolute;
      transform: translate(14px, -14px);
      min-width: 18px;
      height: 18px;
      font-size: 10px;
    }
    .nav-item.active .nav-count { color: #ffffff; background: var(--red); }
    .sidebar-user {
      margin-top: auto;
      padding: 14px 6px 2px;
      border-top: 1px solid var(--line);
      display: grid;
      gap: 8px;
    }
    .app-shell.sidebar-collapsed .sidebar-user {
      width: 100%;
      justify-items: center;
      padding-inline: 0;
    }
    .user-name { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 800; }
    .avatar {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      color: var(--ai);
      background: var(--ai-soft);
      display: grid;
      place-items: center;
      font-size: 12px;
      font-weight: 850;
    }
    .user-role { color: var(--subtle); font-size: 12px; line-height: 1.45; }
    .app-shell.sidebar-collapsed .user-name span:not(.avatar),
    .app-shell.sidebar-collapsed .user-role,
    .app-shell.sidebar-collapsed .sidebar-user .button {
      display: none;
    }

    .main {
      min-width: 0;
      min-height: 100vh;
      padding: 20px 24px;
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr);
      gap: 14px;
      overflow: hidden;
    }
    .main.detail-mode { grid-template-rows: auto minmax(0, 1fr); max-height: 100vh; }
    .topbar {
      min-width: 0;
      min-height: 56px;
      padding: 12px 16px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
    }
    .page-title h1 { font-size: 20px; line-height: 1.25; font-weight: 600; }
    .page-title p { margin-top: 4px; color: var(--muted); font-size: 13px; line-height: 1.4; }
    .top-actions { display: flex; justify-content: flex-end; align-items: center; gap: 8px; flex-wrap: wrap; }
    .button {
      min-height: 32px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 5px 12px;
      color: var(--ink);
      background: #ffffff;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: 7px;
      font-size: 13px;
      font-weight: 500;
      text-decoration: none;
    }
    .button.primary { color: #ffffff; background: var(--accent); border-color: var(--accent); }
    .button.primary:hover { background: var(--accent-dark); border-color: var(--accent-dark); }
    .button.danger { color: var(--red); background: var(--red-soft); border-color: #ffccc7; }
    .button.full { width: 100%; }

    .summary-strip {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }
    .metric {
      min-height: 72px;
      padding: 13px 14px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      display: grid;
      align-content: space-between;
      gap: 10px;
    }
    .metric label { color: var(--muted); font-size: 12px; font-weight: 700; }
    .metric-main { display: flex; justify-content: space-between; align-items: end; gap: 12px; }
    .metric strong { font-size: 26px; line-height: 1; font-weight: 600; }
    .metric span { color: var(--subtle); font-size: 12px; line-height: 1.35; text-align: right; }

    .workspace {
      min-width: 0;
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 340px;
      gap: 12px;
      align-items: stretch;
    }
    .workspace-main-column {
      min-width: 0;
      min-height: 0;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: 12px;
      overflow: hidden;
    }
    .section {
      min-width: 0;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .section-head {
      min-height: 58px;
      padding: 13px 16px;
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .section-title { display: grid; gap: 4px; }
    .section-title strong { font-size: 15px; line-height: 1.25; }
    .section-title span { color: var(--muted); font-size: 12px; line-height: 1.35; }
    .priority-next-card {
      min-height: 138px;
      border: 1px solid var(--line);
      border-left: 4px solid var(--red);
      border-radius: var(--radius);
      padding: 20px 22px;
      background: #ffffff;
      box-shadow: 0 10px 28px rgba(15, 23, 42, .04);
      display: grid;
      grid-template-columns: 86px minmax(0, 1fr) auto;
      gap: 18px;
      align-items: center;
    }
    .priority-label { align-self: start; display: grid; gap: 10px; font-size: 15px; line-height: 1.3; font-weight: 650; }
    .priority-label span { color: var(--red); font-size: 12px; font-weight: 700; }
    .priority-content { min-width: 0; display: grid; gap: 7px; }
    .priority-content strong { font-size: 21px; line-height: 1.25; font-weight: 760; }
    .priority-content p, .priority-content span { color: var(--muted); font-size: 13px; line-height: 1.45; }
    .priority-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .tabs {
      min-height: 44px;
      padding: 0 14px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: end;
      gap: 4px;
      background: #ffffff;
    }
    .tab {
      min-height: 38px;
      border: 0;
      border-bottom: 2px solid transparent;
      padding: 0 12px;
      color: var(--muted);
      background: transparent;
      font-size: 13px;
      font-weight: 650;
    }
    .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
    .panel-body { min-height: 0; padding: 12px; overflow-y: auto; }
    .task-table { display: grid; gap: 8px; }
    .task-row {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 13px 14px;
      background: #ffffff;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      text-align: left;
    }
    .task-row:hover { border-color: #91b1de; background: #fbfdff; }
    .task-title { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .task-title strong { font-size: 14px; line-height: 1.35; overflow-wrap: anywhere; }
    .meta-line { margin-top: 7px; color: var(--muted); font-size: 12px; line-height: 1.5; display: flex; flex-wrap: wrap; gap: 8px 14px; }
    .tag {
      min-height: 22px;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 2px 8px;
      display: inline-flex;
      align-items: center;
      color: var(--muted);
      background: var(--surface-soft);
      font-size: 12px;
      font-weight: 650;
      white-space: nowrap;
    }
    .tag.blue { color: var(--accent-dark); background: var(--blue-soft); border-color: #91caff; }
    .tag.green { color: var(--green); background: var(--green-soft); border-color: #b7eb8f; }
    .tag.amber { color: var(--amber); background: var(--amber-soft); border-color: #ffd591; }
    .tag.red { color: var(--red); background: var(--red-soft); border-color: #ffccc7; }
    .kb-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; min-height: 0; }
    @media (max-width: 1080px) { .kb-layout { grid-template-columns: 1fr; } }
    .kb-panel { border: 1px solid var(--line); border-radius: var(--radius); background: #ffffff; overflow: hidden; display: flex; flex-direction: column; min-height: 0; }
    .kb-panel-head { padding: 14px 16px; border-bottom: 1px solid var(--line); flex: 0 0 auto; }
    .kb-panel-head h2 { margin: 0; font-size: 15px; }
    .kb-panel-head p { margin: 4px 0 0; color: var(--muted); font-size: 12px; line-height: 1.5; }
    .kb-stat-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    .kb-body { padding: 12px 16px; flex: 1 1 auto; min-height: 0; overflow-y: auto; }
    .kb-group { margin-bottom: 16px; }
    .kb-group:last-child { margin-bottom: 0; }
    .kb-group-title { font-size: 12px; font-weight: 700; color: var(--muted); margin-bottom: 8px; display: flex; gap: 8px; align-items: center; }
    .kb-rule { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; background: var(--surface-soft); }
    .kb-rule:last-child { margin-bottom: 0; }
    .kb-rule-title { font-size: 14px; font-weight: 700; color: var(--ink, #1a1a1a); margin-bottom: 6px; }
    .kb-rule-top { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 6px; }
    .kb-rule-id { font-family: var(--mono, ui-monospace, monospace); font-size: 11px; color: var(--muted); margin-left: auto; }
    .kb-rule-stmt { font-size: 13px; line-height: 1.5; color: var(--ink, #1a1a1a); }
    .kb-rule-src { margin-top: 6px; font-size: 11px; color: var(--muted); }
    .kb-search-bar { display: flex; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
    .kb-search-bar input { flex: 1; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; font-size: 13px; }
    .kb-hit { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; }
    .kb-hit-top { display: flex; gap: 8px; align-items: center; justify-content: space-between; margin-bottom: 6px; }
    .kb-hit-src { font-size: 13px; font-weight: 700; color: var(--ink, #1a1a1a); }
    .kb-hit-id { font-family: var(--mono, ui-monospace, monospace); font-size: 11px; color: var(--muted); margin-bottom: 6px; }
    .kb-hit-score { font-size: 11px; color: var(--muted); white-space: nowrap; }
    .kb-hit-text { font-size: 12px; line-height: 1.55; color: var(--muted); white-space: pre-wrap; }
    .kb-src-link { border: none; background: none; padding: 0; margin: 0; font: inherit; font-family: var(--mono, ui-monospace, monospace); color: var(--accent-dark); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
    .kb-doc-overlay { position: fixed; inset: 0; z-index: 50; background: rgba(0, 0, 0, .28); display: grid; place-items: center; padding: 24px; }
    .kb-doc-shell { width: min(760px, 100%); max-height: min(760px, calc(100vh - 48px)); border: 1px solid var(--line); border-radius: var(--radius); background: #ffffff; box-shadow: 0 22px 60px rgba(15, 23, 42, .28); display: grid; grid-template-rows: auto minmax(0, 1fr); overflow: hidden; }
    .kb-doc-head { padding: 14px 16px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .kb-doc-title { display: grid; gap: 4px; }
    .kb-doc-title strong { font-size: 15px; }
    .kb-doc-title span { color: var(--muted); font-size: 11px; font-family: var(--mono, ui-monospace, monospace); }
    .kb-doc-content { min-height: 0; overflow-y: auto; padding: 16px; }
    .kb-doc-body { margin: 0; font-family: inherit; font-size: 13px; line-height: 1.7; color: var(--ink, #1a1a1a); white-space: pre-wrap; word-break: break-word; }
    .kb-tabs { display: flex; gap: 4px; margin-bottom: 10px; }
    .kb-tab { min-height: 28px; border: 1px solid var(--line); border-radius: 999px; padding: 3px 12px; color: var(--muted); background: var(--surface-soft); font-size: 12px; font-weight: 650; cursor: pointer; }
    .kb-tab.active { color: #ffffff; background: var(--accent); border-color: var(--accent); }
    .kb-doc-card { display: block; width: 100%; text-align: left; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; background: var(--surface-soft); cursor: pointer; }
    .kb-doc-card:last-child { margin-bottom: 0; }
    .kb-doc-card-title { display: block; font-size: 14px; font-weight: 700; color: var(--ink, #1a1a1a); margin-bottom: 6px; }
    .kb-empty-hint { padding: 24px 16px; color: var(--muted); font-size: 13px; line-height: 1.6; text-align: center; }
    .empty {
      min-height: 180px;
      display: grid;
      place-items: center;
      color: var(--muted);
      text-align: center;
      line-height: 1.55;
      padding: 20px;
    }
    .workspace-side { min-width: 0; display: grid; gap: 12px; align-content: start; overflow-y: auto; padding-right: 2px; }
    .workspace-side-panel { border: 1px solid var(--line); border-radius: var(--radius); background: #ffffff; overflow: hidden; }
    .workspace-side-head { padding: 16px; border-bottom: 1px solid var(--line); display: grid; gap: 6px; }
    .workspace-side-head strong { font-size: 16px; line-height: 1.3; font-weight: 700; }
    .workspace-side-head span { color: var(--muted); font-size: 12px; line-height: 1.45; }
    .assistant-empty { padding: 16px; color: var(--muted); font-size: 13px; line-height: 1.6; }

    .catalog-layout { min-height: 0; display: grid; grid-template-columns: 260px minmax(0, 1fr) 320px; gap: 12px; overflow: hidden; }
    .catalog-hero {
      padding: 18px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      display: grid;
      grid-template-columns: minmax(0, 1fr) 360px;
      gap: 18px;
      align-items: center;
    }
    .catalog-kicker { color: var(--accent); font-size: 12px; font-weight: 800; }

      padding: 1px;
      background:
        linear-gradient(135deg, rgba(45, 212, 191, 0.9), rgba(22, 119, 255, 0.85), rgba(168, 85, 247, 0.85)),
        #111827;

    .flow-modal-shell {
      height: 100%;

    .flow-modal-head {
      min-height: 62px;

    .flow-modal-head div {

    .flow-modal-head strong { font-size: 16px; line-height: 1.3; }
    .flow-modal-head span { color: var(--muted); font-size: 12px; line-height: 1.4; }
    .flow-modal-body {
      min-height: 0;

    .flow-modal .flow-board-viewport {

    @media (max-width: 1100px) {
      .designer-hero,

      .overview-layout,
      .initializer-layout {

        grid-area: auto;

      .designer-summary,
      .designer-action-grid,

    /* ——— 我的流程 · 流程助手（新版列表）——— */
    .mp2-scroll { overflow-y: auto; padding-right: 4px; display: flex; flex-direction: column; gap: 16px; }
    .mp2-red { color: var(--red); }
    .mp2-amber { color: var(--amber); }
    .mp2-summary { display: flex; gap: 12px; padding: 16px 18px; border-radius: 14px;
      background: linear-gradient(135deg, #f3f0ff, #faf7ff); border: 1px solid #e3def9; }
    .mp2-summary-ic { width: 26px; height: 26px; border-radius: 8px; background: var(--ai-grad); color: #fff;
      display: grid; place-items: center; font-size: 14px; flex-shrink: 0; }
    .mp2-summary-body { font-size: 13.5px; color: var(--ink); line-height: 1.6; }
    .mp2-summary-body b { color: var(--ai); }
    .mp2-summary-note { font-size: 11.5px; color: var(--subtle); margin-top: 3px; }

    .mp2-h { font-size: 14px; font-weight: 650; }

    .mp2-row:hover { border-color: var(--ai-2); box-shadow: 0 6px 18px rgba(20,22,34,.06); transform: translateY(-1px); }

      display: grid; place-items: center; font-weight: 700; flex-shrink: 0; }

    .mp2-row-ic.amber { background: #fffaf1; color: var(--amber); }
    .mp2-row-body { flex: 1; min-width: 0; }
    .mp2-row-body b { font-size: 14px; display: block; }
    .mp2-row-body span { font-size: 12px; color: var(--subtle); }
    .mp2-badge { font-size: 11px; font-weight: 700; color: #fff; border-radius: 20px; padding: 2px 10px; flex-shrink: 0; }

    /* 流程管理卡片 · 运行反馈条 */

      margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--line); }

      background: var(--bg); color: var(--muted); border: none; }

  </style>
</head>
<body>
  <div id="app"></div>
  <div id="toast" class="toast hidden"></div>

  <script>
    const API = "/api/v1";
    const SESSION_KEY = "slice1_current_user";
    const SIDEBAR_KEY = "process_center_sidebar_collapsed";
    const state = {
      user: null,
      page: "login",
      sidebarCollapsed: localStorage.getItem(SIDEBAR_KEY) === "true",
      bucket: "todo",
      summary: null,
      listItems: [],
      nextItem: null,
      workflows: [],
      managedWorkflows: [],
      selectedWorkflowDefinitionId: "",
      selectedWorkflowDetail: null,
      workflowManageFilter: "all",
      workflowManageSearch: "",
      designerView: "entry",
      designerMode: "",
      newDraftType: "approval",
      newDraftStartMethod: "ai",
      newDraftName: "未命名审批流程",
      newDraftCategory: "审批流程",
      initializationInstruction: "",
      initializationRunning: false,
      initializationJobId: "",
      initializationProgressEvents: [],
      initializationProgressByNode: {},
      initializationEventSource: null,
      designSession: null,
      designSaveState: "saved",
      designerThinking: false,
      activeClarificationManualId: "",
      clarificationManualText: "",
      activeClarificationIndex: 0,
      clarificationDraftAnswers: {},
      completedClarificationSessions: {},
      localDesignerFollowups: [],
      pendingDesignSources: [],
      localDesignMessages: [],
      designTab: "overview",
      designerExpandedNodes: {},
      designerHighlightedNodeId: "",
      sourceModalOpen: false,
      newProcessModalOpen: false,
      ownedProcessModalOpen: false,
      flowModalOpen: false,
      caseDetail: null,
      formValues: {},
      decision: "",
      selectedRoute: "",
      routeOptions: [],
      comment: "",
      placeholderTitle: "",
      analyticsTab: "dashboard",
      analyticsMetrics: null,
      analyticsError: "",
      analyticsDiagnosis: null,
      analyticsDiagnosisList: [],
      analyticsDiagnosisSelectedId: null,
      analyticsDiagnosisLoading: false,
      analyticsDiagnosisError: "",
      analyticsMessages: [],
      analyticsAskInput: "",
      analyticsAsking: false,
      analyticsComparison: null,
      knowledgeRules: null,
      knowledgeDocuments: null,
      knowledgeLeftTab: "rules",
      knowledgeSearchInput: "",
      knowledgeSearchResult: null,
      knowledgeSearching: false,
      kbDocModalOpen: false,
      kbDocModalLoading: false,
      kbDocModalError: "",
      kbDocModalData: null,
      myProcessesList: [],
      opsInstance: null,
      opsMessages: [],
      opsInput: "",
      opsBusy: false,
      opsPending: null,
      opsInspection: null,
      authorizationsList: [],
      authBusy: false,
      launchMessages: [],
      launchInput: "",
      launchBusy: false,
      error: ""
    };

    const app = document.getElementById("app");
    const toast = document.getElementById("toast");

    document.addEventListener("DOMContentLoaded", restoreSession);

    async function request(path, options = {}) {
      const headers = options.body instanceof FormData
        ? { ...(options.headers || {}) }
        : { "Content-Type": "application/json", ...(options.headers || {}) };
      const response = await fetch(`${API}${path}`, {
        headers,
        ...options
      });
      const text = await response.text();
      let payload = {};
      if (text) {
        try {
          payload = JSON.parse(text);
        } catch {
          payload = { detail: text };
        }
      }
      if (!response.ok) {
        const detail = payload.detail || response.statusText;
        throw new Error(typeof detail === "string" ? detail : JSON.stringify(detail));
      }
      return payload;
    }

    async function login(event) {
      event.preventDefault();
      clearError();
      const form = event.currentTarget;
      const account = form.account.value.trim();
      const password = form.password.value;
      try {
        const payload = await request("/session/login", {
          method: "POST",
          body: JSON.stringify({ account, password })
        });
        state.user = payload.user;
        persistSession(payload.user);
        state.page = "myProcesses";
        state.bucket = "todo";
        await loadMyProcesses();
        showToast(`已登录：${state.user.name}`);
        render();
      } catch (error) {
        setError(error.message);
      }
    }

    function logout() {
      resetInitializationProgress();
      state.initializationRunning = false;
      localStorage.removeItem(SESSION_KEY);
      state.user = null;
      state.page = "login";
      state.error = "";
      renderLogin();
    }

    async function restoreSession() {
      const saved = loadPersistedUser();
      if (!saved) {
        renderLogin();
        return;
      }
      state.user = saved;
      state.page = "myProcesses";
      state.bucket = "todo";
      try {
        await loadMyProcesses();
        render();
      } catch (error) {
        localStorage.removeItem(SESSION_KEY);
        state.user = null;
        setError("登录状态已失效，请重新登录");
      }
    }

    async function loadWorkbench() {
      const [summary, list, todoList] = await Promise.all([
        request(`/workbench/summary?user_id=${encodeURIComponent(state.user.user_id)}`),
        state.bucket === "initiated"
          ? request(`/workbench/initiated?user_id=${encodeURIComponent(state.user.user_id)}`)
          : request(`/workbench/items?user_id=${encodeURIComponent(state.user.user_id)}&bucket=${encodeURIComponent(state.bucket)}`),
        request(`/workbench/items?user_id=${encodeURIComponent(state.user.user_id)}&bucket=todo`)
      ]);
      state.summary = summary;
      state.listItems = list.items;
      state.nextItem = todoList.items[0] || null;
    }

    async function navTo(page, title = "") {
      clearError();
      state.page = page;
      if (page === "workbench") {
        await loadWorkbench();
      } else if (page === "myProcesses") {
        state.opsInstance = null;
        await loadMyProcesses();
      } else if (page === "authorizations") {
        await loadAuthorizations();
      } else if (page === "launch") {
        const payload = await request(`/workflows/catalog?user_id=${encodeURIComponent(state.user.user_id)}`);
        state.workflows = payload.items;
      } else if (page === "workflowManage") {
        await loadWorkflowManagement();
      } else if (page === "designer") {
        await loadWorkflowManagement();
        state.designerView = "entry";
        state.designerMode = "";
        state.designSession = null;
        state.localDesignMessages = [];
        state.designTab = "overview";
        resetClarificationInputState();
        state.sourceModalOpen = false;
        state.newProcessModalOpen = false;
        state.ownedProcessModalOpen = false;
        state.flowModalOpen = false;
      } else if (page === "placeholder") {
        state.placeholderTitle = title;
      } else if (page === "analytics") {
        state.analyticsTab = "dashboard";
        await Promise.all([loadAnalyticsDashboard(), loadLatestDiagnosis(), loadVersionComparison()]);
      } else if (page === "knowledge") {
        state.knowledgeLeftTab = "rules";
        await Promise.all([loadKnowledgeRules(), loadKnowledgeDocuments()]);
      }
      render();
    }

    async function loadKnowledgeDocuments() {
      try {
        state.knowledgeDocuments = await request("/knowledge/documents");
      } catch (error) {
        state.knowledgeDocuments = null;
      }
    }

    async function loadKnowledgeRules() {
      try {
        state.knowledgeRules = await request("/knowledge/rules");
      } catch (error) {
        state.knowledgeRules = null;
      }
    }

    async function loadMyProcesses() {
      try {
        const payload = await request("/copilot/instances");
        state.myProcessesList = payload.items || [];
      } catch (error) {
        state.myProcessesList = [];
      }
      await loadTodo();
    }

    async function loadTodo() {
      try {
        state.todo = await request("/copilot/todo");
        state.todoUrgent = state.todo?.summary?.urgent || 0;
      } catch (error) {
        state.todo = null;
        state.todoUrgent = 0;
      }
    }

    // 审批协助 / 进度 —— 点某行时按需拉取，缓存在 state.todoDetail
    async function toggleTodoDetail(itemId, kind) {
      if (state.todoOpen === itemId) { state.todoOpen = null; render(); return; }
      state.todoOpen = itemId;
      state.todoDetail = null;
      render();
      try {
        const path = kind === "approval"
          ? `/copilot/todo/${encodeURIComponent(itemId)}/assist`
          : `/copilot/todo/${encodeURIComponent(itemId)}/progress`;
        state.todoDetail = await request(path);
      } catch (e) {
        state.todoDetail = { error: true };
      }
      render();
    }

    async function openOpsInstance(instanceId) {
      clearError();
      try {
        state.opsInstance = await request(`/copilot/instances/${encodeURIComponent(instanceId)}`);
        state.opsMessages = [];
        state.opsInput = "";
        state.opsPending = null;
        state.opsInspection = null;
        render();
        // 在办体检异步拉取（不阻塞详情页首屏）
        try {
          state.opsInspection = await request(`/copilot/instances/${encodeURIComponent(instanceId)}/inspect`);
          render();
        } catch (e) { /* 体检失败不影响详情 */ }
      } catch (error) {
        setError(error.message);
      }
    }

    function closeOpsInstance() {
      state.opsInstance = null;

    async function refreshOpsInstance() {
      if (!state.opsInstance) return;

    async function sendOpsMessage() {
      const text = (state.opsInput || "").trim();
      if (!text || state.opsBusy || !state.opsInstance) return;
      const id = state.opsInstance.instance_id;
      // 本次之前的对话历史（把助手气泡的 reply 抽出来），供 agent 理解"确认""就这个"等指代
      const history = state.opsMessages.map((m) => ({
        role: m.role,
        content: m.role === "user" ? m.content : (m.proposal && m.proposal.reply) || "",
      })).filter((m) => m.content);
      state.opsMessages.push({ role: "user", content: text });
      state.opsInput = "";
      state.opsBusy = true;
      state.opsPending = null;
      render();
      try {
        const proposal = await request(`/copilot/instances/${encodeURIComponent(id)}/propose`, {
          method: "POST",
          body: JSON.stringify({ message: text, history }),
        });
        state.opsMessages.push({ role: "assistant", proposal });
        if (proposal.needs_confirmation) state.opsPending = proposal;
      } catch (error) {
        state.opsMessages.push({ role: "assistant", proposal: { reply: "运维助手出错：" + error.message, category: "escalate", needs_confirmation: false } });
      } finally {
        state.opsBusy = false;
        render();
      }
    }

    async function confirmOpsAction() {
      if (!state.opsInstance || !state.opsPending) return;
      const id = state.opsInstance.instance_id;
      state.opsBusy = true;
      render();
      try {
        const result = await request(`/copilot/instances/${encodeURIComponent(id)}/confirm`, { method: "POST", body: JSON.stringify({}) });
        const msg = result.applied
          ? (result.now_unblocked ? "已处理，流程已恢复流转。" : "已处理。")
          : ("未能执行：" + (result.errors || []).join("；"));
        state.opsMessages.push({ role: "assistant", proposal: { reply: msg, category: result.applied ? "done" : "escalate", needs_confirmation: false } });
        state.opsPending = null;
        await refreshOpsInstance();
        await loadMyProcesses();
      } catch (error) {
        setError(error.message);
      } finally {
        state.opsBusy = false;
        render();
      }
    }

    async function discardOpsAction() {

      state.opsMessages.push({ role: "assistant", proposal: { reply: "已放弃该操作。", category: "done", needs_confirmation: false } });
      state.opsPending = null;
      render();
    }

    // 反哺闭环：为每个流程拉运行反馈（分渠道计数）。demo：请假流程映射到 ops 侧的 LEAVE-001。
    function insightKeyForWorkflow(workflow) {
      if ((workflow.name || "").includes("请假")) return "LEAVE-001";
      return workflow.process_id || workflow.workflow_definition_id;
    }
    async function loadWorkflowInsights() {
      state.wfInsights = state.wfInsights || {};
      await Promise.all((state.managedWorkflows || []).map(async (w) => {
        try {
          const key = insightKeyForWorkflow(w);
          const r = await request(`/insights?workflow_definition_id=${encodeURIComponent(key)}`);
          state.wfInsights[w.workflow_definition_id] = r.channel_counts || {};
        } catch (e) { state.wfInsights[w.workflow_definition_id] = {}; }
      }));
    }

    const CHANNEL_LABELS = { design: "设计", policy: "制度", org: "组织", data: "数据", ops: "运营", triage: "待分诊" };
    function renderRebackStrip(workflow) {
      const counts = (state.wfInsights || {})[workflow.workflow_definition_id] || {};
      const total = Object.values(counts).reduce((a, b) => a + b, 0);
      if (!total) return `<div class="reback-strip"><span class="reback-label">运行反馈</span><span class="reback-chip ok">无待处理</span></div>`;
      const chips = Object.entries(counts).map(([ch, n]) =>
        ch === "design"
          ? `<button class="reback-chip design" type="button" data-open-designer="${escapeAttr(workflow.workflow_definition_id)}">设计 ${n} →</button>`
          : `<span class="reback-chip">${CHANNEL_LABELS[ch] || ch} ${n}</span>`
      ).join("");
      return `<div class="reback-strip"><span class="reback-label">运行反馈 · ${total}</span>${chips}<span class="reback-note">仅设计类可直接处置，其余本期只暴露分类</span></div>`;
    }

    async function chooseDecision(decision) {
      state.decision = decision;
      state.selectedRoute = "";
      const active = state.caseDetail.active_work_item;
      if (!active) return;
      const payload = await request(`/work-items/${active.id}/route-options`, {
        method: "POST",
        body: JSON.stringify({ actor_user_id: state.user.user_id, decision })
      });
      state.routeOptions = payload.items;
      const first = state.routeOptions.find((item) => item.enabled);
      state.selectedRoute = first ? first.edge_id : "";
      render();
    }

    async function completeApproval() {
      clearError();
      try {
        const active = state.caseDetail.active_work_item;
        if (!active) throw new Error("当前没有可处理任务");
        if (!state.decision) throw new Error("请选择审批意见");
        if (!state.selectedRoute) throw new Error("请选择提交路径");
        const payload = await request(`/work-items/${active.id}/complete`, {
          method: "POST",
          body: JSON.stringify({
            actor_user_id: state.user.user_id,
            decision: state.decision,
            selected_edge_id: state.selectedRoute,
            comment: state.comment
          })
        });
        state.caseDetail = payload;
        state.formValues = { ...payload.form_values };
        state.decision = "";
        state.selectedRoute = "";
        state.routeOptions = [];
        state.comment = "";
        await loadWorkbench();
        showToast("处理完成");
        render();
      } catch (error) {
        setError(error.message);
      }
    }

                ${next ? `<button class="button primary" type="button" data-open-case="${escapeAttr(next.case_id)}">立即处理</button>` : `<button class="button primary" type="button" data-nav="launch">发起流程</button>`}
              </div>
            </section>
            <section class="section">
              <div class="section-head">
                <div class="section-title"><strong>${bucketTitle(state.bucket)}</strong><span>当前列表按用户隔离展示。</span></div>
                <button class="button" type="button" data-refresh>刷新</button>
              </div>
              <div class="tabs">
                ${["todo", "initiated", "drafts", "done"].map((bucket) => `<button class="tab ${state.bucket === bucket ? "active" : ""}" type="button" data-bucket="${bucket}">${bucketTitle(bucket)} ${bucketCount(bucket, counts)}</button>`).join("")}

    }

    function renderTaskList() {
      if (!state.listItems.length) {
        return `<div class="empty"><div><strong>暂无${bucketTitle(state.bucket)}</strong><br />切换账号、发起申请或推进审批后，这里会出现对应记录。</div></div>`;
      }
      return `
        <div class="task-table">
          ${state.listItems.map((item) => {
            const caseId = item.case_id;
            const title = item.case_title || item.title;
            const status = item.case_status || item.status;
            const node = item.node_name || item.current_node_name;
            const isDone = state.bucket === "done" && item.handled_count;
            return `
              <button class="task-row" type="button" data-open-case="${escapeAttr(caseId)}">
                <div>
                  <div class="task-title"><strong>${escapeHtml(title)}</strong>${statusTag(status)}${isDone ? `<span class="tag blue">已处理 ${escapeHtml(item.handled_count)} 次</span>` : ""}</div>
                  <div class="meta-line">
                    <span>${escapeHtml(item.case_no || "")}</span>
                    <span>流程：${escapeHtml(item.workflow_name || "员工请假申请")}</span>
                    ${isDone ? `<span>最近处理：${escapeHtml(node || "-")}</span>` : `<span>环节：${escapeHtml(node || "-")}</span>`}
                    ${isDone && item.decision ? `<span>意见：${escapeHtml(item.decision)}</span>` : ""}
                    ${isDone && item.case_current_node_name ? `<span>当前环节：${escapeHtml(item.case_current_node_name)}</span>` : ""}
                    ${item.initiator_name ? `<span>发起人：${escapeHtml(item.initiator_name)}</span>` : ""}
                    ${!isDone && item.current_handler_name ? `<span>处理人：${escapeHtml(item.current_handler_name)}</span>` : ""}
                  </div>
                </div>
                <span class="tag blue">查看</span>
              </button>
            `;
          }).join("")}
        </div>
      `;
    }

    function renderLaunch() {
      return `
        <header class="topbar">
          <div class="page-title"><h1>发起流程</h1><p>按业务场景查找流程，或直接描述你要做什么，由助手匹配最接近的流程。</p></div>
          <div class="top-actions"><button class="button" type="button" data-nav="myProcesses">返回我的流程</button></div>
        </header>
        <section class="catalog-hero">
          <div class="catalog-hero-copy"><span class="catalog-kicker">流程地图</span><h2>发起流程</h2><p>Slice 1 只开放员工请假申请，其他流程入口先保留到后续切片。</p></div>
          <div class="catalog-agent">
            <strong>发起问答助手</strong><span>不知道走哪个流程、会经过哪些环节、符不符合？直接问。</span>
            <div class="launch-chat-log">${renderLaunchChatLog()}</div>
            <div class="catalog-agent-input">
              <input class="input" data-launch-input placeholder="例如：我要请8天病假走哪个流程、会经过哪些环节？" value="${escapeHtml(state.launchInput || "")}" ${state.launchBusy ? "disabled" : ""} />
              <button class="button primary" type="button" data-launch-ask ${state.launchBusy ? "disabled" : ""}>${state.launchBusy ? "…" : "问"}</button>
            </div>
          </div>
        </section>
        <div class="catalog-layout">
          <aside class="catalog-filter"><div class="catalog-panel-title"><strong>分类</strong><span>按场景浏览</span></div><div class="category-item"><span>人事行政</span><span>1</span></div><div class="category-item"><span>财务费用</span><span>0</span></div><div class="category-item"><span>采购合同</span><span>0</span></div></aside>
          <section class="catalog-map-panel">
            <div class="catalog-panel-title"><strong>流程地图</strong><span>当前可发起流程</span></div>
            <div class="catalog-map-grid">
              ${state.workflows.map((workflow) => `
                <article class="workflow-card">
                  <div><span class="catalog-kicker">${escapeHtml(workflow.category)} · ${escapeHtml(workflow.version)}</span><h3>${escapeHtml(workflow.name)}</h3><p>${escapeHtml(workflow.description || "")}</p></div>
                  <div class="meta-line"><span class="tag blue">${workflow.field_count} 字段</span><span class="tag green">${workflow.node_count} 环节</span><span class="tag amber">${workflow.path_count} 路径</span></div>
                  <button class="button primary" type="button" data-start-workflow="${escapeAttr(workflow.workflow_definition_id)}">发起申请</button>
                </article>
              `).join("")}
            </div>
          </section>
          <aside class="catalog-detail-panel"><div class="catalog-panel-title"><strong>流程详情</strong><span>员工请假申请</span></div><div class="assistant-empty">发起后会创建起草任务。起草环节只填写表单和提交路径，不显示同意/不同意。</div></aside>
        </div>
      `;
    }

    function renderLaunchChatLog() {
      if (!state.launchMessages.length && !state.launchBusy) {
        return `<div class="launch-empty">试试：「我要请8天病假该走哪个流程」「报销差旅费走哪个」。</div>`;
      }
      const bubbles = state.launchMessages.map((m) => {
        if (m.role === "user") return `<div class="launch-bubble user">${escapeHtml(m.content)}</div>`;
        const r = m.reply || {};
        const rec = r.recommended_process_name ? `<div class="launch-rec">推荐流程：<strong>${escapeHtml(r.recommended_process_name)}</strong></div>` : "";
        const path = (r.path_preview && r.path_preview.length)
          ? `<div class="launch-path">按你的情况会经过：${r.path_preview.map((n) => `<span class="launch-path-node">${escapeHtml(n)}</span>`).join('<span class="launch-path-arrow">→</span>')}</div>`
          : "";
        return `<div class="launch-bubble assistant"><div>${escapeHtml(r.reply || "")}</div>${rec}${path}</div>`;
      }).join("");
      const thinking = state.launchBusy ? `<div class="launch-bubble assistant"><span class="chat-dots"><i></i><i></i><i></i></span></div>` : "";
      return bubbles + thinking;
    }

    async function askLaunch() {
      const text = (state.launchInput || "").trim();
      if (!text || state.launchBusy) return;
      state.launchMessages.push({ role: "user", content: text });
      state.launchInput = "";
      state.launchBusy = true;
      render();
      try {
        const reply = await request("/copilot/launch/ask", { method: "POST", body: JSON.stringify({ message: text }) });
        state.launchMessages.push({ role: "assistant", reply });
      } catch (error) {
        state.launchMessages.push({ role: "assistant", reply: { reply: "发起助手出错：" + error.message } });
      } finally {
        state.launchBusy = false;
        render();
      }
    }

    function renderWorkflowManage() {
      const stats = workflowManagementStats();
      return `
        <section class="owner-hero">
          <div class="owner-hero-copy">
            <span class="catalog-kicker">流程管理 / Owner</span>
            <h2>流程管理</h2>
            <p>查看我负责的流程定义、发布状态、草稿状态和运行状态。当前 Slice 2A 只管理员工请假申请，编辑和 AI 生成草稿会在后续切片接入。</p>

              <button class="button primary" type="button" data-owner-action="new-flow">新建流程</button>
              <button class="button" type="button" data-nav="designer">进入 AI 设计</button>
            </div>
          </div>

            ${ownerStat("我管理的流程", stats.total, "当前账号可管理流程")}

            ${ownerStat("待澄清", stats.issues, "配置缺口或待确认项")}
            ${ownerStat("运行中实例", stats.running, "受当前发布版本影响")}
          </div>
        </section>
        <div class="owner-flow-layout">
          <section class="owner-flow-panel" aria-label="我管理的流程列表">
            <div class="owner-flow-panel-head">
              <div><strong>我管理的流程</strong><span>选择流程后查看定义、字段、环节、路径与期限配置。</span></div>
              <span class="tag blue">Owner 权限</span>
            </div>
            <div class="owner-flow-toolbar">
              <div class="owner-flow-filters" role="tablist" aria-label="流程状态筛选">
                ${ownerFilterButton("all", "全部")}
                ${ownerFilterButton("draft", "有草稿")}
                ${ownerFilterButton("pending", "待发布")}
                ${ownerFilterButton("issue", "待处理")}
              </div>
              <input class="input" data-owner-search type="search" value="${escapeAttr(state.workflowManageSearch)}" placeholder="搜索流程、owner、分类或关键词" />
            </div>
            <div class="owner-flow-list">${renderManagedWorkflowCards()}</div>
          </section>
          ${renderOwnerSidePanel()}
        </div>
      `;
    }

    function ownerStat(label, value, hint) {
      return `<div class="owner-stat-card"><label>${escapeHtml(label)}</label><strong>${escapeHtml(value)}</strong><span>${escapeHtml(hint)}</span></div>`;
    }

    function ownerFilterButton(filter, label) {
      return `<button class="owner-flow-filter ${state.workflowManageFilter === filter ? "active" : ""}" type="button" data-owner-filter="${filter}">${escapeHtml(label)}</button>`;
    }

    function workflowManagementStats() {
      return state.managedWorkflows.reduce((stats, item) => {
        stats.total += 1;
        stats.drafts += item.management?.draft_state && item.management.draft_state !== "暂无草稿" ? 1 : 0;
        stats.issues += item.management?.issue_count || 0;
        stats.running += item.runtime_stats?.running_instances || 0;
        return stats;
      }, { total: 0, drafts: 0, issues: 0, running: 0 });
    }

    function filteredManagedWorkflows() {
      const query = state.workflowManageSearch.trim().toLowerCase();
      return state.managedWorkflows.filter((item) => {
        const management = item.management || {};
        if (state.workflowManageFilter === "draft" && management.draft_state === "暂无草稿") return false;
        if (state.workflowManageFilter === "pending" && management.publish_state === "已发布") return false;
        if (state.workflowManageFilter === "issue" && !management.issue_count) return false;
        if (!query) return true;
        return [
          item.name,
          item.category,
          item.owner_dept_name,
          item.version,
          item.status,
          item.description,
          management.owner_name,
          management.publish_state,
          management.draft_state,
          management.health,
          management.next_action
        ].join(" ").toLowerCase().includes(query);
      });
    }

    function renderManagedWorkflowCards() {
      const rows = filteredManagedWorkflows();
      if (!rows.length) return `<div class="empty"><div><strong>没有匹配流程</strong><br />切换筛选条件或清空搜索后再看。</div></div>`;
      return rows.map((workflow) => {
        const management = workflow.management || {};
        const runtime = workflow.runtime_stats || {};
        const hasDraft = hasDesignDraft(workflow);
        const isNewDraft = workflow.status === "DRAFT" || management.is_new_draft;
        const draftLabel = hasDraft
          ? `${management.draft_version || "V1.1.0-draft"} · ${management.draft_state || "AI 草稿"}`
          : "暂无草稿";
        const draftHint = hasDraft
          ? `${management.draft_progress || "35%"} · ${formatDateTime(management.updated_at || workflow.updated_at)}`
          : "从当前发布版本创建修订草稿";
        const primaryAction = hasDraft || isNewDraft ? "继续设计" : "进入设计";
        const publishState = management.publish_state || workflow.status;
        const publishTone = isNewDraft ? "amber" : "blue";
        const canDeleteDraft = Boolean(management.can_delete_draft && management.design_session_id);
        return `
          <article class="owner-flow-card ${isNewDraft ? "draft-card" : ""}">
            <div class="owner-card-top">
              <div class="owner-card-title">
                <strong>${escapeHtml(workflow.name)}</strong>
                <span>${escapeHtml(workflow.description || "用于员工年假、事假、病假等请假申请。")}</span>
              </div>
              <span class="tag ${isNewDraft ? "amber" : (management.health_tone || "green")}">${escapeHtml(isNewDraft ? "未发布草稿" : (management.health || "正常"))}</span>
            </div>
            <div class="owner-card-status-line">
              <div class="owner-card-status-cell"><label>发布版本</label><strong>${escapeHtml(management.last_published || workflow.version)}</strong><span>${escapeHtml(management.publish_state || workflow.status)}</span></div>
              <div class="owner-card-status-cell"><label>设计草稿</label><strong>${escapeHtml(draftLabel)}</strong><span>${escapeHtml(draftHint)}</span></div>
              <div class="owner-card-status-cell"><label>运行中实例</label><strong>${escapeHtml(runtime.running_instances || 0)} 个</strong></div>
            </div>
            <div class="meta-line">
              <span class="tag blue">${escapeHtml(workflow.category)}</span>
              <span class="tag ${publishTone}">${escapeHtml(publishState)}</span>
              <span class="tag">${escapeHtml(management.owner_name || workflow.owner_dept_name || "-")}</span>
            </div>
            <div class="owner-card-notice">
              <span>${escapeHtml(management.next_action || "当前版本可查看，不支持直接编辑。")}</span>
              <span>${escapeHtml(formatDateTime(workflow.updated_at))}</span>
            </div>
            ${renderRebackStrip(workflow)}
            <div class="owner-card-actions">
              <button class="button" type="button" data-owner-action="versions">版本记录</button>
              ${canDeleteDraft ? `<button class="button danger" type="button" data-delete-design-draft="${escapeAttr(management.design_session_id)}" data-delete-design-name="${escapeAttr(workflow.name)}">删除草稿</button>` : ""}
              <button class="button primary" type="button" data-open-designer="${escapeAttr(workflow.workflow_definition_id)}">${escapeHtml(primaryAction)}</button>
            </div>
          </article>
        `;
      }).join("");
    }

    function hasDesignDraft(workflow) {
      const draftState = workflow?.management?.draft_state;
      return Boolean(draftState && draftState !== "暂无草稿");
    }

    function designDraftSaveText(session) {
      if (state.designSaveState === "saving") return "保存中...";
      if (state.designSaveState === "error") return "保存失败";
      if (!session) return "本地草稿未保存";
      return `已保存 ${formatDateTime(session.session?.updated_at)}`;
    }

    function renderOwnerSidePanel() {
      const workflow = state.managedWorkflows[0];
      const management = workflow?.management || {};
      const runtime = workflow?.runtime_stats || {};
      const issueCount = management.issue_count || 0;
      return `
        <aside class="owner-side-panel" aria-label="流程管理待处理">
          <div class="owner-side-head">
            <div><strong>管理提醒</strong><span>来自定义检查、运行反馈和发布前准备。</span></div>
            <span class="tag ${issueCount ? "amber" : "green"}">${issueCount ? `${issueCount} 项` : "正常"}</span>
          </div>
          <div class="owner-side-body">
            <div class="owner-todo-item">
              <strong>${issueCount ? "处理期限未配置" : "当前配置正常"}</strong>
              <span>${issueCount ? `员工请假申请有 ${issueCount} 个环节未设置处理期限，当前运行不阻断，后续可在流程设计中补齐。` : "当前发布版本没有发现阻断项，可继续观察运行情况。"}</span>

              <button class="button" type="button" data-nav="designer">进入 AI 设计</button>
            </div>
            <div class="owner-release-list" aria-label="版本发布节奏">
              <div class="owner-release-item">
                <strong>当前发布版本</strong>
                <span>${escapeHtml(workflow?.version || "-")} · ${escapeHtml(workflow?.status || "-")} · ${escapeHtml(runtime.total_instances || 0)} 个实例</span>
              </div>
              <div class="owner-release-item">
                <strong>下一个版本节奏</strong>
                <span>先补齐处理期限与 AI 设计草稿链路，再进入版本发布能力。</span>
              </div>
            </div>
          </div>
        </aside>
      `;
    }

    function renderDesigner() {
      if (state.designerView === "entry") return renderDesignerEntry();
      if (state.designerView === "initialize") return renderDesignerInitialize();
      if (state.designerView === "workspace" || state.designSession) return renderDesignerWorkspace();
      return renderDesignerEntry();
    }

    function renderDesignerEntry() {
      const managedCount = state.managedWorkflows.length;
      const draftCount = state.managedWorkflows.filter((item) => item.management?.draft_state && item.management.draft_state !== "暂无草稿").length;
      return `
        <section class="designer-screen designer-entry-screen" aria-label="AI 流程设计入口">
          <div class="designer-hero">
            <div class="designer-hero-copy">
              <span class="catalog-kicker">流程管理 / Owner</span>
              <h2>AI 流程设计</h2>
              <p>先选择本次设计任务的开始方式。进入具体草稿后，页面会切换为左侧 AI 对话、右侧配置工作区。</p>
            </div>
            <div class="designer-hero-side">
              <div class="designer-summary">
                <div class="designer-metric"><label>可修改流程</label><strong>${managedCount}</strong><span>当前 Owner 权限</span></div>
                <div class="designer-metric"><label>设计草稿</label><strong>${draftCount}</strong><span>可继续迭代</span></div>
                <div class="designer-metric"><label>待接入 Source</label><strong>${state.pendingDesignSources.length}</strong><span>新建流程材料</span></div>
                <div class="designer-metric"><label>当前模式</label><strong>入口</strong><span>选择后进入工作台</span></div>
              </div>
            </div>
          </div>
          <div class="designer-entry-cards" aria-label="选择 AI 设计开始方式">
            <button class="designer-start-card" type="button" data-designer-start="create">
              <span class="tag blue">新流程</span>
              <strong>新建流程</strong>
              <p>从空白、模板或 source 开始。先选择审批流程或 Agentic workflow，再进入 AI 设计工作台。</p>
              <em>选择流程类型</em>
            </button>
            <button class="designer-start-card" type="button" data-designer-start="revise">
              <span class="tag green">修订</span>
              <strong>修改已有流程</strong>

              <em>选择已有流程</em>
            </button>
            <div class="designer-start-card passive">
              <span class="tag neutral">后续</span>
              <strong>继续最近草稿</strong>
              <p>后续展示最近编辑过的流程草稿、校验状态和发布进度。</p>
              <em>当前 Slice 先不开放</em>
            </div>
          </div>
          ${state.newProcessModalOpen ? renderNewProcessTypeModal() : ""}
          ${state.ownedProcessModalOpen ? renderOwnedProcessModal() : ""}
          ${state.sourceModalOpen ? renderSourceModal(null) : ""}
        </section>
      `;
    }

    function renderDesignerInitialize() {
      const sources = state.pendingDesignSources || [];
      const hasInput = sources.length || state.initializationInstruction.trim();
      const isRunning = state.initializationRunning;
      const progressItems = [
        { node: "source_file_loader", title: "读取输入", detail: "source 文件和补充说明统一进入 raw source 上下文。" },
        { node: "source_context_builder", title: "构建 source context", detail: "整理 source catalog、chunk 和原文上下文。" },
        { node: "process_extraction_agent", title: "抽取流程定义", detail: "调用 ProcessExtractionAgent 生成 ProcessDefinition 草稿。" },
        { node: "structural_validator", title: "结构校验", detail: "检查 schema、字段环节引用和路径目标。" },
        { node: "business_validation_agent", title: "业务缺口校验", detail: "检查字段、环节、路径、角色和附件缺失。" },
        { node: "workflow_design_output_writer", title: "写入设计草稿", detail: "保存草稿并进入 AI 流程设计工作台。" }
      ];
      const progressStatus = (item, index) => {
        const nodeProgress = state.initializationProgressByNode[item.node];
        if (nodeProgress?.status) return nodeProgress.status;
        if (isRunning && index === 0 && !Object.keys(state.initializationProgressByNode).length) return "running";
        return "pending";
      };
      const progressIcon = (status, index) => {
        if (status === "done") return "✓";
        if (status === "failed") return "!";
        if (status === "running") return "●";
        return index + 1;
      };
      return `
        <section class="initializer-screen" aria-label="AI 流程初始化">

            <defs>
              ${["system", "forward", "conditional", "return", "end"].map((kind) => `

    const LOGICFLOW_CSS_URL = "https://unpkg.com/@logicflow/core/es/index.css";
    const LOGICFLOW_JS_URL = "https://unpkg.com/@logicflow/core/dist/logic-flow.min.js";
    let logicFlowLoadPromise = null;

    function ensureLogicFlow() {
      if (window.LogicFlow) return Promise.resolve(window.LogicFlow);
      if (logicFlowLoadPromise) return logicFlowLoadPromise.then((value) => window.LogicFlow || value);
      logicFlowLoadPromise = new Promise((resolve) => {
        if (!document.querySelector("link[data-logicflow-css]")) {
          const link = document.createElement("link");
          link.rel = "stylesheet";
          link.href = LOGICFLOW_CSS_URL;
          link.dataset.logicflowCss = "1";
          document.head.appendChild(link);
        }
        const script = document.createElement("script");
        script.src = LOGICFLOW_JS_URL;
        script.async = true;
        script.dataset.logicflowScript = "1";
        let resolved = false;
        const finish = (value) => {
          if (resolved) return;
          resolved = true;
          resolve(value);
        };
        script.onload = () => finish(window.LogicFlow || null);
        script.onerror = () => finish(null);
        window.setTimeout(() => finish(window.LogicFlow || null), 3500);
        document.head.appendChild(script);
      });
      return logicFlowLoadPromise;
    }

    function mountLogicFlowDiagrams() {
      const process = state.designSession?.draft_definition;
      if (!process) return;
      document.querySelectorAll("[data-logic-flow]").forEach((host) => {
        mountLogicFlowDiagram(host, process);
      });
      bindLegacyGraphHighlights();
    }

    async function mountLogicFlowDiagram(host, process) {
      const canvas = host.querySelector(".logicflow-canvas");
      if (!canvas || host.dataset.logicFlowMounted === "1") return;
      host.dataset.logicFlowMounted = "1";
      const LogicFlow = await ensureLogicFlow();
      if (!LogicFlow || !document.body.contains(host)) {
        host.classList.add("fallback");
        return;
      }
      try {
        const overview = host.dataset.logicFlowOverview === "1";
        const data = processToLogicFlowData(process, { overview });
        const rect = host.getBoundingClientRect();
        const width = Math.max(Math.floor(rect.width || 760), overview ? 560 : 760);
        const height = Math.max(Math.floor(rect.height || 560), overview ? 520 : 560);
        canvas.innerHTML = "";
        const lf = new LogicFlow({
          container: canvas,
          width,
          height,
          grid: true,
          stopScrollGraph: false,
          stopZoomGraph: false,
          stopMoveGraph: false,
          adjustNodePosition: false,
          adjustEdge: false,
          hideAnchors: true,
          nodeTextEdit: false,
          edgeTextEdit: false,
          keyboard: { enabled: false },
        });
        if (typeof lf.updateEditConfig === "function") {
          lf.updateEditConfig({
            adjustNodePosition: false,
            adjustEdge: false,
            adjustEdgeMiddle: false,
            adjustEdgeStartAndEnd: false,
            hideAnchors: true,
            nodeTextEdit: false,
            edgeTextEdit: false,
          });
        }
        lf.render(data);
        if (typeof lf.fitView === "function") {
          window.setTimeout(() => lf.fitView(28, 28), 0);
        }
        bindLogicFlowHighlight(lf, data);
        if (!overview && typeof lf.on === "function") {
          lf.on("node:click", ({ data: nodeData }) => {
            const nodeId = nodeData?.properties?.nodeId;
            if (!nodeId || nodeId === "END") return;
            state.designerHighlightedNodeId = normalizeDesignerTargetId(nodeId);
            state.designerExpandedNodes = { ...state.designerExpandedNodes, [nodeId]: true };
            state.designTab = "nodes";
            render();
          });
        }
        host.classList.add("loaded");
      } catch (error) {
        console.warn("LogicFlow render failed", error);
        host.classList.add("fallback");
      }
    }

    function bindLogicFlowHighlight(lf, baseData) {
      if (!lf || typeof lf.on !== "function") return;
      let hoverEdgeId = "";
      let pinnedEdgeId = "";
      let activeEdgeId = "";

      const rerender = () => {
        const nextActiveEdgeId = hoverEdgeId || pinnedEdgeId || "";
        if (nextActiveEdgeId === activeEdgeId) return;
        activeEdgeId = nextActiveEdgeId;
        lf.render(withLogicFlowHighlight(baseData, activeEdgeId));
      };

      lf.on("edge:mouseenter", ({ data: edgeData }) => {
        hoverEdgeId = edgeData?.id || "";
        rerender();
      });
      lf.on("edge:mouseleave", () => {
        hoverEdgeId = "";
        rerender();
      });
      lf.on("edge:click", ({ data: edgeData }) => {
        const edgeId = edgeData?.id || "";
        pinnedEdgeId = pinnedEdgeId === edgeId ? "" : edgeId;
        hoverEdgeId = "";
        rerender();
      });
      lf.on("blank:click", () => {
        pinnedEdgeId = "";
        hoverEdgeId = "";
        rerender();
      });
    }

    function bindLegacyGraphHighlights() {
      document.querySelectorAll(".graph-fallback-board").forEach((board) => {
        if (board.dataset.edgeHighlightBound === "1") return;
        board.dataset.edgeHighlightBound = "1";
        let pinnedEdgeId = "";
        let hoverEdgeId = "";

        const applyHighlight = () => {
          const activeEdgeId = hoverEdgeId || pinnedEdgeId || "";
          const activeGroup = activeEdgeId
            ? board.querySelector(`[data-graph-edge="${cssEscapeValue(activeEdgeId)}"]`)
            : null;
          board.classList.toggle("has-edge-highlight", Boolean(activeGroup));
          board.querySelectorAll("[data-graph-edge]").forEach((group) => {
            group.classList.toggle("is-highlighted", group === activeGroup);
          });
          board.querySelectorAll("[data-node-jump]").forEach((node) => {
            const nodeId = node.dataset.nodeJump;
            const connected = activeGroup
              && (activeGroup.dataset.sourceNode === nodeId || activeGroup.dataset.targetNode === nodeId);
            node.classList.toggle("is-connected", Boolean(connected));
          });
        };

        board.querySelectorAll(".graph-edge-hitbox").forEach((hitbox) => {
          hitbox.addEventListener("mouseenter", () => {
            hoverEdgeId = hitbox.closest("[data-graph-edge]")?.dataset.graphEdge || "";
            board.style.cursor = hoverEdgeId ? "pointer" : "default";
            applyHighlight();
          });
          hitbox.addEventListener("mouseleave", () => {
            hoverEdgeId = "";
            board.style.cursor = "default";
            applyHighlight();
          });
          hitbox.addEventListener("click", (event) => {
            event.stopPropagation();
            const edgeId = hitbox.closest("[data-graph-edge]")?.dataset.graphEdge || "";
            pinnedEdgeId = pinnedEdgeId === edgeId ? "" : edgeId;
            hoverEdgeId = "";
            applyHighlight();
          });
        });

        board.addEventListener("mousemove", (event) => {
          if (event.target.closest("[data-node-jump]")) {
            hoverEdgeId = "";
            board.style.cursor = "default";
            applyHighlight();
            return;
          }
          const nearestEdgeId = findNearestLegacyEdge(board, event.clientX, event.clientY);
          if (nearestEdgeId !== hoverEdgeId) {
            hoverEdgeId = nearestEdgeId;
            board.style.cursor = nearestEdgeId ? "pointer" : "default";
            applyHighlight();
          }
        });

        board.addEventListener("mouseleave", () => {
          hoverEdgeId = "";
          board.style.cursor = "default";
          applyHighlight();
        });

        board.addEventListener("click", (event) => {
          if (event.target.closest(".graph-edge-hitbox")) return;
          if (event.target.closest("[data-node-jump]")) return;
          const nearestEdgeId = findNearestLegacyEdge(board, event.clientX, event.clientY);
          if (nearestEdgeId) {
            event.stopPropagation();
            pinnedEdgeId = pinnedEdgeId === nearestEdgeId ? "" : nearestEdgeId;
            hoverEdgeId = "";
            applyHighlight();
            return;
          }
          pinnedEdgeId = "";
          hoverEdgeId = "";
          applyHighlight();
        });
      });
    }

    function findNearestLegacyEdge(board, clientX, clientY) {
      const svg = board.querySelector(".graph-fallback-svg");
      if (!svg) return "";
      let point = null;
      try {
        const rect = svg.getBoundingClientRect();
        const viewBox = parseSvgViewBox(svg);
        if (!rect.width || !rect.height || !viewBox?.width || !viewBox?.height) return "";
        point = {
          x: viewBox.x + ((clientX - rect.left) * viewBox.width) / rect.width,
          y: viewBox.y + ((clientY - rect.top) * viewBox.height) / rect.height,
        };
      } catch {
        return "";
      }

      let nearestEdgeId = "";
      let nearestDistance = Infinity;
      board.querySelectorAll(".graph-edge-hitbox").forEach((path) => {
        const pathPoints = parseLegacyPathPoints(path.getAttribute("d") || "");
        if (pathPoints.length < 2) return;
        for (let index = 0; index < pathPoints.length - 1; index += 1) {
          const distance = distanceToSegment(point, pathPoints[index], pathPoints[index + 1]);
          if (distance < nearestDistance) {
            nearestDistance = distance;
            nearestEdgeId = path.closest("[data-graph-edge]")?.dataset.graphEdge || "";
          }
        }
      });
      return nearestDistance <= 18 ? nearestEdgeId : "";
    }

    function parseLegacyPathPoints(pathData) {
      const numbers = String(pathData).match(/-?\d+(?:\.\d+)?/g)?.map(Number) || [];
      const points = [];
      for (let index = 0; index < numbers.length - 1; index += 2) {
        points.push({ x: numbers[index], y: numbers[index + 1] });
      }
      return points;
    }

    function distanceToSegment(point, start, end) {
      const dx = end.x - start.x;
      const dy = end.y - start.y;
      if (!dx && !dy) return Math.hypot(point.x - start.x, point.y - start.y);
      const ratio = Math.max(0, Math.min(1, ((point.x - start.x) * dx + (point.y - start.y) * dy) / (dx * dx + dy * dy)));
      const projected = { x: start.x + ratio * dx, y: start.y + ratio * dy };
      return Math.hypot(point.x - projected.x, point.y - projected.y);
    }

    function parseSvgViewBox(svg) {
      const raw = svg?.getAttribute("viewBox") || "";
      const parts = raw.split(/[\s,]+/).map(Number).filter(Number.isFinite);
      if (parts.length !== 4) return null;
      return { x: parts[0], y: parts[1], width: parts[2], height: parts[3] };
    }

    function cssEscapeValue(value) {
      if (window.CSS && typeof window.CSS.escape === "function") {
        return window.CSS.escape(String(value));
      }
      return String(value).replace(/["\\]/g, "\\$&");
    }

    function withLogicFlowHighlight(baseData, activeEdgeId) {
      if (!activeEdgeId) return cloneLogicFlowData(baseData);
      const activeEdge = (baseData.edges || []).find((edge) => edge.id === activeEdgeId);
      if (!activeEdge) return cloneLogicFlowData(baseData);
      const connectedNodeIds = new Set([activeEdge.sourceNodeId, activeEdge.targetNodeId]);
      return {
        nodes: (baseData.nodes || []).map((node) => {
          const connected = connectedNodeIds.has(node.id);
          return {
            ...node,
            style: logicFlowHighlightNodeStyle(node.style, connected),
            properties: { ...(node.properties || {}) },
          };
        }),
        edges: (baseData.edges || []).map((edge) => {
          const active = edge.id === activeEdgeId;
          return {
            ...edge,
            text: cloneLogicFlowText(edge.text),
            style: logicFlowHighlightEdgeStyle(edge.style, active),
            properties: { ...(edge.properties || {}) },
          };
        }),
      };
    }

    function cloneLogicFlowData(data) {
      return {
        nodes: (data.nodes || []).map((node) => ({
          ...node,
          style: { ...(node.style || {}) },
          properties: { ...(node.properties || {}) },
        })),
        edges: (data.edges || []).map((edge) => ({
          ...edge,
          text: cloneLogicFlowText(edge.text),
          style: { ...(edge.style || {}) },
          properties: { ...(edge.properties || {}) },
        })),
      };
    }

    function cloneLogicFlowText(text) {
      if (!text || typeof text !== "object") return text;
      return { ...text };
    }

    function logicFlowHighlightNodeStyle(style, connected) {
      const base = { ...(style || {}) };
      if (connected) {
        return {
          ...base,
          stroke: "#1677ff",
          strokeWidth: 3,
          fill: base.fill || "#ffffff",
          opacity: 1,
        };
      }
      return {
        ...base,
        stroke: "#d9d9d9",
        strokeWidth: 1,
        opacity: 0.38,
      };
    }

    function logicFlowHighlightEdgeStyle(style, active) {
      const base = { ...(style || {}) };
      if (active) {
        return {
          ...base,
          strokeWidth: 4,
          opacity: 1,
          strokeOpacity: 1,
        };
      }
      return {
        ...base,
        strokeWidth: Math.max(1, Number(base.strokeWidth || 1.5) - 0.3),
        opacity: 0.22,
        strokeOpacity: 0.22,
      };
    }

    function processToGraphViewModel(process) {
      const flowNodes = process.flow_nodes || [];
      const nodeOrder = new Map(flowNodes.map((node, index) => [normalizeDesignerTargetId(node.node_id), index]));
      const lastFlowNodeId = normalizeDesignerTargetId(flowNodes[flowNodes.length - 1]?.node_id);
      const nodes = [
        ...flowNodes.map((node) => ({
          id: normalizeDesignerTargetId(node.node_id),
          label: node.node_name,
          kind: node.is_draft ? "draft" : "approval",
          role: node.handler?.role || null,
          timeLimitDays: node.time_limit_days ?? null,
          opinionRequired: Boolean(node.opinion?.conclusive_required),
        })),
        { id: "END", label: "审批完成", kind: "end", role: null },
      ];
      const edges = [];
      let returnRailLabelAssigned = false;
      flowNodes.forEach((node) => {
        (node.submit_paths || []).forEach((path, index) => {
          const source = normalizeDesignerTargetId(node.node_id);
          const target = normalizeDesignerTargetId(path.target_node_id);
          if (isGraphHiddenPath(path, source, target)) return;
          const kind = graphEdgeKind(path);
          const isReturnRail = kind === "return" && target === "draft";
          const isReturnPrimary = isReturnRail && !returnRailLabelAssigned;
          if (isReturnRail) returnRailLabelAssigned = true;
          edges.push({
            id: `${source}__${target}__${index}`,
            source,
            target,
            label: isReturnRail ? (isReturnPrimary ? "不同意：退回起草" : "") : graphEdgeLabel(path),
            condition: path.condition || null,
            kind,
            pathName: path.path_name || "",
            sourceOrder: nodeOrder.get(source) ?? 0,
            targetOrder: target === "END" ? flowNodes.length : (nodeOrder.get(target) ?? 0),
            route: target === "END" && source !== lastFlowNodeId ? "skip-to-end" : null,
          });
        });
      });
      return {
        process_id: process.meta?.process_id || "",
        process_name: process.meta?.process_name || "",
        nodes,
        edges: assignGraphEdgeRouting(edges),
      };
    }

    function assignGraphEdgeRouting(edges) {
      const routed = edges.map((edge, index) => ({ ...edge, graphIndex: index }));
      const returnTargets = Array.from(
        new Map(
          routed
            .filter((edge) => edge.kind === "return")
            .map((edge) => [edge.target, { id: edge.target, order: Number(edge.targetOrder ?? 0) }])
        ).values()
      ).sort((a, b) => a.order - b.order);
      const returnTargetLane = new Map();
      returnTargets.forEach((item, index) => {
        returnTargetLane.set(item.id, returnTargets.length - 1 - index);
      });
      const returnBySource = groupGraphEdges(routed.filter((edge) => edge.kind === "return"), (edge) => edge.source);
      const returnByTarget = groupGraphEdges(routed.filter((edge) => edge.kind === "return"), (edge) => edge.target);
      const rightRailEdges = routed.filter((edge) => edge.kind !== "return" && edge.source !== edge.target);
      const rightRailTargets = Array.from(
        new Map(
          rightRailEdges
            .filter((edge) => edge.route === "skip-to-end" || Math.abs(Number(edge.targetOrder ?? 0) - Number(edge.sourceOrder ?? 0)) > 1)
            .map((edge) => [edge.target, { id: edge.target, order: Number(edge.targetOrder ?? 0) }])
        ).values()
      ).sort((a, b) => a.order - b.order);
      const rightTargetLane = new Map(rightRailTargets.map((item, index) => [item.id, index]));
      const directedGroups = groupGraphEdges(routed, (edge) => `${edge.source}->${edge.target}`);
      const unorderedGroups = groupGraphEdges(routed, (edge) => [edge.source, edge.target].sort().join("<->"));

      routed.forEach((edge) => {
        const sameDirection = directedGroups.get(`${edge.source}->${edge.target}`) || [edge];
        const sameDirectionIndex = sameDirection.findIndex((item) => item.id === edge.id);
        const unordered = unorderedGroups.get([edge.source, edge.target].sort().join("<->")) || [edge];
        const hasReverse = unordered.some((item) => item.source === edge.target && item.target === edge.source);
        const sourceReturns = returnBySource.get(edge.source) || [];
        const targetReturns = returnByTarget.get(edge.target) || [];
        const sourceReturnIndex = sourceReturns.findIndex((item) => item.id === edge.id);
        const targetReturnIndex = targetReturns.findIndex((item) => item.id === edge.id);
        edge.parallelSlot = sameDirectionIndex - (sameDirection.length - 1) / 2;
        edge.parallelCount = sameDirection.length;
        edge.hasReverse = hasReverse;
        edge.returnLane = returnTargetLane.get(edge.target) ?? 0;
        edge.returnSourceSlot = sourceReturnIndex - (sourceReturns.length - 1) / 2;
        edge.returnTargetSlot = targetReturnIndex - (targetReturns.length - 1) / 2;
        edge.rightLane = rightTargetLane.get(edge.target) ?? 0;
      });
      return routed;
    }

    function groupGraphEdges(edges, keyFn) {
      const groups = new Map();
      edges.forEach((edge) => {
        const key = keyFn(edge);
        if (!groups.has(key)) groups.set(key, []);
        groups.get(key).push(edge);
      });
      return groups;
    }

    function processToLogicFlowData(process, options = {}) {
      const overview = Boolean(options.overview);
      const graph = processToGraphViewModel(process);
      const positions = graphLayoutPositions(graph);
      return {
        nodes: graph.nodes.map((node) => ({
          id: node.id,
          type: node.kind === "start" || node.kind === "draft" || node.kind === "end" ? "circle" : "rect",
          x: positions[node.id]?.x || 360,
          y: positions[node.id]?.y || 120,
          text: node.label,
          width: graphNodeWidth(node.id),
          height: graphNodeHeight(node.id),
          style: graphNodeStyle(node.kind),
          properties: {
            nodeId: node.id,
            nodeType: `${node.kind}-node`,
            kind: node.kind,
            width: graphNodeWidth(node.id),
            height: graphNodeHeight(node.id),
            role: node.role,
            timeLimitDays: node.timeLimitDays ?? null,
            opinionRequired: Boolean(node.opinionRequired),
          },
        })),
        edges: graph.edges.map((edge, index) => ({
          id: edge.id,
          type: "polyline",
          sourceNodeId: edge.source,
          targetNodeId: edge.target,
          text: graphLogicFlowEdgeText(edge, positions[edge.source], positions[edge.target], index),
          startPoint: graphEdgeStartPoint(edge, positions[edge.source], positions[edge.target], index),
          endPoint: graphEdgeEndPoint(edge, positions[edge.source], positions[edge.target], index),
