          pointsList: graphEdgePoints(edge, positions[edge.source], positions[edge.target], index),
          style: graphEdgeStyle(edge.kind),
          properties: {
            kind: edge.kind,
            pathName: edge.pathName,
            condition: edge.condition,
          },
        })),
      };
    }

    function graphBounds(positions) {
      const points = Object.values(positions);
      const maxX = Math.max(860, ...points.map((point) => point.x + 220));
      const maxY = Math.max(720, ...points.map((point) => point.y + 110));
      return { width: maxX, height: maxY };
    }

    function renderLegacyGraphEdge(edge, positions, index) {
      const source = positions[edge.source];
      const target = positions[edge.target];
      if (!source || !target) return "";
      const path = legacyGraphEdgePath(edge, source, target, index);
      const label = legacyGraphEdgeLabelPoint(edge, source, target, index);
      const color = graphEdgeColor(edge.kind);
      const dash = edge.kind === "return" ? " stroke-dasharray=\"7 5\"" : "";
      return `
        <g class="graph-edge-group ${escapeAttr(edge.kind || "forward")}" data-graph-edge="${escapeAttr(edge.id)}" data-source-node="${escapeAttr(edge.source)}" data-target-node="${escapeAttr(edge.target)}">
          <path class="graph-edge-path" d="${escapeAttr(path)}" fill="none" stroke="${escapeAttr(color)}" stroke-width="1.7" stroke-linecap="butt" stroke-linejoin="round"${dash} marker-end="url(#arrow-${escapeAttr(edge.kind || "forward")})"></path>
          <path class="graph-edge-hitbox" d="${escapeAttr(path)}" fill="none" stroke="rgba(0,0,0,0)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"></path>
          ${edge.label ? `<text class="graph-edge-label ${escapeAttr(edge.kind || "forward")}" x="${label.x}" y="${label.y}" text-anchor="${label.anchor || "middle"}">${escapeHtml(edge.label)}</text>` : ""}
        </g>
      `;
    }

    function legacyGraphEdgePath(edge, source, target, index) {
      const points = graphEdgePoints(edge, source, target, index);
      if (!points.length) return "";
      return points.map((point, pointIndex) => `${pointIndex === 0 ? "M" : "L"} ${point.x} ${point.y}`).join(" ");
    }

    function graphEdgeStartPoint(edge, source, target, index) {
      const points = graphEdgePoints(edge, source, target, index);
      return points[0] || null;
    }

    function graphEdgeEndPoint(edge, source, target, index) {
      const points = graphEdgePoints(edge, source, target, index);
      return points[points.length - 1] || null;
    }

    function graphEdgePoints(edge, source, target, index) {
      if (!source || !target) return [];
      if (edge.source === edge.target) {
        const sourceRight = graphNodeAnchor(source, edge.source, "right");
        const loopX = source.x + 190;
        return [sourceRight, { x: loopX, y: sourceRight.y }, { x: loopX, y: sourceRight.y + 54 }, { x: sourceRight.x, y: sourceRight.y + 54 }];
      }
      if (edge.kind === "return") {
        const sourceLeft = graphNodeAnchor(source, edge.source, "left", graphReturnSourceOffset(edge));
        const targetLeft = graphNodeAnchor(target, edge.target, "left", graphReturnTargetOffset(edge));
        const railX = returnRailX(edge, source, target);
        return [sourceLeft, { x: railX, y: sourceLeft.y }, { x: railX, y: targetLeft.y }, targetLeft];
      }
      if (edge.route === "skip-to-end") {
        const sourceRight = graphNodeAnchor(source, edge.source, "right", graphRightRailSourceOffset(edge));
        const targetRight = graphNodeAnchor(target, edge.target, "right", graphRightRailTargetOffset(edge));
        const railX = skipEndRailX(edge, source, target);
        return [sourceRight, { x: railX, y: sourceRight.y }, { x: railX, y: targetRight.y }, targetRight];
      }
      if (isNonAdjacentVerticalEdge(edge, source, target)) {
        const railX = branchRailX(edge, source, target);
        const offset = graphRightRailSourceOffset(edge);
        const targetOffset = graphRightRailTargetOffset(edge);
        const sourceAnchor = railX >= source.x
          ? graphNodeAnchor(source, edge.source, "right", offset)
          : graphNodeAnchor(source, edge.source, "left", offset);
        const targetAnchor = railX >= target.x
          ? graphNodeAnchor(target, edge.target, "right", targetOffset)
          : graphNodeAnchor(target, edge.target, "left", targetOffset);
        return [sourceAnchor, { x: railX, y: sourceAnchor.y }, { x: railX, y: targetAnchor.y }, targetAnchor];
      }
      if (source.x !== target.x) {
        const offset = graphParallelOffset(edge);
        const sourceAnchor = target.x > source.x
          ? graphNodeAnchor(source, edge.source, "right", offset)
          : graphNodeAnchor(source, edge.source, "left", offset);
        const targetAnchor = target.x > source.x
          ? graphNodeAnchor(target, edge.target, "left", offset)
          : graphNodeAnchor(target, edge.target, "right", offset);
        const midX = (sourceAnchor.x + targetAnchor.x) / 2;
        return [sourceAnchor, { x: midX, y: sourceAnchor.y }, { x: midX, y: targetAnchor.y }, targetAnchor];
      }
      const adjacentReverseOffset = graphAdjacentReverseOffset(edge);
      const parallelOffset = adjacentReverseOffset || graphParallelOffset(edge);
      if ((edge.targetOrder ?? 0) < (edge.sourceOrder ?? 0)) {
        return [
          graphNodeAnchor(source, edge.source, "top", parallelOffset),
          graphNodeAnchor(target, edge.target, "bottom", parallelOffset),
        ];
      }
      return [
        graphNodeAnchor(source, edge.source, "bottom", parallelOffset),
        graphNodeAnchor(target, edge.target, "top", parallelOffset),
      ];
    }

    function isNonAdjacentVerticalEdge(edge, source, target) {
      if (!source || !target || source.x !== target.x) return false;
      if (edge.source === edge.target || edge.kind === "return" || edge.route === "skip-to-end") return false;
      const sourceOrder = Number(edge.sourceOrder ?? 0);
      const targetOrder = Number(edge.targetOrder ?? sourceOrder + 1);
      return Math.abs(targetOrder - sourceOrder) > 1;
    }

    function graphNodeAnchor(position, nodeId, side, offset = 0) {
      const halfWidth = legacyNodeHalfWidth(nodeId);
      const halfHeight = legacyNodeHalfHeight(nodeId);
      const safeHorizontalOffset = clampNumber(offset, -halfWidth + 22, halfWidth - 22);
      const safeVerticalOffset = clampNumber(offset, -halfHeight + 14, halfHeight - 14);
      if (side === "top") return { x: position.x + safeHorizontalOffset, y: position.y - halfHeight };
      if (side === "bottom") return { x: position.x + safeHorizontalOffset, y: position.y + halfHeight };
      if (side === "left") return { x: position.x - halfWidth, y: position.y + safeVerticalOffset };
      if (side === "right") return { x: position.x + halfWidth, y: position.y + safeVerticalOffset };
      return { x: position.x, y: position.y };
    }

    function clampNumber(value, min, max) {
      return Math.min(max, Math.max(min, Number(value) || 0));
    }

    function graphParallelOffset(edge) {
      return clampNumber((edge.parallelSlot || 0) * 24, -48, 48);
    }

    function graphAdjacentReverseOffset(edge) {
      const sourceOrder = Number(edge.sourceOrder ?? 0);
      const targetOrder = Number(edge.targetOrder ?? sourceOrder);
      if (!edge.hasReverse || Math.abs(targetOrder - sourceOrder) !== 1) return 0;
      return targetOrder > sourceOrder ? -34 : 34;
    }

    function graphReturnSourceOffset(edge) {
      return clampNumber((edge.returnSourceSlot || 0) * 18, -22, 22);
    }

    function graphReturnTargetOffset(edge) {
      return clampNumber((edge.returnTargetSlot || 0) * 16, -20, 20);
    }

    function graphRightRailSourceOffset(edge) {
      return clampNumber((edge.parallelSlot || 0) * 18, -22, 22);
    }

    function graphRightRailTargetOffset(edge) {
      return clampNumber((edge.parallelSlot || 0) * 16, -20, 20);
    }

    function graphLogicFlowEdgeText(edge, source, target, index) {
      if (!edge.label) return "";
      const point = legacyGraphEdgeLabelPoint(edge, source, target, index);
      return {
        value: edge.label,
        x: point.x,
        y: point.y,
      };
    }

    function legacyGraphEdgeLabelPoint(edge, source, target, index) {
      if (edge.source === edge.target) {
        return { x: source.x + 190, y: source.y + 30, anchor: "start" };
      }
      const points = graphEdgePoints(edge, source, target, index);
      if (edge.kind === "return") {
        if (points.length >= 2) {
          return {
            x: Math.min(points[0].x, points[1].x) + Math.abs(points[0].x - points[1].x) / 2,
            y: points[0].y - 12,
            anchor: "middle",
          };
        }
        const railX = returnRailX(edge, source, target);
        return { x: railX - 14, y: Math.max(52, (source.y + target.y) / 2), anchor: "end" };
      }
      if (edge.route === "skip-to-end") {
        if (points.length >= 2) {
          return { x: (points[0].x + points[1].x) / 2, y: points[0].y - 12, anchor: "middle" };
        }
        const railX = skipEndRailX(edge, source, target);
        return { x: railX + 14, y: Math.max(source.y + 42, (source.y + target.y) / 2), anchor: "start" };
      }
      if (isNonAdjacentVerticalEdge(edge, source, target)) {
        const railX = branchRailX(edge, source, target);
        const anchor = railX >= source.x ? "start" : "end";
        const offset = railX >= source.x ? 14 : -14;
        if (points.length >= 2) return { x: (points[0].x + points[1].x) / 2, y: points[0].y - 12, anchor: "middle" };
        return { x: railX + offset, y: target.y - legacyNodeHalfHeight(edge.target) - 12, anchor };
      }
      if (source.x !== target.x) {
        const targetHalfHeight = legacyNodeHalfHeight(edge.target);
        return { x: (source.x + target.x) / 2, y: target.y - targetHalfHeight - 12, anchor: "middle" };
      }
      const verticalOffset = graphAdjacentReverseOffset(edge) || graphParallelOffset(edge);
      return { x: source.x + verticalOffset + 14, y: (source.y + target.y) / 2 - 8, anchor: "start" };
    }

    function legacyNodeHalfWidth(nodeId) {
      return graphNodeWidth(nodeId) / 2;
    }

    function legacyNodeHalfHeight(nodeId) {
      return graphNodeHeight(nodeId) / 2;
    }

    function graphNodeWidth(nodeId) {
      return nodeId === "END" || nodeId === "draft" ? 140 : 260;
    }

    function graphNodeHeight(nodeId) {
      return nodeId === "END" || nodeId === "draft" ? 60 : 64;
    }

    function returnRailX(edge, source, target) {
      return Math.min(source.x, target.x) - 220 - Number(edge.returnLane || 0) * 64;
    }

    function skipEndRailX(edge, source, target) {
      return Math.max(source.x, target.x) + 260 + Number(edge.rightLane || 0) * 64;
    }

    function branchRailX(edge, source, target) {
      return Math.max(source.x, target.x) + 220 + Number(edge.rightLane || 0) * 64;
    }

    function graphLayoutPositions(graph) {
      const positions = {};
      const mainX = 520;
      const rowGap = 126;
      graph.nodes.forEach((node, index) => {
        positions[node.id] = { x: mainX, y: 92 + index * rowGap };
      });
      const maxY = Math.max(...Object.values(positions).map((point) => point.y));
      if (positions.END) positions.END = { x: mainX, y: maxY };
      return positions;
    }

    function graphNodeStyle(kind) {
      if (kind === "start" || kind === "end") return { fill: "#f6ffed", stroke: "#52c41a", strokeWidth: 1.5 };
      if (kind === "draft") return { fill: "#e6f4ff", stroke: "#1677ff", strokeWidth: 1.5, radius: 6 };
      return { fill: "#fff7e6", stroke: "#faad14", strokeWidth: 1.5, radius: 6 };
    }

    function graphEdgeStyle(kind) {
      const stroke = graphEdgeColor(kind);
      if (kind === "return") return { stroke, strokeDasharray: "6 4", strokeWidth: 1.5 };
      return { stroke, strokeWidth: 1.5 };
    }

    function graphEdgeColor(kind) {
      if (kind === "return") return "#cf1322";
      if (kind === "conditional") return "#d48806";
      if (kind === "end") return "#389e0d";
      return "#1677ff";
    }

    function graphEdgeKind(path) {
      const targetId = normalizeDesignerTargetId(path.target_node_id);
      const pathName = String(path.path_name || "");
      if (targetId === "END") return "end";
      if (targetId === "draft" || pathName.includes("退回") || pathName.includes("返回")) return "return";
      if (path.condition) return "conditional";
      return "forward";
    }

    function graphEdgeLabel(path) {
      const condition = String(path.condition || "");
      const pathName = String(path.path_name || "提交");
      if (condition.includes("不同意")) {
        if (pathName.includes("起草")) return "不同意：退回起草";
        if (pathName.includes("退回") || pathName.includes("返回")) return pathName;
        return "不同意";
      }
      if (condition.includes("≤3") || condition.includes("<=3") || condition.includes("<3") || condition.includes("小于")) return "同意 & 请假天数 ≤ 3天";
      if (condition.includes("＞3") || condition.includes(">3") || condition.includes("大于") || condition.includes("超过")) return "同意 & 请假天数 > 3天";
      if (condition.includes("同意")) return "同意";
      if (pathName.includes("流程结束")) return "结束";
      return pathName;
    }

    function isGraphHiddenPath(path, source, target) {
      const pathName = String(path.path_name || "");
      if (source === target) return true;
      if (pathName.includes("返回上一处理人")) return true;
      return false;
    }

    function renderDesignerOverview(session) {
      const process = session.draft_definition;
      const report = session.validation_report || {};
      const fieldCount = process.form_fields?.length || 0;
      const nodeCount = process.flow_nodes?.length || 0;
      const pathCount = (process.flow_nodes || []).reduce((sum, node) => sum + (node.submit_paths || []).length, 0);
      const approvalNodes = (process.flow_nodes || []).filter((node) => !node.is_draft).length;
      return `
        <div class="designer-module-panel">
          <div class="overview-layout">
            <div class="overview-summary-column">
              <div class="module-summary-grid">
                <div class="module-summary-card"><strong>表单字段</strong><em>${fieldCount}</em><span>请假类型、日期、事由、代理人与联系方式。</span></div>
                <div class="module-summary-card"><strong>流程环节</strong><em>${nodeCount}</em><span>起草、主管、部门领导和总经理审批。</span></div>
                <div class="module-summary-card"><strong>提交路径</strong><em>${pathCount}</em><span>同意、退回和 3 天以上升级路径。</span></div>
                <div class="module-summary-card"><strong>人工审批</strong><em>${approvalNodes}</em><span>起草环节不显示同意/不同意。</span></div>
              </div>

              <div class="design-note-grid" aria-label="AI 生成设计要点">
                <div class="design-note-card"><strong>字段权限变化</strong><span>起草人可编辑请假类型、日期、事由、代理人和紧急联系方式；系统字段保持只读。</span></div>
                <div class="design-note-card"><strong>条件审批</strong><span>请假天数 ≤ 3 天时部门领导同意后结束；超过 3 天进入部门总经理审批。</span></div>
                <div class="design-note-card"><strong>退回路径</strong><span>审批环节不同意时退回起草，申请人修改后重新提交。</span></div>
                <div class="design-note-card"><strong>校验结果</strong><span>${escapeHtml(report.summary || "等待校验")}</span></div>
              </div>

              <div class="design-card">
                <div class="design-card-head">
                  <div><strong>检查与待确认</strong><span>来自草稿结构校验，后续可接规则库和组织解析。</span></div>
                  <button class="button" type="button" data-validate-design>重新校验</button>
                </div>
                ${renderIssueList(report)}
              </div>
            </div>

            <div class="design-card flow-card overview-flow-card">
              <div class="design-card-head">
                <div><strong>流程图预览</strong><span>总览展示整体走向；细节通过流程图 tab 查看。</span></div>
                <div class="flow-card-actions">
                  <span class="tag blue">全局预览</span>
                  <button class="button ghost" type="button" data-flow-expand>放大查看</button>
                </div>
              </div>
              <div class="flow-board-viewport overview-flow-viewport" data-flow-pan-viewport aria-label="员工请假申请流程图全局预览">
                ${renderDesignerFlowBoard(process, { overview: true })}
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function renderDesignerFields(process) {
      const fields = [...(process.form_fields || [])].sort((a, b) => (a.seq || 0) - (b.seq || 0));
      return `
        <div class="designer-module-panel">
          <div class="design-card field-config-card full">
            <div class="design-card-head">
              <div><strong>流程字段配置</strong><span>对应标准模型中的 form_fields，展示字段名、组件类型、必填环节、可见环节、可编辑环节和逻辑说明。</span></div>
              <span class="tag neutral">${process.form_fields?.length || 0} 字段</span>
            </div>
            <div class="field-config-list">
              <div class="field-config-table">
                <div class="field-config-row field-config-header">
                  <span>序号</span>
                  <span>字段名</span>
                  <span>组件类型</span>
                  <span>选项/枚举值</span>
                  <span>必填环节</span>
                  <span>可见环节</span>
                  <span>可编辑环节</span>
                  <span>逻辑说明</span>
                </div>
                ${fields.map((field, index) => `
                  <div class="field-config-row">
                    <span>${escapeHtml(field.seq || index + 1)}</span>
                    <span class="field-config-cell-title">${escapeHtml(field.field_name)}</span>
                    <span class="field-type">${escapeHtml(field.component_type)}</span>
                    <span class="field-options">${escapeHtml(formatFieldOptions(field))}</span>
                    <span>${escapeHtml(stageList(field.required_stages, process))}</span>
                    <span>${escapeHtml(stageList(field.visible_stages, process))}</span>
                    <span>${escapeHtml(stageList(field.editable_stages, process))}</span>
                    <span>${escapeHtml(field.logic_description || field.default_value || field.placeholder || "-")}</span>
                  </div>
                `).join("")}
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function formatFieldOptions(field) {
      const options = Array.isArray(field?.options)
        ? field.options.map((item) => String(item || "").trim()).filter(Boolean)
        : [];
      if (!options.length) return "-";
      return options.join(" / ");
    }

    function renderDesignerNodes(process) {
      const nodes = process.flow_nodes || [];
      const pathCount = nodes.reduce((sum, node) => sum + (node.submit_paths || []).length, 0);
      return `
        <div class="designer-module-panel">
          <div class="design-card node-config-card full">
            <div class="design-card-head">
              <div><strong>流程环节与提交路径</strong><span>每个环节内展开查看可提交路径、条件和目标环节。</span></div>
              <span class="tag neutral">${nodes.length} 环节 · ${pathCount} 路径</span>
            </div>
            <div class="node-config-toolbar">
              <button class="button ghost" type="button" data-designer-expand-all-nodes>全部展开</button>
              <button class="button ghost" type="button" data-designer-collapse-all-nodes>全部收起</button>
            </div>
            <div class="node-config-list">
              ${nodes.map((node, index) => renderDesignerNodeCard(process, node, index)).join("")}
            </div>
          </div>
        </div>
      `;
    }

    function renderDesignerNodeCard(process, node, index) {
      const expanded = isDesignerNodeExpanded(node, index);
      const paths = node.submit_paths || [];
      const normalizedNodeId = normalizeDesignerTargetId(node.node_id);
      const highlight = state.designerHighlightedNodeId === normalizedNodeId;
      const hasOpinion = !node.is_draft && Boolean(node.opinion);
      return `
        <div class="node-config-item ${highlight ? "highlight" : ""}" data-designer-node-card="${escapeAttr(normalizedNodeId)}">
          <div class="node-config-top">
            <div>
              <strong>${escapeHtml(node.node_name)}</strong>
              ${node.is_draft ? `<span>起草环节不需要结论性意见，提交后按路径进入审批。</span>` : ""}
            </div>
            <div class="node-config-meta">
              <span class="tag ${node.is_draft ? "green" : "blue"}">${escapeHtml(node.node_id)}</span>
              <button class="button ghost" type="button" data-designer-toggle-node="${escapeAttr(node.node_id)}">${expanded ? "收起路径" : "展开路径"}</button>
            </div>
          </div>
          <div class="node-config-groups">
            ${renderNodeConfigGroup({
              tone: "blue",
              label: "处理人",
              fields: [
                ["来源", handlerSourceLabel(node.handler)],
                ["角色", handlerRoleLabel(node)],
                ["处理方式", handlerModeLabel(node)],
              ],
            })}
            ${renderNodeConfigGroup({
              tone: "neutral",
              label: "审批意见",
              fields: hasOpinion
                ? [
                    ["结论意见", node.opinion.conclusive_required ? "必填" : "非必填"],
                    ["选项", (node.opinion.conclusive_options || []).join(" / ") || "-"],
                    ["意见域", node.opinion_label || "-"],
                  ]
                : null,
              single: hasOpinion ? null : "无结论性意见",
            })}
            ${renderNodeConfigGroup({
              tone: "amber",
              label: "处理期限",
              single: node.time_limit_days ? `${node.time_limit_days} 天` : "未配置",
            })}
          </div>
          <div class="node-config-path-caption">提交路径 · ${escapeHtml(paths.length)} 条</div>
          ${expanded ? renderDesignerNodePaths(process, node) : ""}
        </div>
      `;
    }

    function renderNodeConfigGroup({ tone, label, fields, single }) {
      const body = single
        ? `<div class="node-config-group-single">${escapeHtml(single)}</div>`
        : `<div class="node-config-group-fields">${(fields || []).map(([fieldLabel, value]) => nodeConfigMiniField(fieldLabel, value)).join("")}</div>`;
      return `
        <div class="node-config-group tone-${tone}">
          <div class="node-config-group-head">${escapeHtml(label)}</div>
          ${body}
        </div>
      `;
    }

    function nodeConfigMiniField(label, value) {
      return `<div class="node-config-mini-field"><label>${escapeHtml(label)}</label><strong>${escapeHtml(value || "-")}</strong></div>`;
    }

    function handlerModeLabel(node) {
      if (node.is_draft) return "申请人";
      return node.handler?.mode || "未配置";
    }

    function handlerSourceLabel(handler) {
      if (!handler) return "不指定";
      const source = handler.source || "不指定";
      if (source === "本部门") return "本部门（按申请人所属部门）";
      if (source === "本公司") return "本公司（按申请人所属公司）";
      if (source === "本条线") return "本条线（按申请人所属条线）";
      if (source === "特定部门") return "特定部门";
      if (source === "表单字段指定") return handler.source_field ? `表单字段指定（${handler.source_field}）` : "表单字段指定";
      return source;
    }

    function handlerRoleLabel(node) {
      if (node.is_draft) return "申请人";
      return node.handler?.role || "未配置";
    }

    function renderDesignerNodePaths(process, node) {
      const paths = node.submit_paths || [];
      if (!paths.length) return `<div class="node-path-tree"><div class="assistant-empty">当前环节没有提交路径。</div></div>`;
      return `
        <div class="node-path-tree">
          <div class="node-path-head">
            <span>提交路径</span>
            <span>${paths.length} 条</span>
          </div>
          <div class="node-path-list">
            ${paths.map((path) => renderDesignerPathBranch(process, path)).join("")}
          </div>
        </div>
      `;
    }

    function renderDesignerPathBranch(process, path) {
      const targetId = normalizeDesignerTargetId(path.target_node_id);
      const targetName = pathTargetName(process, path.target_node_id);
      const targetNode = targetId !== "END" ? (process.flow_nodes || []).find((node) => normalizeDesignerTargetId(node.node_id) === targetId) : null;
      const tone = pathTone(path);
      const condition = path.condition || "无条件";
      return `
        <div class="node-path-row">
          <div class="node-path-top">
            <div class="node-path-title">
              <strong>${escapeHtml(path.path_name || "未命名路径")}</strong>
              <span class="tag ${tone}">${escapeHtml(pathTargetTypeLabel(path))}</span>
            </div>
            ${targetNode
              ? `<button class="path-target-button" type="button" data-designer-jump-node="${escapeAttr(targetId)}">目标：${escapeHtml(targetName)}（${escapeHtml(targetId)}）</button>`
              : `<span class="tag ${targetId === "END" ? "green" : "neutral"}">目标：${escapeHtml(targetName)}${targetId ? `（${escapeHtml(targetId)}）` : ""}</span>`}
          </div>
          <div class="node-path-condition">条件：${escapeHtml(condition)}</div>
        </div>
      `;
    }

    function isDesignerNodeExpanded(node, index) {
      const nodeId = String(node.node_id || "");
      if (Object.prototype.hasOwnProperty.call(state.designerExpandedNodes, nodeId)) {
        return Boolean(state.designerExpandedNodes[nodeId]);
      }
      return index === 0;
    }

    function pathTone(path) {
      const targetId = normalizeDesignerTargetId(path.target_node_id);
      const pathName = String(path.path_name || "");
      if (targetId === "END") return "green";
      if (targetId === "draft" || pathName.includes("退回") || pathName.includes("返回")) return "red";
      if (path.condition) return "amber";
      return "blue";
    }

    function pathTargetTypeLabel(path) {
      const targetId = normalizeDesignerTargetId(path.target_node_id);
      const pathName = String(path.path_name || "");
      if (targetId === "END") return "结束";
      if (targetId === "draft" || pathName.includes("退回") || pathName.includes("返回")) return "退回";
      if (path.condition) return "条件分支";
      return "送审";
    }

    function renderDesignerFlow(process) {
      return `
        <div class="designer-module-panel module-fill">
          <div class="design-card flow-card full">
            <div class="design-card-head">
              <div><strong>LogicFlow 流程图</strong><span>由流程定义转换生成，展示环节、条件分支、退回和结束路径。</span></div>
              <div class="flow-card-actions"><span class="tag blue">只读预览</span><button class="button ghost" type="button" data-flow-expand>放大查看</button></div>
            </div>
            <div class="flow-board-viewport" data-flow-pan-viewport>
              ${renderDesignerFlowBoard(process)}
            </div>
          </div>
        </div>
      `;
    }

    function renderDesignerAttachments(process) {
      const attachments = process.attachments || [];
      return `
        <div class="designer-module-panel">
          <div class="design-card">
            <div class="design-card-head">
              <div><strong>附件材料配置</strong><span>展示各类附件的可上传环节与是否必传；未配置必传时表示该附件为选传。</span></div>
              <span class="tag neutral">${attachments.length} 类附件</span>
            </div>
            ${attachments.length ? `
              <div class="attachment-list">
                ${attachments.map((item) => {
                  const requiredByStage = (item.required_stages || []).length > 0;
                  const hasCondition = Boolean(item.required_condition);
                  const uploadText = stageList(item.upload_stages, process, false);
                  const requiredText = requiredByStage ? stageList(item.required_stages, process, false) : "无（非必传）";
                  const badgeLabel = hasCondition ? "条件必传" : requiredByStage ? "必传" : "选传";
                  const badgeClass = hasCondition ? "blue" : requiredByStage ? "amber" : "neutral";
                  return `
                    <div class="attachment-card">
                      <div class="attachment-card-head">
                        <strong>${escapeHtml(item.attachment_type)}</strong>
                        <span class="tag ${badgeClass}">${badgeLabel}</span>
                      </div>
                      <dl class="attachment-props">
                        <div><dt>可上传环节</dt><dd>${escapeHtml(uploadText)}</dd></div>
                        <div><dt>必传环节</dt><dd>${escapeHtml(requiredText)}</dd></div>
                        ${hasCondition ? `<div><dt>必传条件</dt><dd>${escapeHtml(item.required_condition)}</dd></div>` : ""}
                      </dl>
                    </div>
                  `;
                }).join("")}
              </div>
            ` : `<div class="assistant-empty">暂无附件配置。可在后续 source 中补充病假证明、婚假证明、调休依据等材料规则。</div>`}
          </div>
        </div>
      `;
    }

    function renderDesignerRoles(process) {
      const roles = process.roles || [];
      return `
        <div class="designer-module-panel">
          <div class="design-card">
            <div class="design-card-head">
              <div><strong>流程自定义角色</strong><span>这里只维护流程专属角色和固定成员；部门主管、一级主/辅负责人等通用组织角色已放在流程环节的处理人配置中。</span></div>
              <span class="tag neutral">${roles.length} 个自定义角色</span>
            </div>
            ${roles.length ? `
              <div class="config-list">
                ${roles.map((role) => `<div class="config-item"><div class="config-item-top"><strong>${escapeHtml(role.role_name)}</strong><span class="tag neutral">${escapeHtml(role.role_type)}</span></div><span>成员：${escapeHtml((role.members || []).join("、") || "未挂接")}</span>${role.department ? `<span>所属部门：${escapeHtml(role.department)}</span>` : ""}</div>`).join("")}
              </div>
            ` : `<div class="assistant-empty">暂无流程自定义角色。当前流程的审批人均通过各流程环节中的处理人来源和处理角色动态解析。</div>`}
          </div>
        </div>
      `;
    }

    function renderDesignerVersion(session) {
      return `
        <div class="designer-module-panel">
          <div class="design-card">
            <div class="design-card-head">
              <div><strong>版本发布配置</strong><span>本 Slice 只展示草稿，不提交发布，也不影响运行时发布版本。</span></div>
              <span class="tag blue">${escapeHtml(session.session.draft_version)}</span>
            </div>
            <div class="config-list">
              <div class="config-item"><div class="config-item-top"><strong>当前发布版本</strong><span class="tag green">${escapeHtml(session.session.base_version)}</span></div><span>已发起实例继续绑定当前发布版本，不受设计草稿影响。</span></div>
              <div class="config-item"><div class="config-item-top"><strong>设计草稿</strong><span class="tag blue">${escapeHtml(session.session.draft_version)}</span></div><span>由 AI 设计页维护，等待 owner 确认字段、环节、路径和角色。</span></div>
              <div class="config-item"><div class="config-item-top"><strong>发布检查</strong><span class="tag amber">${escapeHtml(session.validation_report?.status || "待校验")}</span></div>${renderIssueList(session.validation_report)}</div>
              <div class="config-item"><div class="config-item-top"><strong>发布申请</strong><span class="tag amber">未开放</span></div><span>后续 Slice 接入发布审批，通过后才生成新的运行版本。</span><div class="owner-card-actions"><button class="button" type="button" data-validate-design>重新校验</button><button class="button primary" type="button" data-disabled-publish>提交发布申请</button></div></div>
            </div>
          </div>
        </div>
      `;
    }

    function renderDesignerChat(session) {
      const isLocalCreateWorkspace = !session && state.designerView === "workspace" && state.designerMode === "create";
      const messages = session ? designMessagesFromSession(session) : (state.localDesignMessages || []);
      const availableSources = session ? (session.sources || []) : (state.pendingDesignSources || []);
      const sourceCount = availableSources.length;
      return `
        <aside class="designer-chat-panel" aria-label="AI 设计助手">
          <div class="designer-chat-shell">
            <div class="designer-chat-head">
              <span class="designer-chat-avatar" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 3l1.8 4.8L18.5 10l-4.7 2.2L12 17l-1.8-4.8L5.5 10l4.7-2.2L12 3z"/></svg>
              </span>
              <div class="designer-chat-title"><strong>AI 设计助手</strong><span>围绕 source、字段、规则和流程图持续迭代。</span></div>
              <button class="source-entry-button" type="button" data-open-source-modal aria-label="管理 Source">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M12 5v14M5 12h14"/><path d="M4 19.5V6.8A2.8 2.8 0 0 1 6.8 4h10.4A2.8 2.8 0 0 1 20 6.8v12.7"/></svg>
                Sources <span>${escapeHtml(sourceCount)}</span>
              </button>
            </div>
            <div class="designer-chat-body">
              ${session ? messages.map((message, index) => renderDesignerMessage(message, session, index === messages.length - 1)).join("") + (state.designerThinking ? renderDesignerThinkingBubble() : "") : isLocalCreateWorkspace ? `
                <div class="designer-message assistant">
                  <span class="designer-message-avatar assistant" aria-hidden="true">AI</span>
                  <div class="designer-bubble assistant">已进入新流程设计工作台。你可以继续上传 source，或直接描述流程目标、表单字段和审批规则。</div>
                </div>
                <div class="designer-message assistant">
                  <span class="designer-message-avatar assistant" aria-hidden="true">AI</span>
                  <div class="thought-chain">
                    <div class="thought-step"><span>设计对象</span><strong>${escapeHtml(state.newDraftName || "未命名流程")}</strong></div>
                    <div class="thought-step"><span>流程类型</span><strong>${escapeHtml(state.newDraftType === "agentic" ? "Agentic workflow" : "审批流程")}</strong></div>
                    <div class="thought-step"><span>Source</span><strong>${escapeHtml(sourceCount)} 个材料</strong></div>
                  </div>
                </div>
              ` : `
                <div class="designer-message assistant">
                  <span class="designer-message-avatar assistant" aria-hidden="true">AI</span>
                  <div class="designer-bubble assistant">请选择一种开始方式：新建流程会先选择流程类型；修改已有流程会从你管理的流程里选择版本并生成修订草稿。</div>
                </div>
                <div class="designer-message assistant">
                  <span class="designer-message-avatar assistant" aria-hidden="true">AI</span>
                  <div class="thought-chain">
                    <div class="thought-step"><span>设计状态</span><strong>未开始</strong></div>
                    <div class="thought-step"><span>Source</span><strong>未接入</strong></div>
                    <div class="thought-step"><span>草稿</span><strong>未生成</strong></div>
                  </div>
                </div>
              `}
            </div>
            ${(() => {
              const hasPendingEdit = Boolean(session?.session?.has_pending_edit);
              const inputDisabled = state.designerThinking || hasPendingEdit;
              const placeholder = state.designerThinking
                ? "AI 正在处理上一条指令…"
                : hasPendingEdit
                  ? "请先确认或放弃上面待处理的修改建议…"
                  : session
                    ? "例如：给每个审批环节设置次日 18:00 前处理，或补充病假证明附件要求"
                    : isLocalCreateWorkspace
                      ? "描述流程目标、字段、审批角色或提交路径"
                      : "请先描述要新建的流程，或选择已有流程后继续对话";
              return `
            <div class="designer-sender">
              <textarea data-designer-query placeholder="${placeholder}" ${inputDisabled ? "disabled" : ""}></textarea>
              <div class="designer-sender-actions">
                <button class="designer-upload-button" type="button" data-open-source-modal aria-label="上传 Source" ${inputDisabled ? "disabled" : ""}>
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
                </button>
                <button class="designer-send-button" type="button" data-send-designer-message aria-label="发送设计指令" ${inputDisabled ? "disabled" : ""}>
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="m22 2-7 20-4-9-9-4 20-7z"/><path d="M22 2 11 13"/></svg>
                </button>
              </div>
            </div>`;
            })()}
          </div>
        </aside>
      `;
    }

    function designMessagesFromSession(session) {
      const messages = (session?.messages || []).filter((message) => {
        return !(message.role === "user" && message.payload?.event === "initialization_instruction");
      });
      const localFollowups = (state.localDesignerFollowups || []).filter((message) => {
        return message.session_id === session?.session?.session_id;
      });
      if (messages.length) return [...messages, ...localFollowups];
      const assistantMessage = session?.generation_report?.langgraph?.designer_assistant_message;
      if (assistantMessage) {
        return [{
          role: "assistant",
          content: assistantMessage.content || "",
          payload: { assistant_message: assistantMessage },
          created_at: session?.session?.updated_at || ""
        }, ...localFollowups];
      }
      return localFollowups;
    }

    function renderDesignerThinkingBubble() {
      return `
        <div class="designer-message assistant">
          <span class="designer-message-avatar assistant">AI</span>
          <div class="designer-bubble assistant designer-thinking-bubble">
            <span>AI 正在思考</span>
            <span class="designer-thinking-dots"><span></span><span></span><span></span></span>
          </div>
        </div>
      `;
    }

    function renderDesignerMessage(message, session, isLast = false) {
      if (message.role === "user") {
        return `
          <div class="designer-message user">
            <div class="designer-bubble user">${escapeHtml(message.content)}</div>
            <span class="designer-message-avatar user">${escapeHtml(state.user.name.slice(0, 1))}</span>
          </div>
        `;
      }
      if (["edit_applied", "edit_no_change", "edit_undone", "edit_pending_confirmation", "edit_pending_resolved"].includes(message.payload?.event)) {
        return renderDesignerEditMessage(message, session, isLast);
      }
      const isLocalFollowup = message.payload?.event === "clarification_answers_recorded"
        || (message.role === "assistant" && message.content && !message.payload?.assistant_message && message.payload?.event === "message");
      const fallbackAssistantMessage = session?.generation_report?.langgraph?.designer_assistant_message || {};
      const assistantMessage = isLocalFollowup ? {} : (message.payload?.assistant_message || fallbackAssistantMessage || {});
      const bullets = isLocalFollowup ? [] : (assistantMessage.summary_bullets || fallbackAssistantMessage.summary_bullets || []);
      const allCards = isLocalFollowup ? [] : designerClarificationCards(assistantMessage, message, session);
      const sessionId = session?.session?.session_id || "";
      const cards = sessionClarificationsCompleted(session) ? [] : allCards;
      const displayContent = isLocalFollowup ? (message.content || "") : designerAssistantContent(assistantMessage, message, session, cards);
      return `
        <div class="designer-message assistant">
          <span class="designer-message-avatar assistant">AI</span>
          <div class="designer-message-stack">
            <div class="designer-bubble assistant">${escapeHtml(displayContent)}</div>
            ${renderDesignerSummaryBullets(bullets)}
            ${renderDesignerClarificationCard(cards)}
          </div>
        </div>
      `;
    }

    // 对话式修改（Phase 2/3）：编辑回合的消息独立渲染，不复用初始化消息的
    // assistant_message/clarification_cards 回退逻辑，避免显示过时的初始化内容。
    function renderDesignerEditMessage(message, session, isLast) {
      const payload = message.payload || {};
      const errors = payload.errors || [];
      const diffCard = renderDesignerEditDiffCard(payload.diff);
      const complianceCard = renderDesignerComplianceCard(payload.compliance_findings);
      const sessionId = session?.session?.session_id || "";
      const isPendingConfirmation = payload.event === "edit_pending_confirmation";
      const stillPending = isPendingConfirmation && isLast && payload.requires_confirmation
        && Boolean(session?.session?.has_pending_edit);
      const canUndo = !isPendingConfirmation && isLast && Boolean(session?.session?.can_undo);
      const actions = stillPending
        ? `
          <div class="pending-edit-actions">
            <button class="button primary" type="button" data-confirm-pending-edit="${escapeAttr(sessionId)}">确认应用</button>
            <button class="button ghost" type="button" data-discard-pending-edit="${escapeAttr(sessionId)}">放弃修改</button>
          </div>`
        : canUndo
          ? `<button class="button ghost" type="button" data-undo-design-edit="${escapeAttr(sessionId)}">撤销本次修改</button>`
          : "";
      return `
        <div class="designer-message assistant">
          <span class="designer-message-avatar assistant">AI</span>
          <div class="designer-message-stack">
            <div class="designer-bubble assistant">${escapeHtml(message.content || "").replace(/\n/g, "<br/>")}</div>
            ${errors.length ? `<div class="edit-error-banner">${errors.map((error) => `<div>${escapeHtml(error)}</div>`).join("")}</div>` : ""}
            ${diffCard}
            ${complianceCard}
            ${actions}
          </div>
        </div>
      `;
    }

    function renderDesignerComplianceCard(findings) {
      if (!findings || !findings.length) return "";
      const highCount = findings.filter((f) => f.severity === "high").length;
      const rows = findings.map((f) => `
        <div class="compliance-warn-item">
          <div class="compliance-warn-top"><span class="tag ${f.severity === "high" ? "red" : "amber"}">${f.severity === "high" ? "高" : "中"}</span><strong>${escapeHtml(f.statement)}</strong></div>
          <div class="compliance-warn-detail">${escapeHtml(f.detail)}</div>
          <div class="compliance-warn-src">出处：${escapeHtml(f.source_doc)}${f.clause ? " · " + escapeHtml(f.clause) : ""}（${escapeHtml(f.rule_id)}）</div>
        </div>`).join("");
      return `
        <div class="compliance-warn-card">
          <div class="compliance-warn-head">⚠️ 合规风险（${findings.length}${highCount ? ` · ${highCount} 高` : ""}）</div>
          ${rows}
        </div>`;
    }

    function renderDesignerEditDiffCard(diff) {
      if (!diff || !diff.has_changes) return "";
      const lines = [];
      (diff.meta || []).forEach((change) => {
        lines.push(`流程信息 ${escapeHtml(change.attribute)}：${escapeHtml(formatDiffValue(change.before))} → ${escapeHtml(formatDiffValue(change.after))}`);
      });
      appendDesignerDiffSection(lines, "字段", diff.form_fields);
      appendDesignerDiffSection(lines, "环节", diff.flow_nodes, { nestedKey: "submit_paths", nestedLabel: "路径" });
      appendDesignerDiffSection(lines, "附件", diff.attachments);
      appendDesignerDiffSection(lines, "角色", diff.roles);
      if (!lines.length) return "";
      return `
        <div class="edit-diff-card">
          <div class="edit-diff-card-title">本次变更</div>
          <ul class="edit-diff-list">${lines.map((line) => `<li>${line}</li>`).join("")}</ul>
        </div>
      `;
    }

    function appendDesignerDiffSection(lines, label, section, options = {}) {
      if (!section) return;
      (section.added || []).forEach((name) => lines.push(`新增${label}"${escapeHtml(name)}"`));
      (section.removed || []).forEach((name) => lines.push(`删除${label}"${escapeHtml(name)}"`));
      (section.changed || []).forEach((item) => {
        (item.changes || []).forEach((change) => {
          lines.push(`更新${label}"${escapeHtml(item.key)}" ${escapeHtml(change.attribute)}：${escapeHtml(formatDiffValue(change.before))} → ${escapeHtml(formatDiffValue(change.after))}`);
        });
        const nested = options.nestedKey ? item[options.nestedKey] : null;
        if (nested) {
          (nested.added || []).forEach((name) => lines.push(`${label}"${escapeHtml(item.key)}"新增${options.nestedLabel}"${escapeHtml(name)}"`));
          (nested.removed || []).forEach((name) => lines.push(`${label}"${escapeHtml(item.key)}"删除${options.nestedLabel}"${escapeHtml(name)}"`));
          (nested.changed || []).forEach((pathItem) => {
            (pathItem.changes || []).forEach((change) => {
              lines.push(`${label}"${escapeHtml(item.key)}"${options.nestedLabel}"${escapeHtml(pathItem.key)}" ${escapeHtml(change.attribute)}：${escapeHtml(formatDiffValue(change.before))} → ${escapeHtml(formatDiffValue(change.after))}`);
            });
          });
        }
      });
    }

    function formatDiffValue(value) {
      if (value === null || value === undefined) return "—";
      if (Array.isArray(value)) return value.length ? value.join("、") : "（空）";
      if (typeof value === "object") return JSON.stringify(value);
      return String(value);
    }

    function designerClarificationCards(assistantMessage, message, session) {
      const candidates = [
        assistantMessage.clarification_cards,
        message.payload?.clarification_cards,
        session?.generation_report?.langgraph?.user_clarification_requests,
      ];
      for (const item of candidates) {
        if (Array.isArray(item) && item.length) return item.map(normalizeDesignerClarificationCard);
      }
      const legacyClarifications = session?.generation_report?.clarifications || [];
      if (legacyClarifications.length && !legacyClarifications[0].includes("已补齐")) {
        return legacyClarifications.map((item, index) => normalizeDesignerClarificationCard(item, index));
      }
      const validationIssues = session?.validation_report?.issues || [];
      return validationIssues.map((issue, index) => normalizeDesignerClarificationCard({
        id: `validation_issue_${index + 1}`,
        question: issue.message || issue.node_name || "待确认事项",
        recommendation: "建议先补充业务口径或 source 依据。",
        severity: issue.severity || "warning",
        options: [],
        free_text_allowed: true,
      }, index));
    }

    function sessionClarificationsCompleted(session) {
      const sessionId = session?.session?.session_id || "";
      if (sessionId && state.completedClarificationSessions?.[sessionId]) return true;
      return (session?.messages || []).some((message) => {
        return message.role === "assistant"
          && String(message.content || "").includes("已记录")
          && String(message.content || "").includes("待确认项");
      });
    }

    function normalizeDesignerClarificationCard(card, index = 0) {
      if (typeof card === "string") return clarificationCardFromText(card, index);
      const normalized = { ...(card || {}) };
      const question = designerClarificationQuestion(normalized);
      const recommendation = designerClarificationRecommendation(normalized);
      return {
        ...normalized,
        id: normalized.id || `clarification_${index + 1}`,
        question,
        recommendation,
        severity: normalized.severity || "warning",
        options: designerClarificationOptions(normalized, recommendation),
        free_text_allowed: normalized.free_text_allowed !== false,
      };
    }

    function clarificationCardFromText(text, index) {
      const raw = String(text || "").trim();
      const suggestionIndex = raw.indexOf("建议");
      let question = raw || "待确认事项目前仍有缺失，请补充。";
      let recommendation = "建议先补充业务口径后再发布。";
      if (suggestionIndex > 0) {
        const before = raw.slice(0, suggestionIndex).replace(/[，,。；;\s]+$/, "");
        question = designerQuestionFromStatement(before);
        recommendation = raw.slice(suggestionIndex).trim().replace(/[。；;]+$/, "。");
      }
      return normalizeDesignerClarificationCard({
        id: `legacy_clarification_${index + 1}`,
        question,
        recommendation,
        severity: "warning",
        options: [],
        free_text_allowed: true,
      }, index);
    }

    function designerQuestionFromStatement(text) {
      const clean = String(text || "").trim();
      if (!clean) return "待确认事项目前仍有缺失，请补充。";
      if (clean.startsWith("请确认")) return clean.endsWith("。") ? clean : `${clean}。`;
      if (clean.includes("缺失") || clean.includes("缺少") || clean.includes("不明确")) {
        return `${clean}，请补充。`;
      }
      return `${clean}，请确认。`;
    }

    function designerClarificationQuestion(card) {
      const text = String(card.question || card.item || "待确认事项").trim();
      const item = String(card.item || "").trim();
      const issueType = String(card.issue_type || "");
      if (issueType.includes("time_limit") || item.includes("处理期限") || text.includes("处理期限")) {
        return "处理期限目前仍有缺失，请补充。";
      }
      if (issueType.includes("attachment") || item.includes("附件") || text.includes("附件")) {
        return "附件材料要求目前仍有缺失，请补充。";
      }
      if (item.includes("代理人") || text.includes("代理人")) {
        return "代理人字段是否必填目前仍不明确，请补充。";
      }
      if (text.endsWith("。") || text.endsWith("？") || text.endsWith("?")) return text;
      return `${text}。`;
    }

    function designerClarificationRecommendation(card) {
      const recommendation = String(card.recommendation || "").trim();
      if (recommendation) return recommendation.endsWith("。") ? recommendation : `${recommendation}。`;
      const reason = String(card.reason || "").trim();
      const item = String(card.item || "").trim();
      const question = String(card.question || "").trim();
      if (item.includes("处理期限") || question.includes("处理期限")) return "建议为审批环节配置 SLA。";
      if (item.includes("附件") || question.includes("附件")) return "建议第一版将附件设为非必填，后续按制度补充。";
      if (item.includes("代理人") || question.includes("代理人")) return "建议先将代理人设为可选字段。";
      if (reason.startsWith("建议")) return reason.endsWith("。") ? reason : `${reason}。`;
      return "建议先按当前草稿默认口径处理。";
    }

    function designerClarificationOptions(card, recommendation) {
      const rawOptions = (card.options || []).map(normalizeClarificationOption);
      const options = [];
      const seenKeys = new Set();
      const addOption = (label, value = label) => {
        const cleanLabel = String(label || "").trim();
        const cleanValue = String(value || cleanLabel).trim();
        if (!cleanLabel) return;
        const key = clarificationOptionKey(cleanLabel);
        if (seenKeys.has(key)) return;
        seenKeys.add(key);
        options.push({ label: cleanLabel, value: cleanValue });
      };
      const usableRawOptions = rawOptions
        .filter((option) => !isManualClarificationOption(option.label))
        .filter((option) => !isSkipClarificationOption(option.label))
        .filter((option) => !isGenericClarificationOption(option.label));
      usableRawOptions.forEach((option) => addOption(option.label, option.value));
      if (!options.length) addOption(recommendation);
      addOption("暂不处理");
      return options.slice(0, 3);
    }

    function isManualClarificationOption(label) {
      return /手动|自行|自定义/.test(String(label || ""));
    }

    function isSkipClarificationOption(label) {
      return /暂不|不处理|不配置/.test(String(label || ""));
    }

    function isGenericClarificationOption(label) {
      return /按建议处理|按常规配置/.test(String(label || ""));
    }

    function clarificationOptionKey(label) {
      let text = String(label || "").toLowerCase();
      text = text.replace(/\s+/g, "");
      text = text.replace(/[，,。；;：:、（）()「」『』【】\[\]"'“”‘’]/g, "");
      text = text
        .replace(/source中/g, "")
        .replace(/源材料中/g, "")
        .replace(/根据source/g, "")
        .replace(/候选流程/g, "")
        .replace(/建议/g, "")
        .replace(/请确认/g, "")
        .replace(/需业务方最终拍板/g, "业务确认")
        .replace(/需要业务方最终拍板/g, "业务确认")
        .replace(/待业务确认/g, "业务确认")
        .replace(/待确认/g, "业务确认");
      if (text.includes("3天") && text.includes("总经理") && (text.includes("业务确认") || text.includes("暂用"))) {
        return "leave_gt_3_dept_gm_confirm";
      }
      if (text.includes("5天") && text.includes("总经理") && (text.includes("业务确认") || text.includes("暂用"))) {
        return "leave_gt_5_dept_gm_confirm";
      }
      if ((text.includes("sla") || text.includes("处理期限") || text.includes("期限")) && (text.includes("审批") || text.includes("环节"))) {
        return "approval_sla";
      }
      return text;
    }

    function designerAssistantContent(assistantMessage, message, session, cards) {
      const isInitialization = assistantMessage.message_type === "initialization_result"
        || message.payload?.event === "draft_initialized";
      if (!isInitialization) return assistantMessage.content || message.content || "已生成流程草稿。";
      const process = session?.draft_definition || {};
      const processName = process.meta?.process_name || session?.workflow?.name || "流程";
      const sourceCount = session?.sources?.length || session?.generation_report?.langgraph?.workflow_design_output?.design_summary?.source_count || 0;
      const fieldCount = process.form_fields?.length ?? session?.generation_report?.langgraph?.workflow_design_output?.design_summary?.field_count ?? 0;
      const nodeCount = process.flow_nodes?.length ?? session?.generation_report?.langgraph?.workflow_design_output?.design_summary?.node_count ?? 0;
      const pathCount = (process.flow_nodes || []).reduce((total, node) => total + (node.submit_paths || []).length, 0)
        || session?.generation_report?.langgraph?.workflow_design_output?.design_summary?.path_count
        || 0;
      const lines = [
        `已基于 ${sourceCount} 个 source 生成${processName}草稿。`,
        "",
        "当前草稿包含：",
        `- ${fieldCount} 个表单字段`,
        `- ${nodeCount} 个流程环节`,
        `- ${pathCount} 条提交路径`,
      ];
      if (cards && cards.length) {
        lines.push("", `我还发现 ${cards.length} 个需要确认的事项：`);
        cards.forEach((card, index) => {
          lines.push(`${index + 1}. ${card.question || card.item || "待确认事项"}`);
        });
        lines.push("", "建议先处理第 1 个。");
      }
      return lines.join("\n");
    }

    function renderDesignerSummaryBullets(bullets) {
      if (!bullets || !bullets.length) return "";
      return `
        <div class="designer-summary-list" aria-label="AI 读取结果摘要">
          ${bullets.map((item) => `<div class="designer-summary-line">${escapeHtml(item)}</div>`).join("")}
        </div>
      `;
    }

    function renderDesignerClarificationCard(cards) {
      if (!cards || !cards.length) return "";
      const activeIndex = Math.min(Math.max(state.activeClarificationIndex || 0, 0), cards.length - 1);
      const card = cards[activeIndex];
      const options = (card.options || []).map(normalizeClarificationOption);
      const question = card.question || card.item || "待确认事项";
      const recommendation = card.recommendation || card.reason || "";
      const cardId = String(card.id || "clarification_1");
      const manualOpen = state.activeClarificationManualId === cardId;
      const selectedAnswer = state.clarificationDraftAnswers?.[cardId] || null;
      const selectedReply = selectedAnswer?.reply || "";
      const selectedOption = options.find((option) => `待确认项「${question}」选择：${option.value}` === selectedReply);
      const isLast = activeIndex === cards.length - 1;
      return `
        <section class="designer-clarification-card" aria-label="当前待确认项" data-designer-clarification-card tabindex="0">
          <div class="designer-clarification-head">
            <strong>问题：${escapeHtml(question)}</strong>
            <div class="designer-clarification-pager">
              <button type="button" data-clarification-prev ${activeIndex === 0 ? "disabled" : ""} aria-label="上一条待确认项">‹</button>
              <span class="tag ${card.severity === "blocking" ? "red" : "amber"}">${escapeHtml(activeIndex + 1)} / ${escapeHtml(cards.length)}</span>
              <button type="button" data-clarification-next ${isLast ? "disabled" : ""} aria-label="下一条待确认项">›</button>
            </div>
          </div>
          ${recommendation ? `<p>请选择处理方式，或在下方手动输入业务口径。</p>` : ""}
          ${options.length || card.free_text_allowed ? `
            <div class="designer-clarification-options">
              ${options.map((option, index) => {
                const reply = `待确认项「${question}」选择：${option.value}`;
                return `
                  <button class="designer-clarification-option ${selectedReply === reply ? "selected" : ""}" type="button" data-clarification-card-id="${escapeAttr(cardId)}" data-clarification-question="${escapeAttr(question)}" data-clarification-label="${escapeAttr(option.label)}" data-clarification-option="${escapeAttr(reply)}">
                    <span class="designer-clarification-number">${escapeHtml(index + 1)}</span>
                    <span>${escapeHtml(option.label)}</span>
                  </button>
                `;
              }).join("")}
              ${card.free_text_allowed ? `
                <button class="designer-clarification-option" type="button" data-clarification-manual="${escapeAttr(cardId)}">
                  <span class="designer-clarification-number">${escapeHtml(options.length + 1)}</span>
                  <span>手动输入</span>
                </button>
              ` : ""}
            </div>
          ` : ""}
          ${selectedReply ? `
            <div class="designer-clarification-confirm-actions">
              <span>已选择：${escapeHtml(selectedOption?.label || selectedAnswer?.label || "一个处理方式")}，按 Enter 或点击确定${isLast ? "完成确认" : "进入下一题"}。</span>
              <button class="button" type="button" data-cancel-clarification-option>取消</button>
              <button class="button primary" type="button" data-confirm-clarification-option>${isLast ? "确定" : "确定，下一项"}</button>
            </div>
          ` : ""}
          ${manualOpen ? `
            <div class="designer-clarification-manual">
              <label for="clarification-manual-input">手动输入业务口径</label>
              <textarea id="clarification-manual-input" data-clarification-manual-input placeholder="例如：部门主管和部门领导审批均配置 1 个工作日处理期限。">${escapeHtml(state.clarificationManualText)}</textarea>
              <div class="designer-clarification-manual-actions">
                <button class="button" type="button" data-cancel-clarification-manual>取消</button>
                <button class="button primary" type="button" data-submit-clarification-manual="${escapeAttr(cardId)}" data-clarification-question="${escapeAttr(question)}">提交</button>
              </div>
            </div>
          ` : ""}
          ${card.source_hint ? `<div class="designer-source-hint">依据：${escapeHtml(card.source_hint)}</div>` : ""}
        </section>
      `;
    }

    function normalizeClarificationOption(option) {
      if (option && typeof option === "object") {
        const label = option.label || option.value || "选项";
        return { label: String(label), value: String(option.value || label) };
      }
      return { label: String(option), value: String(option) };
    }

    function renderSourceModal(session) {
      const hasSession = !!session;
      const sources = hasSession ? (session.sources || []) : (state.pendingDesignSources || []);
      return `
        <section class="source-modal" role="dialog" aria-modal="true" aria-label="Source 管理">
          <div class="source-modal-shell">
            <div class="source-modal-head">
              <div class="source-modal-title"><strong>Source 管理</strong><span>上传或粘贴制度、访谈、邮件和会议材料。</span></div>
              <button class="source-modal-close" type="button" data-close-source-modal aria-label="关闭 Source 管理">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
              </button>
            </div>
            <div class="source-modal-body">
              <div class="source-main-column">
                <section class="source-upload-panel" aria-label="上传 Source">
                  <strong>Add sources</strong>
                  <span>${hasSession ? "上传文件或粘贴文本，材料会进入当前设计草稿的 source 列表。" : "先把文件或文本加入 source 列表；选择流程类型或已有流程后，AI 会在草稿上下文中解析。"}</span>
                  <div class="source-upload-actions">
                    <button class="button primary" type="button" data-trigger-source-file>
                      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M20 16.5v2.7a1.8 1.8 0 0 1-1.8 1.8H5.8A1.8 1.8 0 0 1 4 19.2v-2.7"/></svg>
                      上传 source
                    </button>

    function renderNewProcessTypeModal() {
      const isApproval = state.newDraftType === "approval";

      return `
        <section class="source-modal" role="dialog" aria-modal="true" aria-label="选择新建流程类型">

            <div class="source-modal-head">
              <div class="source-modal-title">

                <span>先选择流程类型，再选择创建方式。确认后进入对应的流程设计页面。</span>
              </div>
              <button class="source-modal-close" type="button" data-close-new-process-modal aria-label="关闭新建流程">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>

                </button>
              </div>
              ${isApproval ? `
                <div class="creation-method-panel" aria-label="审批流程创建方式">
                  <div class="creation-method-head">
                    <div><strong>选择创建方式</strong><span>这一步只是选择进入方式，不占用后续设计工作区。</span></div>
                    <span class="tag blue">审批流程</span>
                  </div>
                  <div class="creation-method-grid">
                    <button class="creation-method-card ${method === "ai" ? "active" : ""}" type="button" data-creation-method="ai">

                      <span>上传 source 或填写说明，调用 LangGraph 生成第一版结构化草稿。</span>
                    </button>
                    <button class="creation-method-card ${method === "blank" ? "active" : ""}" type="button" data-creation-method="blank">
                      <strong>空白草稿</strong>
                      <span>直接进入设计工作台，从对话和手工配置开始。</span>
                    </button>
                    <button class="creation-method-card planned ${method === "template" ? "active" : ""}" type="button" data-creation-method="template">
                      <strong>从模板开始</strong>
                      <span>入口预留，后续接模板库和行业流程模板。</span>
                    </button>
                  </div>
                </div>
              ` : `<div class="type-picker-note">Agentic workflow 入口先保留，后续会使用独立字段、节点和运行模型；当前 Slice 先支持审批流程。</div>`}
              <div class="type-picker-note">Hybrid 不作为顶层类型独立展示。审批流程里可以包含 AI 校验、RAG 检索、外部系统调用等 Agent 节点；纯 Agentic workflow 则作为另一类并行流程模型保留入口。</div>
              <div class="type-picker-actions">
                <button class="button" type="button" data-close-new-process-modal>取消</button>
                <button class="button primary" type="button" data-confirm-new-process>继续</button>
              </div>
            </div>
          </div>

      `;
