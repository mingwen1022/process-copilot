    function renderOwnedProcessModal() {
      const workflows = filteredManagedWorkflows();
      const selectedId = state.selectedWorkflowDefinitionId || workflows[0]?.workflow_definition_id || "";
      const selected = workflows.find((workflow) => workflow.workflow_definition_id === selectedId) || workflows[0] || null;
      return `
        <section class="source-modal owned-process-modal" role="dialog" aria-modal="true" aria-label="选择已有流程">
          <div class="source-modal-shell process-picker-shell">
            <div class="source-modal-head">
              <div class="source-modal-title">
                <strong>选择已有流程</strong>
                <span>仅展示当前账号作为流程 owner / 设计者有权限管理的流程，选择后会基于对应版本生成修订草稿。</span>
              </div>
              <button class="source-modal-close" type="button" data-close-owned-process-modal aria-label="关闭选择已有流程">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
              </button>
            </div>
            <div class="process-picker-body">
              <section class="process-picker-main" aria-label="可修改流程列表">
                <div class="process-picker-toolbar">
                  <input class="input" data-owned-process-search type="search" value="${escapeAttr(state.workflowManageSearch)}" placeholder="搜索我管理的流程、Owner、版本或关键词" />
                  <span class="tag neutral">${workflows.length} 个可修改流程</span>
                </div>
                <div class="process-picker-grid">
                  ${workflows.length ? workflows.map((workflow) => `
                    <button class="owned-process-card ${workflow.workflow_definition_id === selected?.workflow_definition_id ? "active" : ""}" type="button" data-select-owned-process="${escapeAttr(workflow.workflow_definition_id)}">
                      <div class="owned-process-card-top">
                        <strong>${escapeHtml(workflow.name)}</strong>
                        <span class="tag blue">Owner</span>
                      </div>
                      <p>${escapeHtml(workflow.description || "")}</p>
                      <div class="owned-process-meta">
                        <span class="tag neutral">${escapeHtml(workflow.category)}</span>
                        <span class="tag neutral">${escapeHtml(workflow.version)}</span>
                      </div>
                      <span>Owner：${escapeHtml(workflow.owner_dept_name || "应用研发组")} / 草稿：${escapeHtml(workflow.management?.draft_state || "暂无草稿")}</span>
                    </button>
                  `).join("") : `<div class="assistant-empty">没有匹配到你名下可修改的流程。</div>`}
                </div>
              </section>
              <aside class="process-picker-detail" aria-label="流程版本详情">
                ${selected ? `
                  <div class="process-picker-detail-title">
                    <strong>${escapeHtml(selected.name)}</strong>
                    <span>${escapeHtml(selected.version)} / Owner 权限 / ${escapeHtml(selected.management?.publish_state || selected.status)}</span>
                  </div>
                  <div class="owned-process-meta">
                    <span class="tag blue">${escapeHtml(selected.category)}</span>
                    <span class="tag neutral">${escapeHtml(selected.field_count)} 字段</span>
                    <span class="tag neutral">${escapeHtml(selected.node_count)} 环节</span>
                    <span class="tag neutral">${escapeHtml(selected.path_count)} 路径</span>
                  </div>
                  <div class="process-picker-section"><label>适用场景</label><p>${escapeHtml(selected.description || "员工请假申请线上审批。")}</p></div>
                  <div class="process-picker-section"><label>当前版本结构</label><p>起草 → 部门主管审批 → 部门领导审批 → 流程结束；请假天数超过 3 天进入部门总经理审批。</p></div>
                  <div class="process-picker-section"><label>权限说明</label><p>当前账号仅可查看和修改自己名下流程；系统管理员视角才会看到全量流程。</p></div>
                  <div class="process-picker-actions">
                    <button class="button primary" type="button" data-confirm-owned-process="${escapeAttr(selected.workflow_definition_id)}">基于此流程修订</button>
                    <button class="button ghost" type="button" data-owned-explain="${escapeAttr(selected.workflow_definition_id)}">让 AI 解释当前结构</button>
                  </div>
                ` : `<div class="assistant-empty">请选择一个流程。</div>`}
              </aside>
            </div>
          </div>
        </section>
      `;
    }

    function renderFlowModal(process) {
      return `
        <section class="flow-modal" role="dialog" aria-label="放大编辑流程图">
          <div class="flow-modal-shell">
            <div class="flow-modal-head">
              <div>
                <strong>${escapeHtml(process.meta?.process_name || "员工请假申请")} / LogicFlow 流程图</strong>
                <span>当前为只读图形预览，后续开放图上编辑后会反写流程草稿并重新校验。</span>
              </div>
              <button class="button ghost" type="button" data-close-flow-modal>关闭</button>
            </div>
            <div class="flow-modal-body">
              <div class="flow-board-viewport" data-flow-pan-viewport aria-label="放大后的流程图画布">
                ${renderDesignerFlowBoard(process)}
              </div>
            </div>
          </div>
        </section>
      `;
    }

    function renderIssueList(report = {}) {
      const issues = report.issues || [];
      if (!issues.length) return `<div class="assistant-empty">${escapeHtml(report.summary || "暂无校验问题。")}</div>`;
      return `<div class="issue-list">${issues.map((issue) => `<div class="issue-item ${issue.severity === "blocking" ? "blocking" : "warning"}"><strong>${escapeHtml(issue.category || "issue")} · ${escapeHtml(issue.severity || "")}</strong><span>${escapeHtml(issue.message || "")}</span></div>`).join("")}</div>`;
    }

    function stageList(values, process = null, showId = true) {
      if (!values || !values.length) return "-";
      return values.map((value) => stageDisplayName(value, process, showId)).join("、");
    }

    function stageDisplayName(value, process = null, showId = true) {
      const raw = String(value || "");
      if (!raw) return "-";
      if (raw === "all") return "全部环节";
      const normalized = normalizeDesignerTargetId(raw);
      const withId = (name) => (showId ? `${name}（环节ID：${raw}）` : name);
      if (normalized === "END") return withId("流程结束");
      if (normalized === "draft") return withId("起草");
      const node = (process?.flow_nodes || []).find((item) => normalizeDesignerTargetId(item.node_id) === normalized);
      if (node?.node_name) return withId(node.node_name);
      return showId ? `环节ID：${raw}` : raw;
    }

    function pathTargetName(process, targetNodeId) {
      const normalized = normalizeDesignerTargetId(targetNodeId);
      if (normalized === "END") return "流程结束";
      if (normalized === "draft") return "起草";
      const node = (process.flow_nodes || []).find((item) => normalizeDesignerTargetId(item.node_id) === normalized);
      return node?.node_name || targetNodeId;
    }

    function normalizeDesignerTargetId(targetNodeId) {
      const raw = String(targetNodeId || "");
      if (raw.toUpperCase() === "END") return "END";
      if (raw.toUpperCase() === "DRAFT") return "draft";
      return raw;
    }

    function renderCase() {
      const detail = state.caseDetail;
      if (!detail) return "";
      const active = detail.active_work_item;
      const canDraft = active && active.type === "DRAFT" && active.status === "OPEN";
      const canApprove = active && active.type === "APPROVAL" && active.status === "OPEN";
      return `
        <header class="topbar">
          <div class="page-title"><h1>${escapeHtml(detail.case.title)}</h1><p>${escapeHtml(detail.workflow.name)} · ${escapeHtml(detail.workflow.version)} · 当前环节：${escapeHtml(detail.case.current_node_name)}</p></div>
          <div class="top-actions">${statusTag(detail.case.status)}<button class="button" type="button" data-nav="myProcesses">返回我的流程</button></div>
        </header>
        <div class="case-document">
          ${renderCaseMeta(detail, active)}
          <div class="case-detail-grid">
            <main class="case-main-stack">
              ${renderApplicationInfo(detail, canDraft)}
              ${renderSupplement(detail)}
              ${canDraft ? renderDraftActions(detail) : canApprove ? renderApproval(active) : renderCurrentStatus(active)}
            </main>
            <aside class="case-side-stack">
              ${renderProcessAssist(detail, active, canDraft, canApprove)}
              <section class="section"><div class="section-head"><div class="section-title"><strong>流程轨迹</strong><span>每条记录对应一个环节任务，合并环节和处理人。</span></div></div>${renderTimeline(detail)}</section>
            </aside>
          </div>
        </div>
      `;
    }

    function renderCaseMeta(detail, active) {
      const meta = [
        ["流程编号", detail.case.case_no],
        ["当前环节", detail.case.current_node_name],
        ["发起人", detail.case.initiator_name],
        ["到达时间", active?.arrived_at ? formatDateTime(active.arrived_at) : "-"],
        ["处理期限", active?.due_at ? formatDateTime(active.due_at) : active ? "次日 18:00" : "-"]
      ];
      return `<div class="case-meta-strip">${meta.map(([label, value]) => `<div class="case-meta-card"><label>${escapeHtml(label)}</label><strong>${escapeHtml(value)}</strong></div>`).join("")}</div>`;
    }

    function renderApplicationInfo(detail, editableMode) {
      return `
        <section class="section application-section">
          <div class="section-head"><div class="section-title"><strong>申请信息</strong><span>${editableMode ? "起草环节可编辑业务字段。" : "仅展示申请单中的业务表单字段，不混入流程流转字段。"}</span></div></div>
          <div class="case-info-grid">
            ${detail.form_schema.filter((field) => field.visible).map((field) => renderField(field, editableMode)).join("")}
          </div>
        </section>
      `;
    }

    function renderField(field, editableMode) {
      const value = state.formValues[field.field_name] ?? "";
      const editable = editableMode && field.editable;
      const full = field.component_type === "多行文本" || field.field_name === "标题" || field.field_name.includes("原因");
      return `
        <div class="case-field ${full ? "full" : ""}">
          <label>${escapeHtml(field.field_name)}${field.required ? "<span>*</span>" : ""}</label>
          ${editable ? renderInput(field, value) : `<div class="readonly">${escapeHtml(displayValue(value))}</div>`}
        </div>
      `;
    }

    function renderInput(field, value) {
      const name = escapeAttr(field.field_name);
      const common = `data-field="${name}"`;
      if (field.component_type === "日期组件") return `<input class="input" type="date" value="${escapeAttr(value)}" ${common} />`;
      if (field.component_type === "数字") return `<input class="input" type="number" value="${escapeAttr(value)}" ${common} />`;
      if (field.component_type === "下拉单选") {
        return `<select class="select" ${common}>${(field.options || []).map((option) => `<option value="${escapeAttr(option)}" ${String(value) === option ? "selected" : ""}>${escapeHtml(option)}</option>`).join("")}</select>`;
      }
      if (field.component_type === "多行文本") return `<textarea class="textarea" maxlength="${field.max_length || ""}" placeholder="${escapeAttr(field.placeholder || "")}" ${common}>${escapeHtml(value)}</textarea>`;
      return `<input class="input" type="text" value="${escapeAttr(value)}" maxlength="${field.max_length || ""}" placeholder="${escapeAttr(field.placeholder || "")}" ${common} />`;
    }

    function renderSupplement(detail) {
      const activeName = detail.active_work_item?.node_name || detail.case.current_node_name;
      return `
        <section class="section supporting-section">
          <div class="section-head"><div class="section-title"><strong>补充说明与附件</strong><span>第一版仅展示说明、附件占位和流程版本信息。</span></div></div>
          <div class="case-support-grid">
            <div class="support-card full"><label>申请说明</label><span>当前环节为${escapeHtml(activeName)}，请结合申请材料、业务背景和当前环节要求处理。</span></div>
            <div class="support-card"><label>附件</label><span>暂无必传附件</span></div>
            <div class="support-card"><label>流程版本</label><span>${escapeHtml(detail.workflow.code || detail.workflow.workflow_id)} / ${escapeHtml(detail.workflow.version)}</span></div>
          </div>
        </section>
      `;
    }

    function renderDraftActions(detail) {
      const draftNode = (detail.definition.flow_nodes || []).find((node) => node.node_id === "draft");
      const path = draftNode?.submit_paths?.[0];
      const targetNode = (detail.definition.flow_nodes || []).find((node) => node.node_id === path?.target_node_id);
      return `
        <section class="section action-section">
          <div class="section-head"><div class="section-title"><strong>起草提交</strong><span>起草环节只填写表单并提交申请，不显示同意/不同意。</span></div></div>
          <div class="approval-body">
            <div class="approval-subtitle"><strong>可提交路径</strong><span>保存草稿不会推进流程，提交申请后进入下一审批环节。</span></div>
            <div class="route-list">
              <div class="route-line active"><div><strong>${escapeHtml(path?.path_name || "送部门主管审批")}</strong><small>目标：${escapeHtml(targetNode?.node_name || "部门主管审批")}</small></div><span class="route-state">可提交</span></div>
            </div>
            <div class="approval-submit-row"><button class="button" type="button" data-save-draft>保存草稿</button><button class="button primary" type="button" data-submit-draft>提交申请</button></div>
          </div>
        </section>
      `;
    }

    function renderApproval(active) {
      return `
        <section class="section action-section">
          <div class="section-head"><div class="section-title"><strong>审批处理</strong><span>填写处理意见，并根据当前环节选择可提交路径。</span></div></div>
          <div class="approval-body">
            <div class="approval-subtitle"><strong>处理意见</strong><span>选择动作后展示对应提交状态。</span></div>
            <textarea class="textarea" data-comment placeholder="审批意见说明">${escapeHtml(state.comment)}</textarea>
            <div class="approval-actions">
              <button class="decision approve ${state.decision === "同意" ? "active" : ""}" type="button" data-decision="同意">同意</button>
              <button class="decision reject ${state.decision === "不同意" ? "active" : ""}" type="button" data-decision="不同意">不同意</button>
            </div>
            <div class="approval-subtitle"><strong>可提交路径</strong><span>根据当前环节、意见和流程规则展示。</span></div>
            <div class="route-list">
              ${renderRouteOptions()}
            </div>
            <div class="approval-submit-row"><button class="button primary" type="button" data-complete-approval>提交处理</button></div>
          </div>
        </section>
      `;
    }

    function renderRouteOptions() {
      if (!state.routeOptions.length) return `<div class="assistant-empty">选择处理意见后显示可提交路径。</div>`;
      return state.routeOptions.map((route) => {
        const isReturn = route.target_node_id === "DRAFT";
        const selected = state.selectedRoute === route.edge_id;
        const label = route.enabled ? "可提交" : (isReturn ? "需选择不同意" : "不可提交");
        return `
          <button class="route-line ${selected ? "active" : ""}" type="button" data-route="${escapeAttr(route.edge_id)}" ${route.enabled ? "" : "disabled"}>
            <div><strong>${escapeHtml(route.path_name)}</strong><small>目标：${escapeHtml(route.target_node_name)}${route.reason ? ` · ${escapeHtml(route.reason)}` : ""}</small></div>
            <span class="route-state ${route.enabled ? "" : "warn"}">${escapeHtml(label)}</span>
          </button>
        `;
      }).join("");
    }

    function selectedRouteIsReturn() {
      const route = state.routeOptions.find((item) => item.edge_id === state.selectedRoute);
      return Boolean(route && route.target_node_id === "DRAFT");
    }

    function renderCurrentStatus(active) {
      const message = active ? "当前任务不是审批任务。" : "当前没有分配给你的可处理任务。";
      return `<section class="section action-section"><div class="section-head"><div class="section-title"><strong>当前处理</strong><span>任务状态</span></div></div><div class="assistant-empty">${escapeHtml(message)}</div></section>`;
    }

    function renderProcessAssist(detail, active, canDraft, canApprove) {
      const summary = canApprove
        ? `${escapeHtml(active.node_name)}需要核对申请信息、请假时间和请假原因是否完整。`
        : canDraft
          ? "起草环节只需要补齐请假表单并提交申请，不需要填写同意或不同意。"
          : "当前用户没有可处理任务，可从工作台查看其他待办或已发起流程。";
      const draft = state.decision === "不同意" || selectedRouteIsReturn()
        ? "不同意，请补充说明后重新提交。"
        : "同意，申请信息完整，审批通过。";
      return `
        <section class="section">
          <div class="section-head"><div class="section-title"><strong>处理提示</strong><span>摘要和风险仅辅助判断。</span></div><span class="tag blue">建议</span></div>
          <div class="assist-body">
            <div class="assist-finding">${summary}</div>
            ${canApprove ? `<button class="button" type="button" data-fill-comment="${escapeAttr(draft)}">填入意见草稿</button><span class="draft-hint">已准备一条意见草稿，可填入后修改。</span>` : `<span class="draft-hint">流程助手发现功能入口保留，MVP 暂不做自动分析。</span>`}
          </div>
        </section>
      `;
    }

    function renderTimeline(detail) {
      const items = detail.work_items || [];
      if (!items.length) return `<div class="assistant-empty">暂无流转记录。</div>`;
      return `<div class="timeline">${items.map((item) => {
        const current = item.status === "OPEN";
        const done = ["COMPLETED", "SKIPPED"].includes(item.status);
        const status = current ? "当前环节" : item.status === "SKIPPED" ? "已跳过" : item.type === "DRAFT" ? "已提交" : "已处理";
        const statusTone = current ? "blue" : item.status === "SKIPPED" ? "amber" : "green";
        const actorLine = current
          ? `当前处理人：${displayValue(item.current_handler_name)}`
          : `${displayValue(item.submitted_by_name || item.current_handler_name)} 已提交${item.decision ? ` · ${item.decision}` : ""}`;
        const pathLine = item.selected_edge_label
          ? `提交路径：${item.selected_edge_label}${item.target_node_name ? ` -> ${item.target_node_name}` : ""}`
          : "";
        const nextLine = item.next_handler_names?.length ? `下一处理人：${item.next_handler_names.join("、")}` : "";
        const timeLine = current
          ? `到达时间：${formatDateTime(item.arrived_at || item.created_at)}`
          : `完成时间：${formatDateTime(item.completed_at || item.updated_at)}`;
        return `
          <div class="event ${current ? "current" : done ? "done" : ""}">
            <span class="dot"></span>
            <div class="event-content ${current ? "current" : done ? "done" : ""}">
              <div class="event-title"><strong>${escapeHtml(item.node_name)} · ${escapeHtml(item.current_handler_name)}</strong><span class="tag ${statusTone}">${escapeHtml(status)}</span></div>
              <div class="track-meta">
                <span>${escapeHtml(actorLine)}</span>
                ${pathLine ? `<span>${escapeHtml(pathLine)}</span>` : ""}
                ${nextLine ? `<span>${escapeHtml(nextLine)}</span>` : ""}
                <span>${escapeHtml(timeLine)}</span>
              </div>
            </div>
          </div>
        `;
      }).join("")}</div>`;
    }

    function renderPlaceholder() {
      return `
        <header class="topbar"><div class="page-title"><h1>${escapeHtml(state.placeholderTitle || "后续模块")}</h1><p>导航入口已按原型保留，功能会在后续切片逐步实现。</p></div><div class="top-actions"><button class="button" type="button" data-nav="myProcesses">返回我的流程</button></div></header>
        <section class="placeholder"><div><strong>${escapeHtml(state.placeholderTitle || "后续模块")}</strong><br />当前 Slice 1 只实现请假审批闭环。该模块先作为信息架构占位，后续再接流程管理、AI 设计、组织权限或规则库能力。</div></section>
      `;
    }

    function renderAnalytics() {
      const validTabs = ["dashboard", "diagnosis", "chat", "comparison"];
      const tab = validTabs.includes(state.analyticsTab) ? state.analyticsTab : "dashboard";
      const header = `
        <header class="topbar">
          <div class="page-title"><h1>效能分析</h1><p>员工请假申请流程 · 合成数据</p></div>
          <div class="top-actions">${tab === "dashboard" ? `<button class="button" type="button" data-analytics-refresh>刷新</button>` : ""}</div>
        </header>
        <div class="tabs">
          <button class="tab ${tab === "dashboard" ? "active" : ""}" type="button" data-analytics-tab="dashboard">效能看板</button>
          <button class="tab ${tab === "diagnosis" ? "active" : ""}" type="button" data-analytics-tab="diagnosis">诊断报告</button>
          <button class="tab ${tab === "chat" ? "active" : ""}" type="button" data-analytics-tab="chat">指标问答</button>
          <button class="tab ${tab === "comparison" ? "active" : ""}" type="button" data-analytics-tab="comparison">版本对比</button>
        </div>
      `;
      const body = tab === "dashboard"
        ? renderAnalyticsDashboardBody()
        : tab === "diagnosis"
          ? renderAnalyticsDiagnosisBody()
          : tab === "chat"
            ? renderAnalyticsChatBody()
            : renderAnalyticsComparisonBody();
      return `${header}${body}`;
    }

    function renderAnalyticsComparisonBody() {
      const cmp = state.analyticsComparison;
      if (!cmp) {
        return `<section class="placeholder"><div><strong>暂无版本对比</strong><br />请先生成 v2 数据（<code>scripts/gen_leave_process_v2.py</code>）。</div></section>`;
      }
      const reach = `到达条线分管领导比例 ${formatPct(cmp.line_leader_reach_ratio_v1)} → ${formatPct(cmp.line_leader_reach_ratio_v2)}`;
      const overviewTable = renderComparisonTable(cmp.overview);
      const pathTable = renderComparisonTable(cmp.path);
      const nodeSections = (cmp.nodes || []).map((n) => `
        <div class="cmp-node">
          <h4>${escapeHtml(n.node_name)}</h4>
          ${renderComparisonTable(n.metrics)}
        </div>
      `).join("");
      return `
        <div class="analytics-body">
          <div class="cmp-headline">
            <div class="cmp-headline-kicker">流程被分析 → 被改进 → 量化提升</div>
            <div class="cmp-headline-main">${escapeHtml(cmp.headline)}</div>
            <div class="cmp-headline-sub">v1 ${cmp.v1_case_count} 例 / v2 ${cmp.v2_case_count} 例 · 同输入分布同种子 · ${escapeHtml(reach)}</div>
          </div>
          <div class="section">
            <div class="section-head"><div class="section-title"><strong>总览指标</strong><span>改进前后对比</span></div></div>
            <div class="section-body">${overviewTable}</div>
          </div>
          <div class="section">
            <div class="section-head"><div class="section-title"><strong>路径指标</strong></div></div>
            <div class="section-body">${pathTable}</div>
          </div>
          <div class="section">
            <div class="section-head"><div class="section-title"><strong>各环节</strong></div></div>
            <div class="section-body cmp-nodes">${nodeSections}</div>
          </div>
        </div>
      `;
    }

    function renderComparisonTable(rows) {
      if (!rows || !rows.length) return `<p class="muted-hint">暂无数据</p>`;
      const body = rows.map((d) => {
        const mark = d.improved === true ? `<span class="cmp-up">✅</span>` : (d.improved === false ? `<span class="cmp-down">⚠️</span>` : "—");
        const pct = d.pct_change !== null && d.pct_change !== undefined ? `（${(d.pct_change * 100 >= 0 ? "+" : "")}${(d.pct_change * 100).toFixed(0)}%）` : "";
        return `<tr><td>${escapeHtml(d.label)}</td><td>${fmtNum(d.v1)}</td><td>${fmtNum(d.v2)}</td><td>${mark} ${fmtNum(d.delta, true)}${pct}</td></tr>`;
      }).join("");
      return `<table class="analytics-table cmp-table"><thead><tr><th>指标</th><th>v1</th><th>v2</th><th>变化</th></tr></thead><tbody>${body}</tbody></table>`;
    }

    function fmtNum(value, signed) {
      if (value === null || value === undefined) return "—";
      const n = Number(value);
      return signed && n >= 0 ? `+${n.toFixed(2)}` : n.toFixed(2);
    }

    function formatPct(value) {
      if (value === null || value === undefined) return "—";
      return `${(value * 100).toFixed(1)}%`;
    }

    function renderAnalyticsDashboardBody() {
      if (state.analyticsError) {
        return `<section class="placeholder"><div><strong>看板数据不可用</strong><br />${escapeHtml(state.analyticsError)}<br />请先运行 <code>scripts/gen_leave_process_event_log.py</code> 生成合成数据。</div></section>`;
      }
      const data = state.analyticsMetrics;
      if (!data) {
        return `<section class="placeholder"><div>正在加载…</div></section>`;
      }

      const nodeNames = data.node_names || {};
      const nodeLabel = (id) => nodeNames[id] || id;

      const overview = data.overview;
      const overviewCards = `
        <section class="summary-strip" aria-label="效能总览">
          ${metric("案例总数", overview.case_count, "含进行中/终止")}
          ${metric("正常结束占比", fmtPercent(overview.completion_rate), "案例状态分布")}
          ${metric("平均办结时长", fmtHours(overview.avg_case_duration_hours), "仅正常结束案例")}
          ${metric("平均流转环节数", fmtNum(overview.avg_node_visits), "不含运维伪环节")}
          ${metric("人工介入比例", fmtPercent(overview.manual_intervention_case_ratio), `${overview.manual_intervention_case_count} 个案例命中`)}
        </section>
      `;

      const nodeIds = Object.keys(data.node_metrics);
      const dwellBars = renderHBarList(
        nodeIds.map((id) => ({
          label: nodeLabel(id),
          value: data.node_metrics[id].avg_dwell_hours || 0,
          hint: fmtHours(data.node_metrics[id].avg_dwell_hours)
        })),
        { tone: "accent" }
      );
      const nodeQualityRows = nodeIds.map((id) => {
        const node = data.node_metrics[id];
        return `<tr>
          <td>${escapeHtml(nodeLabel(id))}</td>
          <td>${fmtPercent(node.return_rate)}</td>
          <td>${node.sla_achievement_rate == null ? "—" : fmtPercent(node.sla_achievement_rate)}</td>
          <td>${fmtNum(node.avg_visits_per_case)}</td>
        </tr>`;
      }).join("");

      const path = data.path_metrics;
      const pathCards = `
        <section class="summary-strip" aria-label="路径健康度">
          ${metric("返工率", fmtPercent(path.rework_rate), `${path.rework_case_count} 个案例含退回`)}
          ${metric("路径变体种类", path.distinct_variant_count, "不同环节序列数")}
          ${metric("违规跳级", path.conformance_violation_count, "结构性 conformance 违规")}
        </section>
      `;
      const variantList = path.top_variants.slice(0, 5).map((variant) => `
        <li><span class="variant-path">${variant.path.map(nodeLabel).join(" → ")}</span><span class="variant-count">${variant.count}</span></li>
      `).join("");

      const manual = data.manual_intervention;
      const manualCards = `
        <section class="summary-strip" aria-label="人工介入">
          ${metric("人工介入事件数", manual.total_ops_events, "后台运维操作伪环节")}
        </section>
      `;
      const manualBars = renderHBarList(
        Object.entries(manual.by_prior_node).map(([name, count]) => ({ label: name, value: count, hint: String(count) })),
        { tone: "amber" }
      );

      const customMetrics = data.custom_metrics || [];
      const customSection = customMetrics.length ? `
        <div class="section">
          <div class="section-head"><div class="section-title"><strong>自定义指标</strong><span>在「指标问答」里转正的常态化跟踪指标</span></div></div>
          <div class="section-body"><div class="summary-strip">${customMetrics.map((m) => metric(m.name, formatQueryValue(m.value && typeof m.value === "object" ? "（分组）" : m.value, m.aggregate), `命中 ${m.matched}/${m.total}`)).join("")}</div></div>
        </div>
      ` : "";

      const origin = data.origination_metrics;
      const deptBars = renderHBarList(
        Object.entries(origin.by_department).map(([name, count]) => ({ label: name, value: count, hint: String(count) })),
        { tone: "green" }
      );
      const leaveTypeCounts = origin.by_case_attribute["请假类型"] || {};
      const leaveTypeBars = renderHBarList(
        Object.entries(leaveTypeCounts).map(([name, count]) => ({ label: name, value: count, hint: String(count) })),
        { tone: "green" }
      );
      const monthlyBars = renderHBarList(
        Object.entries(origin.monthly_trend).map(([month, count]) => ({ label: month, value: count, hint: String(count) })),
        { tone: "accent" }
      );

      return `
        <div class="analytics-body">
          <p class="analytics-note">结构化指标，纯确定性计算，不含 AI 归因；如需成因分析与优化建议，请切到「诊断报告」。</p>
          ${overviewCards}
          <div class="section">
            <div class="section-head"><div class="section-title"><strong>环节效能排名</strong><span>各环节平均处理时长（小时），越长越靠前</span></div></div>
            <div class="section-body">${dwellBars}</div>
          </div>
          <div class="section">
            <div class="section-head"><div class="section-title"><strong>环节质量</strong><span>退回率 / SLA 达成率 / 人均访问次数</span></div></div>
            <div class="section-body"><table class="analytics-table"><thead><tr><th>环节</th><th>退回率</th><th>SLA 达成率</th><th>人均访问次数</th></tr></thead><tbody>${nodeQualityRows}</tbody></table></div>
          </div>
          ${pathCards}
          <div class="section">
            <div class="section-head"><div class="section-title"><strong>路径变体 Top 5</strong><span>案例走过的环节序列</span></div></div>
            <div class="section-body"><ul class="variant-list">${variantList || "<li>暂无数据</li>"}</ul></div>
          </div>
          ${manualCards}
          <div class="section">
            <div class="section-head"><div class="section-title"><strong>人工介入 · 按前置环节</strong><span>介入发生在哪个环节之后</span></div></div>
            <div class="section-body">${manualBars}</div>
          </div>
          ${customSection}
          <div class="section">
            <div class="section-head"><div class="section-title"><strong>发起概况</strong><span>按部门 / 请假类型 / 月度趋势</span></div></div>
            <div class="section-body analytics-origin-grid">
              <div><h4>按部门</h4>${deptBars}</div>
              <div><h4>按请假类型</h4>${leaveTypeBars}</div>
              <div><h4>月度趋势</h4>${monthlyBars}</div>
            </div>
          </div>
        </div>
      `;
    }

    function renderAnalyticsDiagnosisBody() {
      const report = state.analyticsDiagnosis;
      const list = state.analyticsDiagnosisList || [];
      const historyPicker = list.length
        ? `<select class="diagnosis-history-select" data-diagnosis-history>${list.map((r) => `<option value="${escapeHtml(r.report_id)}" ${r.report_id === state.analyticsDiagnosisSelectedId ? "selected" : ""}>${escapeHtml(formatTimestamp(r.generated_at))}（${r.candidate_count} 项）</option>`).join("")}</select>`
        : "";
      const runBar = `
        <div class="diagnosis-runbar">
          <div><strong>AI 运营诊断</strong><span>基于确定性指标筛出候选堵点，再由 AI 归因并给出优化建议（单次 LLM 调用）</span></div>
          <div class="diagnosis-runbar-actions">${list.length ? `<label class="diagnosis-history-label">历史报告</label>${historyPicker}` : ""}<button class="button primary" type="button" data-diagnosis-run ${state.analyticsDiagnosisLoading ? "disabled" : ""}>${state.analyticsDiagnosisLoading ? "分析中…" : (list.length ? "重新生成" : "生成诊断报告")}</button></div>
        </div>
      `;
      if (state.analyticsDiagnosisError) {
        return `<div class="analytics-body">${runBar}<section class="placeholder"><div><strong>诊断生成失败</strong><br />${escapeHtml(state.analyticsDiagnosisError)}</div></section></div>`;
      }
      if (state.analyticsDiagnosisLoading) {
        return `<div class="analytics-body">${runBar}<section class="placeholder"><div>AI 正在分析候选堵点，请稍候…</div></section></div>`;
      }
      if (!report) {
        return `<div class="analytics-body">${runBar}<section class="placeholder"><div>点击「生成诊断报告」，让 AI 分析当前流程的堵点成因并给出优化建议。</div></section></div>`;
      }

      const llmNote = report.llm_available ? "" : `<div class="edit-error-banner">当前模型不可用，仅展示确定性候选堵点，未生成 AI 归因与建议。</div>`;
      const summary = report.summary
        ? `<div class="section"><div class="section-head"><div class="section-title"><strong>总体诊断</strong><span>命中 ${report.candidate_count} 个候选堵点</span></div></div><div class="section-body diagnosis-summary">${escapeHtml(report.summary)}</div></div>`
        : "";
      const knowledge = (report.knowledge_context || []).length
        ? `<div class="section"><div class="section-head"><div class="section-title"><strong>参考知识依据</strong><span>本次诊断从流程知识库检索到的运营基准/制度（归因与建议据此引用）</span></div></div><div class="section-body">${report.knowledge_context.map((k) => `<div class="diagnosis-kb-item"><span class="diagnosis-kb-src">${escapeHtml(k.source)}</span>${escapeHtml(k.text)}</div>`).join("")}</div></div>`
        : "";
      const items = (report.items || []).map(renderDiagnosisItem).join("");
      const emptyHint = report.candidate_count === 0
        ? `<section class="placeholder"><div>未检出超过告警阈值的候选堵点，当前流程运行指标处于正常区间。</div></section>`
        : "";
      return `<div class="analytics-body">${runBar}${llmNote}${summary}${knowledge}${items}${emptyHint}</div>`;
    }

    function renderDiagnosisItem(item) {
      const sevClass = item.severity === "high" ? "sev-high" : "sev-medium";
      const sevLabel = item.severity === "high" ? "高" : "中";
      const nodeTag = item.node_name ? `<span class="diagnosis-node">${escapeHtml(item.node_name)}</span>` : "";
      const rootCause = item.root_cause ? `<div class="diagnosis-field"><label>成因</label><p>${escapeHtml(item.root_cause)}</p></div>` : "";
      const suggestion = item.suggestion ? `<div class="diagnosis-field"><label>建议</label><p>${escapeHtml(item.suggestion)}</p></div>` : "";
      const editInstr = item.suggested_process_edit_instruction
        ? `<div class="diagnosis-field"><label>可转设计修改</label><p class="diagnosis-edit-instr">${escapeHtml(item.suggested_process_edit_instruction)}</p></div>`
        : "";
      return `
        <div class="section diagnosis-card">
          <div class="section-head">
            <div class="section-title"><strong>${escapeHtml(diagnosisCategoryLabel(item.category))}</strong><span>${escapeHtml(item.description)}</span></div>
            <div class="diagnosis-tags"><span class="diagnosis-sev ${sevClass}">${sevLabel}</span>${nodeTag}</div>
          </div>
          <div class="section-body">${rootCause}${suggestion}${editInstr}</div>
        </div>
      `;
    }

    function diagnosisCategoryLabel(category) {
      const map = {
        slow_node: "慢环节",
        high_return_rate: "高退回率",
        sla_breach: "超时违约",
        conformance_violation: "违规跳级",
        manual_intervention: "人工介入",
        high_rework: "高返工"
      };
      return map[category] || category;
    }

    function renderAnalyticsChatBody() {
      const messages = state.analyticsMessages;
      const intro = `<div class="analytics-chat-intro">就当前流程的指标提问：可以问已有指标（如「哪个环节最慢」），也可以让我临时算一个（如「病假超过3天的有几个」「各部门平均办结时长」），或说「以后都帮我盯着XX」把它转成常态化指标。</div>`;
      const bubbles = messages.map(renderAnalyticsMessage).join("");
      const thinking = state.analyticsAsking
        ? `<div class="chat-bubble assistant"><div class="chat-role">AI</div><div class="chat-body"><span class="chat-dots"><i></i><i></i><i></i></span></div></div>`
        : "";
      return `
        <div class="analytics-chat">
          <div class="analytics-chat-log">
            ${messages.length ? "" : intro}
            ${bubbles}
            ${thinking}
          </div>
          <div class="analytics-chat-input">
            <textarea data-analytics-ask placeholder="问一个关于该流程指标的问题…" rows="2" ${state.analyticsAsking ? "disabled" : ""}>${escapeHtml(state.analyticsAskInput)}</textarea>
            <button class="button primary" type="button" data-analytics-send ${state.analyticsAsking ? "disabled" : ""}>发送</button>
          </div>
        </div>
      `;
    }

    function renderAnalyticsMessage(message) {
      if (message.role === "user") {
        return `<div class="chat-bubble user"><div class="chat-body">${escapeHtml(message.content)}</div><div class="chat-role">我</div></div>`;
      }
      const persisted = (message.persisted || []).length
        ? `<div class="chat-persisted">已转为常态化指标：${message.persisted.map((n) => `<span class="chat-persist-tag">${escapeHtml(n)}</span>`).join("")}（看板已更新）</div>`
        : "";
      const results = (message.queryResults || []).map(renderQueryResultCard).join("");
      return `<div class="chat-bubble assistant"><div class="chat-role">AI</div><div class="chat-body">${escapeHtml(message.content)}${results}${persisted}</div></div>`;
    }

    function renderQueryResultCard(result) {
      const aggLabel = { count: "计数", rate: "占比", avg_dwell_hours: "平均时长(小时)" }[result.aggregate] || result.aggregate;
      let valueHtml;
      if (result.value && typeof result.value === "object") {
        const rows = Object.entries(result.value).map(([k, v]) => `<div class="qr-row"><span>${escapeHtml(k)}</span><strong>${escapeHtml(formatQueryValue(v, result.aggregate))}</strong></div>`).join("");
        valueHtml = `<div class="qr-groups">${rows}</div>`;
      } else {
        valueHtml = `<div class="qr-scalar">${escapeHtml(formatQueryValue(result.value, result.aggregate))}</div>`;
      }
      return `
        <div class="query-result-card">
          <div class="qr-head"><strong>${escapeHtml(result.name)}</strong><span>${aggLabel} · 命中 ${result.matched}/${result.total}${result.group_by ? " · 按" + escapeHtml(result.group_by) + "分组" : ""}</span></div>
          ${valueHtml}
        </div>
      `;
    }

    function formatTimestamp(iso) {
      const date = new Date(iso);
      if (isNaN(date.getTime())) return iso;
      const pad = (n) => String(n).padStart(2, "0");
      return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())} ${pad(date.getHours())}:${pad(date.getMinutes())}`;
    }

    function formatQueryValue(value, aggregate) {
      if (value === null || value === undefined) return "—";
      if (aggregate === "rate") return `${(value * 100).toFixed(1)}%`;
      if (aggregate === "avg_dwell_hours") return `${Number(value).toFixed(1)}h`;
      return String(value);
    }

    function renderHBarList(items, opts = {}) {
      if (!items.length) return `<p class="muted-hint">暂无数据</p>`;
      const max = Math.max(...items.map((item) => item.value), 1);
      const tone = opts.tone || "accent";
      return `<div class="hbar-list">${items.map((item) => `
        <div class="hbar-row">
          <span class="hbar-label" title="${escapeAttr(item.label)}">${escapeHtml(item.label)}</span>
          <div class="hbar-track"><div class="hbar-fill hbar-${tone}" style="width:${Math.max(2, (item.value / max) * 100)}%"></div></div>
          <span class="hbar-value">${escapeHtml(item.hint)}</span>
        </div>
      `).join("")}</div>`;
    }

    function fmtPercent(value) {
      if (value === null || value === undefined) return "—";
      return `${(value * 100).toFixed(1)}%`;
    }
    function fmtHours(value) {
      if (value === null || value === undefined) return "—";
      return `${value.toFixed(1)}h`;
    }
    function fmtNum(value) {
      if (value === null || value === undefined) return "—";
      return value.toFixed(2);
    }

    function bindAnalyticsEvents() {
      document.querySelectorAll("[data-analytics-refresh]").forEach((button) => button.addEventListener("click", async () => {
        await loadAnalyticsDashboard();
        render();
      }));
      document.querySelectorAll("[data-analytics-tab]").forEach((button) => button.addEventListener("click", () => {
        state.analyticsTab = button.dataset.analyticsTab;
        render();
      }));
      document.querySelectorAll("[data-diagnosis-run]").forEach((button) => button.addEventListener("click", generateDiagnosisReport));
      document.querySelectorAll("[data-diagnosis-history]").forEach((select) => select.addEventListener("change", (event) => selectDiagnosis(event.target.value)));
      const askBox = document.querySelector("[data-analytics-ask]");
      if (askBox) {
        askBox.addEventListener("input", (event) => { state.analyticsAskInput = event.target.value; });
        askBox.addEventListener("keydown", (event) => {
          if (event.key === "Enter" && !event.shiftKey) {
            event.preventDefault();
            sendAnalyticsQuestion();
          }
        });
      }
      document.querySelectorAll("[data-analytics-send]").forEach((button) => button.addEventListener("click", sendAnalyticsQuestion));
    }

    function fmtHours(h) {
      if (h == null) return "";
      h = Math.round(Math.abs(h) * 10) / 10;
      return h >= 24 ? (Math.round(h / 24 * 10) / 10) + " 天" : h + " 小时";
    }

    function renderTodoApprovalRow(i) {
      const overdue = i.hours_to_deadline != null && i.hours_to_deadline < 0;
      const near = i.hours_to_deadline != null && i.hours_to_deadline >= 0 && i.hours_to_deadline <= 24;
      const badge = overdue ? `<span class="mp2-badge red">紧急</span>` : near ? `<span class="mp2-badge amber">临期</span>` : "";
      const meta = i.hours_to_deadline == null ? `停留 ${fmtHours(i.stay_hours)}`
        : overdue ? `已超时 ${fmtHours(i.hours_to_deadline)}` : `剩 ${fmtHours(i.hours_to_deadline)}`;
      const open = state.todoOpen === i.instance_id;
      return `
        <div class="mp2-row ${badge ? "flag" : ""} ${open ? "open" : ""}" data-todo-toggle="${escapeAttr(i.instance_id)}" data-todo-kind="approval">
          <div class="mp2-row-ic ${overdue ? "red" : near ? "amber" : ""}">${badge ? "!" : "·"}</div>
          <div class="mp2-row-body"><b>${escapeHtml(i.title)}</b><span>${escapeHtml(i.process_name || "")}${i.current_node_name ? " · " + escapeHtml(i.current_node_name) : ""} · <span class="${overdue ? "mp2-red" : near ? "mp2-amber" : ""}">${meta}</span></span></div>
          ${badge}
        </div>
        ${open ? renderTodoDetailBlock() : ""}`;
    }

    function renderTodoInitiatedRow(i) {
      const badge = i.stuck ? `<span class="mp2-badge red">卡住</span>` : "";
      const open = state.todoOpen === i.instance_id;
      return `
        <div class="mp2-row ${i.stuck ? "flag" : ""} ${open ? "open" : ""}" data-todo-toggle="${escapeAttr(i.instance_id)}" data-todo-kind="initiated">
          <div class="mp2-row-ic ${i.stuck ? "red" : ""}">${i.stuck ? "!" : "·"}</div>
          <div class="mp2-row-body"><b>${escapeHtml(i.title)}</b><span>${escapeHtml(i.process_name || "")}${i.current_node_name ? " · " + escapeHtml(i.current_node_name) : ""}${i.stuck ? ' · <span class="mp2-red">卡住</span>' : ""}</span></div>
          ${badge}
        </div>
        ${open ? renderTodoDetailBlock() : ""}`;
    }

    function renderTodoDetailBlock() {
      const d = state.todoDetail;
      if (!d) return `<div class="mp2-detail">加载中…</div>`;
      if (d.error) return `<div class="mp2-detail">加载失败</div>`;
      if (d.actions || d.content_risk) {  // 审批协助
        const risks = (d.content_risk && d.content_risk.length)
          ? d.content_risk.map((r) => `<div class="mp2-risk"><span class="mp2-risk-tag">风险</span><div>${escapeHtml(r.message)}<div class="mp2-risk-clause">${escapeHtml(r.clause || "")}</div></div></div>`).join("")
          : `<div class="mp2-ok">✓ 材料 / 内容未见风险</div>`;
        return `<div class="mp2-detail">
          <div class="mp2-detail-h">审批协助 · ${escapeHtml(d.title || "")}</div>
          ${risks}
          <div class="mp2-acts">${(d.actions || []).map((a) => `<button class="mp2-act" type="button">${escapeHtml(a)}</button>`).join("")}</div>
          <div class="mp2-note">${escapeHtml(d.note || "")}</div>
        </div>`;
      }
      // 进度追踪
      if (d.trackable === false) return `<div class="mp2-detail">该单暂不可追踪</div>`;
      const remaining = (d.remaining_node_names || []).join(" → ") || "无后续环节";
      const body = d.reaches_end
        ? `还剩 <b>${d.remaining_count}</b> 个环节（${escapeHtml(remaining)}），按历史平均约还要 <b>${d.eta_days} 天</b>`
        : `<span class="mp2-red">走不下去 —— 覆盖漏洞卡住，需运维处理</span>`;
      return `<div class="mp2-detail">
        <div class="mp2-detail-h">进度追踪</div>
        <div>当前：<b>${escapeHtml(d.current_node_name || "")}</b></div>
        <div style="margin-top:4px">${body}</div>
        ${d.reaches_end === false ? `<div class="mp2-acts"><button class="mp2-act primary" type="button" data-open-ops-instance="${escapeAttr(state.todoOpen)}">找运维处理 →</button></div>` : ""}
      </div>`;
    }

    function renderMyProcesses() {
      if (state.opsInstance) return renderOpsInstanceDetail();
      const todo = state.todo || { summary: {}, items: [] };
      const s = todo.summary || {};
      const items = todo.items || [];
      const approvals = items.filter((i) => i.kind === "approval");
      const initiated = items.filter((i) => i.kind === "initiated");
      return `
        <header class="topbar">
          <div class="page-title"><h1>我的流程</h1><p>待我审批 + 我发起的。急件确定性排序，卡住可直接找运维。</p></div>
          <div class="top-actions">${s.urgent ? `<span class="tag red">${s.urgent} 项紧急</span>` : ""}</div>
        </header>
        <section class="mp2-scroll">
          <div class="mp2-summary">
            <div class="mp2-summary-ic">✦</div>
            <div class="mp2-summary-body">早，帮你把今天的流程理好了：<b>待你审批 ${s.approval_total || 0} 项</b>（${s.urgent || 0} 项紧急）；<b>你发起 ${s.initiated_total || 0} 单</b>——${s.stuck || 0} 单卡住、${(s.initiated_total || 0) - (s.stuck || 0)} 单正常推进。
              <div class="mp2-summary-note">紧急度按 SLA 剩余 + 停留时长确定性排序，非 AI 估。</div></div>
          </div>
          ${approvals.length ? `<div class="mp2-card"><div class="mp2-h">待我审批 <span>· ${approvals.length}</span></div><div class="mp2-cardsub">按紧急度排序 · 点击查看审批协助</div>${approvals.map(renderTodoApprovalRow).join("")}</div>` : ""}
          ${initiated.length ? `<div class="mp2-card"><div class="mp2-h">我发起的 <span>· ${initiated.length}</span></div><div class="mp2-cardsub">追踪进度 · 点击查看进度/处理</div>${initiated.map(renderTodoInitiatedRow).join("")}</div>` : ""}
          ${(!approvals.length && !initiated.length) ? `<div class="kb-empty-hint">暂无待办</div>` : ""}
        </section>
      `;
    }

    function renderOpsInstanceDetail() {
      const inst = state.opsInstance;
      const d = inst.diagnosis || {};
      const stuck = d.stuck;
      const flow = (inst.nodes || []).map((n) =>
        `<span class="ops-flow-node ${n.current ? "current" : ""}">${escapeHtml(n.node_name)}</span>`
      ).join(`<span class="ops-flow-arrow">→</span>`);
      const formRows = Object.entries(inst.form_values || {}).map(([k, v]) =>
        `<div class="ops-form-row"><span>${escapeHtml(k)}</span><strong>${escapeHtml(String(v))}</strong></div>`
      ).join("");
      const diagPanel = d.diagnosable === false ? `<div class="ops-diag ok">该单已办结，无需诊断。</div>` : stuck ? `
        <div class="ops-diag stuck">
          <div class="ops-diag-head">⚠️ 为什么卡住</div>
          ${d.approver_empty ? `<div class="ops-diag-line">· 选不到审批人：${escapeHtml(d.approver_reason || "")}</div>` : ""}
          ${(d.blocked_paths || []).map((p) => `<div class="ops-diag-line">· 路径「${escapeHtml(p.path_name)}」走不了：${escapeHtml(p.reason || "")}</div>`).join("")}
        </div>` : `<div class="ops-diag ok">✅ 该流程当前可正常流转。</div>`;

      return `
        <header class="topbar">
          <div class="page-title"><h1>${escapeHtml(inst.title)}</h1><p>${escapeHtml(inst.process_name)} · ${escapeHtml(inst.status_label)}</p></div>
          <div class="top-actions"><button class="button" type="button" data-close-ops-instance>返回我的流程</button></div>
        </header>
        <div class="ops-layout">
          <section class="ops-doc">
            <div class="ops-section"><div class="ops-section-title">流转位置</div><div class="ops-flow">${flow || "—"}</div></div>
            <div class="ops-section"><div class="ops-section-title">表单信息</div><div class="ops-form">${formRows || "—"}</div></div>
            ${diagPanel}
            ${renderOpsInspection()}
          </section>
          <aside class="ops-chat">
            <div class="ops-chat-head"><strong>运维助手</strong><span>遇到卡住/异常，直接说你的诉求，我来判断能不能处理。</span></div>
            <div class="ops-chat-log">${renderOpsChatLog()}</div>
            ${state.opsPending ? renderOpsPendingBar() : ""}
            <div class="ops-chat-input">
              <textarea data-ops-input placeholder="例如：我其实请8天填成6了 / 这单选不到人 / 我要跳过这一步" ${state.opsBusy || state.opsPending ? "disabled" : ""}>${escapeHtml(state.opsInput || "")}</textarea>
              <button class="button primary" type="button" data-ops-send ${state.opsBusy || state.opsPending ? "disabled" : ""}>发送</button>
            </div>
          </aside>
        </div>
      `;
    }

    function renderOpsInspection() {
      const insp = state.opsInspection;
      if (insp === null) return `<div class="ops-inspect loading"><div class="ops-section-title">在办体检</div><span class="chat-dots"><i></i><i></i><i></i></span></div>`;
      if (insp.diagnosable === false) return "";
      const materials = insp.material_findings || [];
      const compliance = insp.compliance_findings || [];
      if (!materials.length && !compliance.length) {
        return `<div class="ops-inspect ok"><div class="ops-section-title">在办体检</div>✅ 材料齐全，流程设计合规，未发现需处理的问题。</div>`;
      }
      const matRows = materials.map((m) => `<div class="ops-inspect-line">· 缺少材料「${escapeHtml(m.attachment_type)}」：${escapeHtml(m.reason)}</div>`).join("");
      const compRows = compliance.map((c) => `<div class="ops-inspect-line">· 合规红线（${escapeHtml(c.severity)}）：${escapeHtml(c.statement)} — ${escapeHtml(c.detail || "")}${c.source_doc ? "（" + escapeHtml(c.source_doc) + "）" : ""}</div>`).join("");
      return `
        <div class="ops-inspect warn">
          <div class="ops-inspect-head">🔎 在办体检发现 ${materials.length + compliance.length} 项，审批前请留意</div>
          ${matRows}${compRows}
        </div>`;
    }

    function renderOpsChatLog() {
      if (!state.opsMessages.length && !state.opsBusy) {
        return `<div class="kb-empty-hint">这张单子${state.opsInstance.diagnosis && state.opsInstance.diagnosis.stuck ? "卡住了——" : ""}把你的情况告诉我。</div>`;
      }
      const bubbles = state.opsMessages.map((m) => {
        if (m.role === "user") return `<div class="ops-bubble user">${escapeHtml(m.content)}</div>`;
        const p = m.proposal || {};
        const catTag = opsCategoryTag(p.category);
        const rationale = p.rationale ? `<div class="ops-bubble-rationale">依据：${escapeHtml(p.rationale)}</div>` : "";
        const authNote = p.route === "authorization"
          ? `<div class="ops-auth-note">⏳ 此操作动流程走向，属高风险，已提交<strong>流程负责人授权</strong>：${escapeHtml(p.authorization_summary || "")}。请等待审批。</div>`
          : "";
        return `<div class="ops-bubble assistant">${catTag}<div>${escapeHtml(p.reply || "")}</div>${rationale}${authNote}</div>`;
      }).join("");
      const thinking = state.opsBusy ? `<div class="ops-bubble assistant"><span class="chat-dots"><i></i><i></i><i></i></span></div>` : "";
      return bubbles + thinking;
    }

    function opsCategoryTag(cat) {
      const map = {
        data_fix: ["green", "改数据"], override_jump: ["amber", "跳转"], override_skip: ["amber", "跳过"],
        reassign: ["amber", "改派"], withdraw: ["amber", "撤回"], deny: ["red", "规则拒绝"], escalate: ["red", "升级人工"],
        no_issue: ["", "无异常"], clarify: ["", "待澄清"], done: ["green", "已处理"],
      };
      const [tone, label] = map[cat] || ["", cat || ""];
      return label ? `<span class="tag ${tone}">${escapeHtml(label)}</span> ` : "";
    }

    function renderOpsPendingBar() {
      const p = state.opsPending;
      return `
        <div class="ops-pending">
          <div class="ops-pending-summary">拟执行：${escapeHtml(p.pending_summary || "")}</div>
          <div class="ops-pending-actions">
            <button class="button primary" type="button" data-ops-confirm ${state.opsBusy ? "disabled" : ""}>确认执行</button>
            <button class="button ghost" type="button" data-ops-discard ${state.opsBusy ? "disabled" : ""}>放弃</button>
          </div>
        </div>`;
    }

    function bindMyProcessesEvents() {
      document.querySelectorAll("[data-todo-toggle]").forEach((el) => el.addEventListener("click", () => toggleTodoDetail(el.dataset.todoToggle, el.dataset.todoKind)));
      document.querySelectorAll("[data-open-ops-instance]").forEach((b) => b.addEventListener("click", (e) => { e.stopPropagation(); openOpsInstance(b.dataset.openOpsInstance); }));
      document.querySelectorAll("[data-close-ops-instance]").forEach((b) => b.addEventListener("click", closeOpsInstance));
      const box = document.querySelector("[data-ops-input]");
      if (box) {
        box.addEventListener("input", (e) => { state.opsInput = e.target.value; });
        box.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendOpsMessage(); } });
      }
      document.querySelectorAll("[data-ops-send]").forEach((b) => b.addEventListener("click", sendOpsMessage));
      document.querySelectorAll("[data-ops-confirm]").forEach((b) => b.addEventListener("click", confirmOpsAction));
      document.querySelectorAll("[data-ops-discard]").forEach((b) => b.addEventListener("click", discardOpsAction));
    }

    function renderAuthorizations() {
      const items = state.authorizationsList || [];
      const pending = items.filter((a) => a.status === "pending");
      const decided = items.filter((a) => a.status !== "pending");
      const statusTag = (s) => s === "approved" ? `<span class="tag green">已批准</span>` : s === "rejected" ? `<span class="tag red">已驳回</span>` : `<span class="tag amber">待审批</span>`;
      const card = (a) => `
        <div class="auth-card ${a.status}">
          <div class="auth-card-top">${statusTag(a.status)}<strong>${escapeHtml(a.instance_title)}</strong></div>
          <div class="auth-card-action">拟执行：${escapeHtml(a.action_summary)}</div>
          <div class="auth-card-reason">运维依据：${escapeHtml(a.reason || "—")}</div>
          <div class="auth-card-meta">发起人：${escapeHtml(a.requested_by)}${a.decision_note ? " · 批注：" + escapeHtml(a.decision_note) : ""}</div>
          ${a.status === "pending" ? `
            <div class="auth-card-actions">
              <button class="button primary" type="button" data-auth-approve="${escapeAttr(a.request_id)}" ${state.authBusy ? "disabled" : ""}>批准并执行</button>
              <button class="button ghost" type="button" data-auth-reject="${escapeAttr(a.request_id)}" ${state.authBusy ? "disabled" : ""}>驳回</button>
            </div>` : ""}
        </div>`;
      return `
        <header class="topbar">
          <div class="page-title"><h1>运维授权台</h1><p>运维副驾把高风险操作（跳转/跳过/改派）连同诊断和依据升级到这里，由流程负责人签字。</p></div>
          <div class="top-actions">${pending.length ? `<span class="tag amber">${pending.length} 待审批</span>` : `<span class="tag green">无待办</span>`}</div>
        </header>
        <section class="auth-body">
          ${pending.length ? pending.map(card).join("") : `<div class="kb-empty-hint">暂无待审批的授权工单。<br/>去「我的流程」里对卡住的单子发起 override（如跳转/改派），就会出现在这里。</div>`}
          ${decided.length ? `<div class="auth-divider">已处理</div>${decided.map(card).join("")}` : ""}
        </section>
      `;
    }

    function bindAuthorizationsEvents() {
      document.querySelectorAll("[data-auth-approve]").forEach((b) => b.addEventListener("click", () => decideAuthorization(b.dataset.authApprove, true)));
      document.querySelectorAll("[data-auth-reject]").forEach((b) => b.addEventListener("click", () => decideAuthorization(b.dataset.authReject, false)));
    }

    function renderKnowledge() {
      const header = `
        <header class="topbar">
          <div class="page-title"><h1>制度与规则库</h1><p>设计 Agent 合规校验、分析 Agent 归因，运行时都从这里检索依据</p></div>
          <div class="top-actions"><button class="button" type="button" data-nav="myProcesses">返回我的流程</button></div>
        </header>
      `;
      return `${header}<div class="kb-layout">${renderKnowledgeLeftPanel()}${renderKnowledgeSearchPanel()}</div>${state.kbDocModalOpen ? renderKbDocModal() : ""}`;
    }

    function renderKnowledgeLeftPanel() {
      const tab = state.knowledgeLeftTab === "docs" ? "docs" : "rules";
      const ruleCount = state.knowledgeRules ? state.knowledgeRules.total : "";
      const docCount = state.knowledgeDocuments ? state.knowledgeDocuments.total : "";
      const tabs = `
        <div class="kb-tabs">
          <button class="kb-tab ${tab === "rules" ? "active" : ""}" type="button" data-kb-left-tab="rules">原子规则${ruleCount !== "" ? ` ${ruleCount}` : ""}</button>
          <button class="kb-tab ${tab === "docs" ? "active" : ""}" type="button" data-kb-left-tab="docs">语料文档${docCount !== "" ? ` ${docCount}` : ""}</button>
        </div>`;
      const head = tab === "rules"
        ? `<h2>原子规则库</h2><p>制度/规范拆成可被代码校验的结构化规则；确定性规则由校验器逐条比对，不依赖大模型。</p>${renderKnowledgeRulesStats()}`
        : `<h2>语料文档</h2><p>知识库里全部的原始制度/规范文档——不管有没有被哪条原子规则引用，这里都能直接看到并点开查看原文。</p>`;
      const body = tab === "rules" ? renderKnowledgeRulesBody() : renderKnowledgeDocsBody();
      return `
        <div class="kb-panel">
          <div class="kb-panel-head">
            ${tabs}
            ${head}
          </div>
          <div class="kb-body">${body}</div>
        </div>`;
    }

    function renderKnowledgeRulesStats() {
      const data = state.knowledgeRules;
      if (!data) return "";
      return `
        <div class="kb-stat-row">
          <span class="tag blue">共 ${data.total} 条原子规则</span>
          <span class="tag green">${data.deterministic_count} 条确定性可校验</span>
          <span class="tag amber">${data.llm_judge_count} 条需 AI 研判</span>
        </div>`;
    }

    function renderKnowledgeRulesBody() {
      const data = state.knowledgeRules;
      if (!data) {
        return `<div class="kb-empty-hint">规则加载中…</div>`;
      }
      return (data.groups || []).map((group) => {
        const rules = group.rules.map((rule) => {
          const checkTag = rule.check_type === "deterministic"
            ? `<span class="tag green">确定性</span>`
            : `<span class="tag amber">AI 研判</span>`;
          const scope = (rule.applies_to_processes && rule.applies_to_processes.length)
            ? rule.applies_to_processes.join("、")
            : ((rule.applies_to_domains && rule.applies_to_domains.length) ? rule.applies_to_domains.join("、") : "通用");
          return `
            <div class="kb-rule">
              <div class="kb-rule-title">${escapeHtml(rule.title || rule.rule_id)}</div>
              <div class="kb-rule-top">
                ${checkTag}
                <span class="tag">${escapeHtml(scope)}</span>
                <span class="kb-rule-id">${escapeHtml(rule.rule_id)}</span>
              </div>
              <div class="kb-rule-stmt">${escapeHtml(rule.statement)}</div>
              <div class="kb-rule-src">出处：${rule.source_doc
                ? `<button class="kb-src-link" type="button" data-kb-view-doc="${escapeAttr(rule.source_doc)}">${escapeHtml(rule.source_doc)}</button>`
                : "—"}${rule.clause ? " · " + escapeHtml(rule.clause) : ""}</div>
            </div>`;
        }).join("");
        return `
          <div class="kb-group">
            <div class="kb-group-title">${escapeHtml(group.label)}<span class="tag">${group.rules.length}</span></div>
            ${rules}
          </div>`;
      }).join("");
    }

    function renderKnowledgeDocsBody() {
      const data = state.knowledgeDocuments;
      if (!data) {
        return `<div class="kb-empty-hint">文档加载中…</div>`;
      }
      return (data.groups || []).map((group) => {
        const docs = group.docs.map((doc) => {
          const scope = (doc.applies_to_processes && doc.applies_to_processes.length)
            ? doc.applies_to_processes.join("、")
            : ((doc.applies_to_domains && doc.applies_to_domains.length) ? doc.applies_to_domains.join("、") : "通用");
          return `
            <button class="kb-doc-card" type="button" data-kb-view-doc="${escapeAttr(doc.doc_id)}">
              <span class="kb-doc-card-title">${escapeHtml(doc.title)}</span>
              <span class="kb-rule-top"><span class="tag">${escapeHtml(scope)}</span><span class="kb-rule-id">${escapeHtml(doc.doc_id)}</span></span>
            </button>`;
        }).join("");
        return `
          <div class="kb-group">
            <div class="kb-group-title">${escapeHtml(group.label)}<span class="tag">${group.docs.length}</span></div>
            ${docs}
          </div>`;
      }).join("");
    }

    function renderKnowledgeSearchPanel() {
      const result = state.knowledgeSearchResult;
      let body;
      if (state.knowledgeSearching) {
        body = `<div class="kb-empty-hint">检索中…（真实向量索引 · Titan 嵌入）</div>`;
      } else if (!result) {
        body = `<div class="kb-empty-hint">输入一个问题，例如「请假多少天需要上传证明」「子公司重大事项谁审批」，看看命中哪几条依据。<br /><br />检索走真实向量库（Chroma + Titan 嵌入），带相关性阈值：没有相关内容时会诚实返回空，不硬凑。</div>`;
      } else if (result.unavailable) {
        body = `<div class="kb-empty-hint">向量索引暂不可用（需先构建索引 / 配置 Bedrock 凭证）。<br />可运行 <code>scripts/build_knowledge_index.py</code> 后重试。</div>`;
      } else if (!result.hits || !result.hits.length) {
        body = `<div class="kb-empty-hint">「${escapeHtml(result.query)}」没有检索到相关性达标的依据。<br />这正是设计意图——无据时诚实返回空，交给 Agent 的 prompt 明确「无依据不编造引用」。</div>`;
      } else {
        body = result.hits.map((hit) => {
          const kindTag = hit.kind === "rule" ? `<span class="tag blue">规则</span>` : `<span class="tag">条款</span>`;
          return `
            <div class="kb-hit">
              <div class="kb-hit-top">
                <span class="kb-hit-src">${kindTag} ${escapeHtml(hit.title || hit.source || "—")}</span>
                <span class="kb-hit-score">距离 ${escapeHtml(String(hit.score))}</span>
              </div>
              <div class="kb-hit-id">${hit.doc_id
                ? `<button class="kb-src-link" type="button" data-kb-view-doc="${escapeAttr(hit.doc_id)}">${escapeHtml(hit.source || "")}</button>`
                : escapeHtml(hit.source || "")}</div>
              <div class="kb-hit-text">${escapeHtml(hit.text)}</div>
            </div>`;
        }).join("");
      }
      return `
        <div class="kb-panel">
          <div class="kb-panel-head">
            <h2>语义检索 <span class="tag">Demo</span></h2>
            <p>运行时 Agent 用的同一条检索路径：结构化预筛 ∪ 向量语义召回。这里只演示语义召回部分。</p>
          </div>
          <div class="kb-search-bar">
            <input type="text" data-kb-search placeholder="问一个流程/制度问题…" value="${escapeHtml(state.knowledgeSearchInput || "")}" ${state.knowledgeSearching ? "disabled" : ""} />
            <button class="button primary" type="button" data-kb-search-btn ${state.knowledgeSearching ? "disabled" : ""}>检索</button>
          </div>
          <div class="kb-body">${body}</div>
        </div>`;
    }

      document.querySelectorAll("[data-flow-pan-viewport]").forEach((viewport) => {
        if (viewport.dataset.flowPanBound === "1") return;
        viewport.dataset.flowPanBound = "1";
        let isPanning = false;
        let pointerId = null;
        let startX = 0;
        let startY = 0;
        let startScrollLeft = 0;
        let startScrollTop = 0;
        let startPanX = 0;
        let startPanY = 0;
        let canScrollX = false;
        let canScrollY = false;

        const panLayer = () => viewport.querySelector(".logicflow-wrapper");
        const readPan = (axis) => Number(viewport.dataset[axis === "x" ? "flowPanX" : "flowPanY"] || 0);
        const writePan = (x, y) => {
          viewport.dataset.flowPanX = String(Math.round(x));
          viewport.dataset.flowPanY = String(Math.round(y));
          const layer = panLayer();
          if (layer) layer.style.transform = `translate(${Math.round(x)}px, ${Math.round(y)}px)`;
        };

        const stopPan = () => {
          if (!isPanning) return;
          isPanning = false;
          pointerId = null;
          viewport.classList.remove("is-panning");
        };

        viewport.addEventListener("pointerdown", (event) => {
          if (event.button !== 0) return;
          if (event.target.closest("button, input, textarea, select, a")) return;
          isPanning = true;
          pointerId = event.pointerId;
          startX = event.clientX;
          startY = event.clientY;
          startScrollLeft = viewport.scrollLeft;
          startScrollTop = viewport.scrollTop;
          startPanX = readPan("x");
          startPanY = readPan("y");
          canScrollX = viewport.scrollWidth > viewport.clientWidth + 1;
          canScrollY = viewport.scrollHeight > viewport.clientHeight + 1;
          viewport.classList.add("is-panning");
          viewport.setPointerCapture?.(event.pointerId);
        });

        viewport.addEventListener("pointermove", (event) => {
          if (!isPanning || event.pointerId !== pointerId) return;
          const dx = event.clientX - startX;
          const dy = event.clientY - startY;
          if (canScrollX) viewport.scrollLeft = startScrollLeft - dx;
          if (canScrollY) viewport.scrollTop = startScrollTop - dy;
          if (!canScrollX || !canScrollY) {
            writePan(
              canScrollX ? startPanX : startPanX + dx,
              canScrollY ? startPanY : startPanY + dy,
            );
          }
        });

        viewport.addEventListener("pointerup", stopPan);
        viewport.addEventListener("pointercancel", stopPan);
        viewport.addEventListener("lostpointercapture", stopPan);
      });
    }

    function closeInitializationEventSource() {
      if (state.initializationEventSource) {
        state.initializationEventSource.close();
        state.initializationEventSource = null;
      }
    }

    function resetInitializationProgress() {
      closeInitializationEventSource();
      state.initializationJobId = "";
      state.initializationProgressEvents = [];
      state.initializationProgressByNode = {};
    }

    function applyInitializationEvents(events) {
      (events || []).forEach((event) => applyInitializationEvent(event));
    }

    function applyInitializationEvent(event) {
      if (!event) return;
      if (
        event.sequence
        && state.initializationProgressEvents.some((item) => item.sequence === event.sequence)
      ) {
        return;
      }
      state.initializationProgressEvents = [...state.initializationProgressEvents, event];
      if (!event.node) return;
      const previous = state.initializationProgressByNode[event.node] || { status: "pending", logs: [] };
      const logs = event.message
        ? [...(previous.logs || []), { message: event.message, status: event.status || "running" }].slice(-8)
        : previous.logs || [];
      state.initializationProgressByNode = {
        ...state.initializationProgressByNode,
        [event.node]: {
          ...previous,
          status: normalizeInitializationNodeStatus(event.status || previous.status),
          logs
        }
      };
    }

    function normalizeInitializationNodeStatus(status) {
      if (status === "done" || status === "completed") return "done";
      if (status === "failed" || status === "error") return "failed";
      return "running";
    }

    async function handleInitializationProgressEvent(event) {
      applyInitializationEvent(event);
      if (event?.event_type === "job_completed" && event.session_id) {
        await finishInitializationFromSession(event.session_id);
        return;
      }
      if (event?.event_type === "job_failed") {
        closeInitializationEventSource();
        state.initializationRunning = false;
        setError(event.error || event.message || "LangGraph 初始化失败");
        return;
      }
      render();
    }

    function subscribeInitializationJob(jobId) {
      closeInitializationEventSource();
      if (!window.EventSource) {
        pollInitializationJob(jobId);
        return;
      }
      const source = new EventSource(`${API}/workflow-design/initialization-jobs/${encodeURIComponent(jobId)}/events`);
      state.initializationEventSource = source;
      source.addEventListener("progress", async (event) => {
        try {
          await handleInitializationProgressEvent(JSON.parse(event.data));
        } catch (error) {
          closeInitializationEventSource();
          state.initializationRunning = false;
          setError(error.message);
        }
      });
      source.onerror = async () => {
        if (!state.initializationRunning) {
          closeInitializationEventSource();
          return;
        }
        try {
          await pollInitializationJob(jobId, { once: true });
        } catch {
          // EventSource reconnects automatically; avoid showing a transient network error.
        }
      };
    }

    async function pollInitializationJob(jobId, options = {}) {
      const payload = await request(`/workflow-design/initialization-jobs/${encodeURIComponent(jobId)}`);
      applyInitializationEvents(payload.events || []);
      if (payload.status === "completed" && payload.session_id) {
        await finishInitializationFromSession(payload.session_id);
        return;
      }
      if (payload.status === "failed") {
        closeInitializationEventSource();
        state.initializationRunning = false;
        setError(payload.error || "LangGraph 初始化失败");
        return;
      }
      render();
      if (!options.once && state.initializationRunning) {
        window.setTimeout(() => pollInitializationJob(jobId).catch((error) => setError(error.message)), 1200);
      }
    }

    async function initializeWorkflowDesign() {
      clearError();
      const instruction = state.initializationInstruction.trim();
      const textSources = state.pendingDesignSources
        .filter((source) => !source.file)
        .map((source) => ({
          title: source.title || "未命名 source",
          content: source.content || "",
          source_type: source.source_type || "text"
        }))
        .filter((source) => source.content.trim());
      const fileSources = state.pendingDesignSources.filter((source) => source.file);
      if (!instruction && !textSources.length && !fileSources.length) {
        showToast("请先上传 source，或填写一段流程说明");
        return;
      }
      if (state.newDraftType !== "approval") {
        showToast("当前版本先支持审批流程初始化");
        return;
      }
      resetInitializationProgress();
      state.initializationRunning = true;
      render();
      try {
        const formData = new FormData();
        formData.append("created_by", state.user.user_id);
        formData.append("workflow_type", state.newDraftType);
        formData.append("workflow_name", state.newDraftName || "未命名审批流程");
        formData.append("category", state.newDraftCategory || "审批流程");
        formData.append("instruction", instruction);
        formData.append("text_sources_json", JSON.stringify(textSources));
        fileSources.forEach((source) => {
          formData.append("sources", source.file, source.title || source.file.name || "source");
        });
        const payload = await request("/workflow-design/initialization-file-jobs", {
          method: "POST",
          body: formData
        });
        state.initializationJobId = payload.job_id;
        applyInitializationEvents(payload.events || []);
        subscribeInitializationJob(payload.job_id);
        render();
      } catch (error) {
        closeInitializationEventSource();
        state.initializationRunning = false;
        setError(error.message);
        render();
      }
    }

        input.addEventListener("change", () => {

        });
      });
      const save = document.querySelector("[data-save-draft]");

      const submit = document.querySelector("[data-submit-draft]");
      if (submit) submit.addEventListener("click", submitDraft);
      document.querySelectorAll("[data-decision]").forEach((button) => button.addEventListener("click", () => chooseDecision(button.dataset.decision)));
      document.querySelectorAll("[data-route]").forEach((button) => button.addEventListener("click", () => { state.selectedRoute = button.dataset.route; render(); }));
      document.querySelectorAll("[data-fill-comment]").forEach((button) => button.addEventListener("click", () => {
        state.comment = button.dataset.fillComment || "";
        render();
      }));
      const comment = document.querySelector("[data-comment]");
      if (comment) comment.addEventListener("input", () => { state.comment = comment.value; });
      const complete = document.querySelector("[data-complete-approval]");
      if (complete) complete.addEventListener("click", completeApproval);
    }

    function updateLeaveDays() {
      const start = state.formValues["开始日期"];
      const end = state.formValues["结束日期"];
      if (!start || !end) return;
      const startDate = new Date(`${start}T00:00:00`);
      const endDate = new Date(`${end}T00:00:00`);
      if (Number.isNaN(startDate.getTime()) || Number.isNaN(endDate.getTime())) return;
      state.formValues["请假天数"] = Math.max(Math.floor((endDate - startDate) / 86400000) + 1, 1);
    }

    function syncFormValuesFromDom() {
      document.querySelectorAll("[data-field]").forEach((input) => {
        state.formValues[input.dataset.field] = input.value;
      });
      updateLeaveDays();
    }

    function metric(label, value, hint) {
      return `<div class="metric"><label>${escapeHtml(label)}</label><div class="metric-main"><strong>${escapeHtml(value)}</strong><span>${escapeHtml(hint)}</span></div></div>`;
    }
    function bucketTitle(bucket) {
      return { todo: "我的待办", drafts: "草稿", initiated: "我发起的", done: "已办" }[bucket] || bucket;
    }
    function bucketCount(bucket, counts) {
      return bucket === "initiated" ? counts.initiated || 0 : counts[bucket] || 0;
    }
    function statusTag(status) {
      const map = { DRAFT: ["草稿", "amber"], IN_PROGRESS: ["流转中", "green"], RETURNED: ["已退回", "red"], COMPLETED: ["已完成", "green"], OPEN: ["待处理", "amber"], SKIPPED: ["已跳过", "amber"] };
      const [label, tone] = map[status] || [status || "-", ""];
      return `<span class="tag ${tone}">${escapeHtml(label)}</span>`;
    }
    function displayValue(value) {
      if (Array.isArray(value)) return value.join("、");
      if (value === null || value === undefined || value === "") return "-";
      return String(value);
    }
    function sourceTypeBadge(value) {
      const type = String(value || "file").toUpperCase().replace(/[^A-Z0-9]/g, "");
      const aliases = { MARKDOWN: "MD", TEXT: "TXT", JPEG: "JPG", IMAGE: "IMG", FILE: "FILE" };
      return (aliases[type] || type || "FILE").slice(0, 3);
    }
    function formatDateTime(value) {
      if (!value) return "-";
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return String(value);
      return new Intl.DateTimeFormat("zh-CN", {
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
        hour12: false
      }).format(date);
    }
    function persistSession(user) {
      localStorage.setItem(SESSION_KEY, JSON.stringify(user));
    }
    function loadPersistedUser() {
      try {
        const raw = localStorage.getItem(SESSION_KEY);
        return raw ? JSON.parse(raw) : null;
      } catch {
        localStorage.removeItem(SESSION_KEY);
        return null;
      }
    }
    function setError(message) {
      state.error = message;
      if (state.user) {
        render();
      } else {
        renderLogin();
      }
    }
    function clearError() { state.error = ""; }
    function showToast(message) {
      toast.textContent = message;
      toast.classList.remove("hidden");
      window.clearTimeout(showToast.timer);
      showToast.timer = window.setTimeout(() => toast.classList.add("hidden"), 2200);
    }
    function escapeHtml(value) {
      return String(value ?? "").replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;").replaceAll('"', "&quot;").replaceAll("'", "&#39;");
    }
    function escapeAttr(value) { return escapeHtml(value); }
  </script>
</body>
</html>
